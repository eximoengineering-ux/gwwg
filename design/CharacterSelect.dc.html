<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#0B0B0C;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F5F5F3;}
    a{color:#FF7A1F;} a:hover{color:#FFA45C;}
    .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:#A8A8A4;font-weight:600;}
  </style>
</helmet>
<div dir="rtl" style="width:1440px;height:810px;position:relative;overflow:hidden;background:
  radial-gradient(700px 600px at 50% 70%, rgba(255,122,31,.08), transparent 65%),
  linear-gradient(180deg,#101218 0%,#0B0C10 50%,#0B0B0C 100%);">

  <!-- floor glow under character -->
  <div style="position:absolute;bottom:110px;left:50%;transform:translateX(-50%);width:340px;height:60px;background:radial-gradient(closest-side, rgba(255,122,31,.3), transparent);border-radius:999px;"></div>

  <!-- character spotlight (silhouette placeholder) -->
  <div style="position:absolute;bottom:130px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;">
    <svg width="240" height="420" viewBox="0 0 240 420" fill="none">
      <ellipse cx="120" cy="70" rx="38" ry="42" fill="#1C1C1F" stroke="rgba(255,255,255,.1)"/>
      <path d="M60 190c0-30 27-52 60-52s60 22 60 52l8 120c1 12-8 22-20 22h-16l-6 88h-52l-6-88H72c-12 0-21-10-20-22l8-120z" fill="#1C1C1F" stroke="rgba(255,255,255,.1)"/>
      <path d="M62 200l-20 90c-2 9 4 17 13 18M178 200l20 90c2 9-4 17-13 18" stroke="rgba(255,255,255,.1)" fill="none"/>
    </svg>
    <span style="margin-top:12px;font-size:11px;font-weight:700;color:#78786F;background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:4px 12px;">مجسّم الشخصية داخل اللعبة</span>
  </div>

  <!-- header -->
  <div style="position:absolute;top:36px;inset-inline-start:48px;display:flex;align-items:center;gap:14px;">
    <div style="width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#FF7A1F,#E85D04);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#14100B;">MT</div>
    <div style="display:flex;flex-direction:column;">
      <span style="font-size:20px;font-weight:900;">اختيار الشخصية</span>
      <span style="font-size:12px;color:#78786F;font-weight:600;">mt_characters · حتى 3 شخصيات لكل لاعب</span>
    </div>
  </div>

  <!-- character cards (start side) -->
  <div style="position:absolute;top:120px;inset-inline-start:48px;display:flex;flex-direction:column;gap:14px;width:360px;">

    <!-- selected card -->
    <div style="background:rgba(19,19,21,.92);border:1px solid rgba(255,122,31,.5);border-radius:12px;padding:18px;backdrop-filter:blur(14px);box-shadow:0 0 0 3px rgba(255,122,31,.15), 0 16px 48px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:12px;box-sizing:border-box;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:48px;height:48px;border-radius:11px;background:rgba(255,122,31,.14);border:1px solid rgba(255,122,31,.35);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#FFA45C;">سع</div>
        <div style="display:flex;flex-direction:column;flex:1;">
          <span style="font-size:16px;font-weight:800;">سعود العتيبي</span>
          <span style="font-size:11px;color:#78786F;font-weight:600;" dir="ltr">CID-1042 · 34y</span>
        </div>
        <span style="font-size:10px;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(255,122,31,.14);color:#FFA45C;border:1px solid rgba(255,122,31,.35);">محدد</span>
      </div>
      <div style="display:flex;gap:14px;border-top:1px solid rgba(255,255,255,.08);padding-top:12px;">
        <div class="meta">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
          شرطة — رقيب
        </div>
        <div class="meta">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
          <span dir="ltr">$98,750</span>
        </div>
        <div class="meta">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A8A8A4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2.5 2.5"/></svg>
          قبل ساعتين
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <div style="flex:1;height:44px;border-radius:6px;background:#FF7A1F;color:#14100B;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 18px rgba(255,122,31,.3);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#14100B" stroke="none"><path d="M7 4.5v15l13-7.5z"/></svg>
          دخول المدينة
        </div>
        <div style="width:44px;height:44px;border-radius:6px;background:rgba(255,93,93,.12);border:1px solid rgba(255,93,93,.35);display:flex;align-items:center;justify-content:center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FF5D5D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </div>
      </div>
    </div>

    <!-- normal card -->
    <div style="background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:18px;backdrop-filter:blur(14px);display:flex;align-items:center;gap:12px;box-sizing:border-box;">
      <div style="width:48px;height:48px;border-radius:11px;background:#1C1C1F;border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#A8A8A4;">فم</div>
      <div style="display:flex;flex-direction:column;flex:1;">
        <span style="font-size:15px;font-weight:800;">فهد المطيري</span>
        <div style="display:flex;gap:12px;">
          <span style="font-size:11px;color:#78786F;font-weight:600;">ميكانيكي</span>
          <span style="font-size:11px;color:#78786F;font-weight:600;" dir="ltr">$12,300</span>
          <span style="font-size:11px;color:#78786F;font-weight:600;">قبل 3 أيام</span>
        </div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#78786F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </div>

    <!-- empty slot -->
    <div style="background:rgba(19,19,21,.5);border:1px dashed rgba(255,255,255,.16);border-radius:12px;padding:18px;display:flex;align-items:center;gap:12px;box-sizing:border-box;">
      <div style="width:48px;height:48px;border-radius:11px;background:rgba(255,122,31,.1);border:1px dashed rgba(255,122,31,.4);display:flex;align-items:center;justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div style="display:flex;flex-direction:column;flex:1;">
        <span style="font-size:15px;font-weight:800;color:#FFA45C;">إنشاء شخصية جديدة</span>
        <span style="font-size:11px;color:#78786F;font-weight:600;">الفتحة الثالثة متاحة</span>
      </div>
    </div>
  </div>

  <!-- bottom hints -->
  <div style="position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:20px;background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:10px 22px;backdrop-filter:blur(14px);">
    <div style="display:flex;align-items:center;gap:8px;">
      <span dir="ltr" style="min-width:26px;height:26px;padding:0 7px;border-radius:6px;background:#242428;border:1px solid rgba(255,255,255,.2);border-bottom-width:3px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;font-family:'Segoe UI',Tahoma,sans-serif;box-sizing:border-box;">↑↓</span>
      <span style="font-size:12px;font-weight:700;color:#A8A8A4;">التنقّل</span>
    </div>
    <div style="width:1px;height:18px;background:rgba(255,255,255,.1);"></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span dir="ltr" style="min-width:26px;height:26px;padding:0 7px;border-radius:6px;background:#242428;border:1px solid rgba(255,255,255,.2);border-bottom-width:3px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;font-family:'Segoe UI',Tahoma,sans-serif;box-sizing:border-box;">ENTER</span>
      <span style="font-size:12px;font-weight:700;color:#A8A8A4;">دخول</span>
    </div>
    <div style="width:1px;height:18px;background:rgba(255,255,255,.1);"></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span dir="ltr" style="min-width:26px;height:26px;padding:0 7px;border-radius:6px;background:#242428;border:1px solid rgba(255,255,255,.2);border-bottom-width:3px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;font-family:'Segoe UI',Tahoma,sans-serif;box-sizing:border-box;">R</span>
      <span style="font-size:12px;font-weight:700;color:#A8A8A4;">تدوير الشخصية</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
