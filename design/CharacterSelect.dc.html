<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#070708;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F6F5F2;}
    a{color:#FF7A1F;} a:hover{color:#FFA45C;}
    .kicker{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#6E6C66;}
    .num{font-variant-numeric:tabular-nums;}
    .stripes{background-image:repeating-linear-gradient(-45deg,rgba(255,122,31,.35) 0 2px,transparent 2px 9px);}
    .cham{clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);}
    .glass{background:rgba(12,12,14,.9);}
    .shadow{filter:drop-shadow(0 16px 34px rgba(0,0,0,.5));}
    .br{position:absolute;width:10px;height:10px;}
    .kbd{min-width:24px;height:24px;padding:0 7px;border-radius:6px;background:#1B1B1F;border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.55);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;box-sizing:border-box;transform:skewX(-8deg);}
    .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:#A5A39D;font-weight:600;}
  </style>
</helmet>
<div dir="rtl" style="width:1440px;height:810px;position:relative;overflow:hidden;background:
  radial-gradient(760px 560px at 50% 55%, rgba(255,122,31,.09), transparent 65%),
  linear-gradient(180deg,#0E1017 0%,#0A0B0F 50%,#070708 100%);">

  <!-- dot grid -->
  <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1.4px);background-size:26px 26px;opacity:.5;"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(1000px 600px at 50% 45%, transparent 30%, rgba(7,7,8,.85) 100%);"></div>

  <!-- spotlight cone + floor -->
  <div style="position:absolute;bottom:196px;left:50%;transform:translateX(-50%);width:430px;height:470px;background:linear-gradient(180deg,transparent, rgba(255,122,31,.06) 60%, rgba(255,122,31,.11));clip-path:polygon(40% 0, 60% 0, 100% 100%, 0 100%);filter:blur(6px);"></div>
  <div style="position:absolute;bottom:182px;left:50%;transform:translateX(-50%);width:300px;height:48px;background:radial-gradient(closest-side, rgba(255,122,31,.32), transparent);border-radius:999px;"></div>
  <div style="position:absolute;bottom:194px;left:50%;transform:translateX(-50%);width:236px;height:30px;border:1px solid rgba(255,122,31,.4);border-radius:999px;opacity:.55;"></div>

  <!-- character silhouette (center stage) -->
  <div style="position:absolute;bottom:206px;left:50%;transform:translateX(-50%);">
    <svg width="212" height="378" viewBox="0 0 240 420" fill="none">
      <ellipse cx="120" cy="70" rx="37" ry="41" fill="#141417" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
      <path d="M60 190c0-30 27-52 60-52s60 22 60 52l8 120c1 12-8 22-20 22h-16l-6 88h-52l-6-88H72c-12 0-21-10-20-22l8-120z" fill="#141417" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
      <path d="M62 200l-20 90c-2 9 4 17 13 18M178 200l20 90c2 9-4 17-13 18" stroke="rgba(255,255,255,.08)" stroke-width="1" fill="none"/>
    </svg>
  </div>

  <!-- callout stats panel pointing at the ped -->
  <div dir="rtl" style="position:absolute;top:210px;left:50%;transform:translateX(230px);display:flex;flex-direction:row-reverse;align-items:flex-start;" >
    <div style="display:flex;flex-direction:row-reverse;align-items:center;margin-top:24px;">
      <div style="width:5px;height:5px;border-radius:999px;background:#FF7A1F;box-shadow:0 0 10px 2px rgba(255,122,31,.6);"></div>
      <div style="width:46px;height:1px;background:linear-gradient(90deg,#FF7A1F,rgba(255,122,31,.1));"></div>
    </div>
    <div style="position:relative;">
      <div class="br" style="top:-4px;inset-inline-start:-4px;border-top:2px solid #FF7A1F;border-inline-start:2px solid #FF7A1F;"></div>
      <div class="br" style="bottom:-4px;inset-inline-end:-4px;border-bottom:2px solid #FF7A1F;border-inline-end:2px solid #FF7A1F;"></div>
      <div class="shadow"><div class="cham glass" style="width:250px;padding:16px 18px;display:flex;flex-direction:column;gap:11px;border-top:1px solid rgba(255,255,255,.08);box-sizing:border-box;">
        <div style="display:flex;flex-direction:column;gap:1px;">
          <span style="font-size:17px;font-weight:900;">سعود العتيبي</span>
          <span class="kicker num" dir="ltr" style="font-size:9px;">CID-1042 · AGE 34</span>
        </div>
        <div class="stripes" style="height:3px;opacity:.6;"></div>
        <div class="meta"><span style="display:flex;align-items:center;gap:7px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>الوظيفة</span><span style="color:#F6F5F2;font-weight:700;">شرطة — رقيب</span></div>
        <div class="meta"><span style="display:flex;align-items:center;gap:7px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>الرصيد</span><span class="num" dir="ltr" style="color:#F6F5F2;font-weight:700;">$98,750</span></div>
        <div class="meta"><span style="display:flex;align-items:center;gap:7px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A5A39D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2.5 2.5"/></svg>آخر دخول</span><span style="color:#F6F5F2;font-weight:700;">قبل ساعتين</span></div>
      </div></div>
    </div>
  </div>

  <!-- header -->
  <div style="position:absolute;top:40px;inset-inline-start:56px;display:flex;align-items:center;gap:12px;">
    <div style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#FF8A35,#E85D04);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#14100B;box-shadow:0 4px 16px rgba(255,122,31,.35), inset 0 1px 0 rgba(255,255,255,.4);transform:skewX(-8deg);"><span style="display:inline-block;transform:skewX(8deg);">MT</span></div>
    <div style="display:flex;flex-direction:column;">
      <span class="kicker"><span dir="ltr">mt_characters</span></span>
      <span style="font-size:22px;font-weight:900;line-height:1.2;">اختيار الشخصية</span>
    </div>
  </div>

  <!-- keyboard hints (top-end) -->
  <div style="position:absolute;top:48px;inset-inline-end:56px;display:flex;align-items:center;gap:18px;">
    <div style="display:flex;align-items:center;gap:8px;"><span class="kbd" dir="ltr">◄ ►</span><span style="font-size:11px;font-weight:700;color:#A5A39D;">التنقّل</span></div>
    <div style="display:flex;align-items:center;gap:8px;"><span class="kbd" dir="ltr">ENTER</span><span style="font-size:11px;font-weight:700;color:#A5A39D;">دخول</span></div>
    <div style="display:flex;align-items:center;gap:8px;"><span class="kbd" dir="ltr">R</span><span style="font-size:11px;font-weight:700;color:#A5A39D;">تدوير</span></div>
  </div>

  <!-- ═══ bottom card rail ═══ -->
  <div style="position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:20px;align-items:stretch;">

    <!-- selected -->
    <div style="position:relative;">
      <div class="br" style="top:-4px;inset-inline-start:-4px;border-top:2px solid #FF7A1F;border-inline-start:2px solid #FF7A1F;"></div>
      <div class="br" style="top:-4px;inset-inline-end:-4px;border-top:2px solid #FF7A1F;border-inline-end:2px solid #FF7A1F;"></div>
      <div class="br" style="bottom:-4px;inset-inline-start:-4px;border-bottom:2px solid #FF7A1F;border-inline-start:2px solid #FF7A1F;"></div>
      <div class="br" style="bottom:-4px;inset-inline-end:-4px;border-bottom:2px solid #FF7A1F;border-inline-end:2px solid #FF7A1F;"></div>
      <div class="shadow"><div class="cham glass" style="width:360px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid rgba(255,122,31,.4);box-sizing:border-box;position:relative;overflow:hidden;">
        <div class="stripes" style="position:absolute;top:0;left:14px;width:80px;height:4px;transform:skewX(-30deg);"></div>
        <div style="display:flex;align-items:center;gap:11px;">
          <div style="width:40px;height:40px;border-radius:8px;background:rgba(255,122,31,.12);border:1px solid rgba(255,122,31,.3);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#FFA45C;">سع</div>
          <div style="display:flex;flex-direction:column;flex:1;gap:0;">
            <span style="font-size:15px;font-weight:800;">سعود العتيبي</span>
            <span style="font-size:11px;color:#6E6C66;font-weight:600;">شرطة — رقيب · قبل ساعتين</span>
          </div>
          <div style="width:7px;height:7px;border-radius:999px;background:#FF7A1F;box-shadow:0 0 10px 2px rgba(255,122,31,.6);"></div>
        </div>
        <div style="display:flex;gap:8px;">
          <div style="flex:1;height:40px;border-radius:6px;background:linear-gradient(180deg,#FF8A35,#E85D04);color:#14100B;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(255,122,31,.35), inset 0 1px 0 rgba(255,255,255,.3);transform:skewX(-8deg);">
            <div style="display:flex;align-items:center;gap:8px;transform:skewX(8deg);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#14100B" stroke="none"><path d="M7 4.5v15l13-7.5z"/></svg>
              دخول المدينة
            </div>
          </div>
          <div style="width:40px;height:40px;border-radius:6px;background:rgba(255,93,93,.08);border:1px solid rgba(255,93,93,.25);display:flex;align-items:center;justify-content:center;transform:skewX(-8deg);">
            <svg style="transform:skewX(8deg);" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF5D5D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </div>
        </div>
      </div></div>
    </div>

    <!-- normal -->
    <div class="shadow"><div class="cham glass" style="width:300px;padding:14px 16px;display:flex;align-items:center;gap:11px;border-top:1px solid rgba(255,255,255,.08);box-sizing:border-box;height:100%;">
      <div style="width:40px;height:40px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#A5A39D;">فم</div>
      <div style="display:flex;flex-direction:column;flex:1;gap:1px;">
        <span style="font-size:14px;font-weight:800;">فهد المطيري</span>
        <span style="font-size:11px;color:#6E6C66;font-weight:600;">ميكانيكي · <span class="num" dir="ltr">$12,300</span> · قبل 3 أيام</span>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6E6C66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </div></div>

    <!-- empty -->
    <div class="cham" style="width:300px;background:rgba(14,14,16,.4);border-top:1px dashed rgba(255,255,255,.16);padding:14px 16px;display:flex;align-items:center;gap:11px;box-sizing:border-box;">
      <div style="width:40px;height:40px;border-radius:8px;background:rgba(255,122,31,.08);border:1px dashed rgba(255,122,31,.35);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div style="display:flex;flex-direction:column;flex:1;gap:1px;">
        <span style="font-size:14px;font-weight:800;color:#FFA45C;">إنشاء شخصية جديدة</span>
        <span style="font-size:11px;color:#6E6C66;font-weight:600;">الفتحة الثالثة متاحة</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
