<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#0B0A09;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F7F4EF;}
    a{color:#FF7A1F;} a:hover{color:#FFA45C;}
    .kicker{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7A756C;}
    .num{font-variant-numeric:tabular-nums;}
    .stripes{background-image:repeating-linear-gradient(-45deg,rgba(255,138,53,.3) 0 2px,transparent 2px 9px);}
    .glass{background:rgba(19,16,13,.9);border:1px solid rgba(255,164,92,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
    .shadow{filter:drop-shadow(0 16px 36px rgba(0,0,0,.5));}
    .glowline{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#FF8A35 30%,#FF8A35 70%,transparent);box-shadow:0 0 14px rgba(255,138,53,.55);}
    .kbd{min-width:26px;height:24px;padding:0 8px;border-radius:7px;background:#262019;border:1px solid rgba(255,164,92,.22);box-shadow:inset 0 -2px 0 rgba(0,0,0,.5);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;box-sizing:border-box;transform:skewX(-6deg);}
    .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:#B3ADA3;font-weight:600;}
  </style>
</helmet>
<div dir="rtl" style="width:1440px;height:810px;position:relative;overflow:hidden;background:
  radial-gradient(820px 600px at 50% 58%, rgba(255,122,31,.11), transparent 62%),
  linear-gradient(180deg,#12141C 0%,#0E0C0B 52%,#0B0A09 100%);">

  <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(255,190,130,.05) 1px, transparent 1.4px);background-size:26px 26px;opacity:.5;"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(1000px 620px at 50% 45%, transparent 28%, rgba(11,10,9,.88) 100%);"></div>

  <!-- stage light -->
  <div style="position:absolute;bottom:196px;left:50%;transform:translateX(-50%);width:440px;height:480px;background:linear-gradient(180deg,transparent, rgba(255,138,53,.07) 58%, rgba(255,138,53,.13));clip-path:polygon(41% 0, 59% 0, 100% 100%, 0 100%);filter:blur(8px);"></div>
  <div style="position:absolute;bottom:182px;left:50%;transform:translateX(-50%);width:310px;height:50px;background:radial-gradient(closest-side, rgba(255,138,53,.38), transparent);border-radius:999px;"></div>
  <div style="position:absolute;bottom:194px;left:50%;transform:translateX(-50%);width:240px;height:32px;border:1.5px solid rgba(255,164,92,.45);border-radius:999px;opacity:.6;box-shadow:0 0 20px rgba(255,138,53,.25);"></div>

  <!-- ped -->
  <div style="position:absolute;bottom:206px;left:50%;transform:translateX(-50%);">
    <svg width="212" height="378" viewBox="0 0 240 420" fill="none">
      <ellipse cx="120" cy="70" rx="37" ry="41" fill="#171411" stroke="rgba(255,235,210,.1)" stroke-width="1"/>
      <path d="M60 190c0-30 27-52 60-52s60 22 60 52l8 120c1 12-8 22-20 22h-16l-6 88h-52l-6-88H72c-12 0-21-10-20-22l8-120z" fill="#171411" stroke="rgba(255,235,210,.1)" stroke-width="1"/>
      <path d="M62 200l-20 90c-2 9 4 17 13 18M178 200l20 90c2 9-4 17-13 18" stroke="rgba(255,235,210,.1)" stroke-width="1" fill="none"/>
    </svg>
  </div>

  <!-- stats callout -->
  <div dir="rtl" style="position:absolute;top:206px;left:50%;transform:translateX(230px);display:flex;flex-direction:row-reverse;align-items:flex-start;">
    <div style="display:flex;flex-direction:row-reverse;align-items:center;margin-top:26px;">
      <div style="width:6px;height:6px;border-radius:999px;background:#FF8A35;box-shadow:0 0 12px 3px rgba(255,138,53,.6);"></div>
      <div style="width:44px;height:1px;background:linear-gradient(90deg,#FF8A35,rgba(255,138,53,.05));"></div>
    </div>
    <div class="shadow"><div class="glass" style="border-radius:16px;width:252px;padding:16px 18px;display:flex;flex-direction:column;gap:11px;box-sizing:border-box;position:relative;overflow:hidden;">
      <div class="glowline" style="position:absolute;top:0;left:22px;right:22px;opacity:.7;"></div>
      <div style="display:flex;flex-direction:column;gap:1px;">
        <span style="font-size:17px;font-weight:900;">سعود العتيبي</span>
        <span class="kicker num" dir="ltr" style="font-size:9px;">CID-1042 · AGE 34</span>
      </div>
      <div class="stripes" style="height:4px;border-radius:2px;opacity:.6;"></div>
      <div class="meta"><span style="display:flex;align-items:center;gap:7px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>الوظيفة</span><span style="color:#F7F4EF;font-weight:700;">شرطة — رقيب</span></div>
      <div class="meta"><span style="display:flex;align-items:center;gap:7px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>الرصيد</span><span class="num" dir="ltr" style="color:#F7F4EF;font-weight:700;">$98,750</span></div>
      <div class="meta"><span style="display:flex;align-items:center;gap:7px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2.5 2.5"/></svg>آخر دخول</span><span style="color:#F7F4EF;font-weight:700;">قبل ساعتين</span></div>
    </div></div>
  </div>

  <!-- header -->
  <div style="position:absolute;top:40px;inset-inline-start:56px;display:flex;align-items:center;gap:12px;">
    <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#FF9A3D,#F26B0A);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#1A120B;box-shadow:0 6px 20px rgba(255,122,31,.4), inset 0 1px 0 rgba(255,255,255,.4);transform:skewX(-6deg);"><span style="display:inline-block;transform:skewX(6deg);">MT</span></div>
    <div style="display:flex;flex-direction:column;">
      <span class="kicker"><span dir="ltr">mt_characters</span></span>
      <span style="font-size:22px;font-weight:900;line-height:1.2;">اختيار الشخصية</span>
    </div>
  </div>

  <!-- hints -->
  <div style="position:absolute;top:48px;inset-inline-end:56px;display:flex;align-items:center;gap:18px;">
    <div style="display:flex;align-items:center;gap:8px;"><span class="kbd" dir="ltr">◄ ►</span><span style="font-size:11px;font-weight:700;color:#B3ADA3;">التنقّل</span></div>
    <div style="display:flex;align-items:center;gap:8px;"><span class="kbd" dir="ltr">ENTER</span><span style="font-size:11px;font-weight:700;color:#B3ADA3;">دخول</span></div>
    <div style="display:flex;align-items:center;gap:8px;"><span class="kbd" dir="ltr">R</span><span style="font-size:11px;font-weight:700;color:#B3ADA3;">تدوير</span></div>
  </div>

  <!-- card rail -->
  <div style="position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:20px;align-items:stretch;">
    <!-- selected -->
    <div class="shadow"><div class="glass" style="border-radius:16px;width:360px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;box-sizing:border-box;position:relative;overflow:hidden;border-color:rgba(255,164,92,.4);box-shadow:0 0 0 1px rgba(255,138,53,.35), 0 0 42px rgba(255,122,31,.14), inset 0 1px 0 rgba(255,255,255,.09);">
      <div class="glowline" style="position:absolute;top:0;left:22px;right:22px;"></div>
      <div style="display:flex;align-items:center;gap:11px;">
        <div style="width:42px;height:42px;border-radius:12px;background:rgba(255,138,53,.13);border:1px solid rgba(255,164,92,.35);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#FFA45C;">سع</div>
        <div style="display:flex;flex-direction:column;flex:1;gap:0;">
          <span style="font-size:15px;font-weight:800;">سعود العتيبي</span>
          <span style="font-size:11px;color:#7A756C;font-weight:600;">شرطة — رقيب · قبل ساعتين</span>
        </div>
        <div style="width:8px;height:8px;border-radius:999px;background:#FF8A35;box-shadow:0 0 12px 3px rgba(255,138,53,.6);"></div>
      </div>
      <div style="display:flex;gap:8px;">
        <div style="flex:1;height:42px;border-radius:10px;background:linear-gradient(180deg,#FF9A3D,#F26B0A);color:#1A120B;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(255,122,31,.4), inset 0 1px 0 rgba(255,255,255,.35);transform:skewX(-6deg);">
          <div style="display:flex;align-items:center;gap:8px;transform:skewX(6deg);">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#1A120B" stroke="none"><path d="M7 4.5v15l13-7.5z"/></svg>
            دخول المدينة
          </div>
        </div>
        <div style="width:42px;height:42px;border-radius:10px;background:rgba(255,93,93,.08);border:1px solid rgba(255,93,93,.25);display:flex;align-items:center;justify-content:center;transform:skewX(-6deg);">
          <svg style="transform:skewX(6deg);" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF5D5D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </div>
      </div>
    </div></div>
    <!-- normal -->
    <div class="shadow"><div class="glass" style="border-radius:16px;width:300px;padding:14px 16px;display:flex;align-items:center;gap:11px;box-sizing:border-box;height:100%;">
      <div style="width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,164,92,.12);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;color:#B3ADA3;">فم</div>
      <div style="display:flex;flex-direction:column;flex:1;gap:1px;">
        <span style="font-size:14px;font-weight:800;">فهد المطيري</span>
        <span style="font-size:11px;color:#7A756C;font-weight:600;">ميكانيكي · <span class="num" dir="ltr">$12,300</span> · قبل 3 أيام</span>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7A756C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </div></div>
    <!-- empty -->
    <div style="border-radius:16px;width:300px;background:rgba(19,16,13,.45);border:1px dashed rgba(255,164,92,.25);padding:14px 16px;display:flex;align-items:center;gap:11px;box-sizing:border-box;">
      <div style="width:42px;height:42px;border-radius:12px;background:rgba(255,138,53,.08);border:1px dashed rgba(255,164,92,.4);display:flex;align-items:center;justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div style="display:flex;flex-direction:column;flex:1;gap:1px;">
        <span style="font-size:14px;font-weight:800;color:#FFA45C;">إنشاء شخصية جديدة</span>
        <span style="font-size:11px;color:#7A756C;font-weight:600;">الفتحة الثالثة متاحة</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
