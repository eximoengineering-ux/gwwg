<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#09090B;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F6F5F2;}
    a{color:#FF7A1F;} a:hover{color:#FFA45C;}
    .kicker{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#6E6C66;}
    .num{font-variant-numeric:tabular-nums;}
    .card{background:linear-gradient(180deg,rgba(26,26,29,.95),rgba(16,16,18,.96));border:1px solid rgba(255,255,255,.07);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);box-sizing:border-box;}
    .meta{display:flex;align-items:center;gap:7px;font-size:11px;color:#A5A39D;font-weight:600;}
    .kbd{min-width:24px;height:24px;padding:0 7px;border-radius:6px;background:#1B1B1F;border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.55);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;box-sizing:border-box;}
  </style>
</helmet>
<div dir="rtl" style="width:1440px;height:810px;position:relative;overflow:hidden;background:
  radial-gradient(760px 620px at 62% 66%, rgba(255,122,31,.08), transparent 65%),
  linear-gradient(180deg,#10121A 0%,#0B0C10 50%,#09090B 100%);">

  <!-- spotlight cone + floor -->
  <div style="position:absolute;bottom:120px;left:62%;transform:translateX(-50%);width:460px;height:520px;background:linear-gradient(180deg,transparent, rgba(255,122,31,.06) 60%, rgba(255,122,31,.1));clip-path:polygon(38% 0, 62% 0, 100% 100%, 0 100%);filter:blur(6px);"></div>
  <div style="position:absolute;bottom:104px;left:62%;transform:translateX(-50%);width:320px;height:52px;background:radial-gradient(closest-side, rgba(255,122,31,.3), transparent);border-radius:999px;"></div>
  <div style="position:absolute;bottom:118px;left:62%;transform:translateX(-50%);width:250px;height:34px;border:1px solid rgba(255,122,31,.35);border-radius:999px;opacity:.5;"></div>

  <!-- character silhouette -->
  <div style="position:absolute;bottom:128px;left:62%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;">
    <svg width="230" height="410" viewBox="0 0 240 420" fill="none">
      <ellipse cx="120" cy="70" rx="37" ry="41" fill="#17171A" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
      <path d="M60 190c0-30 27-52 60-52s60 22 60 52l8 120c1 12-8 22-20 22h-16l-6 88h-52l-6-88H72c-12 0-21-10-20-22l8-120z" fill="#17171A" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
      <path d="M62 200l-20 90c-2 9 4 17 13 18M178 200l20 90c2 9-4 17-13 18" stroke="rgba(255,255,255,.08)" stroke-width="1" fill="none"/>
    </svg>
    <span class="kicker" style="margin-top:14px;">In-game Ped Preview</span>
  </div>

  <!-- header -->
  <div style="position:absolute;top:40px;inset-inline-start:56px;display:flex;flex-direction:column;gap:6px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#FF8A35,#E85D04);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#14100B;box-shadow:0 4px 16px rgba(255,122,31,.35), inset 0 1px 0 rgba(255,255,255,.4);">MT</div>
      <div style="display:flex;flex-direction:column;">
        <span class="kicker"><span dir="ltr">mt_characters</span></span>
        <span style="font-size:22px;font-weight:900;line-height:1.2;">اختيار الشخصية</span>
      </div>
    </div>
    <span style="font-size:12px;color:#6E6C66;font-weight:600;">حتى 3 شخصيات لكل لاعب — البيانات تُحفظ لحظياً</span>
  </div>

  <!-- cards column -->
  <div style="position:absolute;top:132px;inset-inline-start:56px;display:flex;flex-direction:column;gap:14px;width:368px;">

    <!-- selected -->
    <div class="card" style="padding:18px;border-color:rgba(255,122,31,.45);box-shadow:0 0 0 3px rgba(255,122,31,.12), 0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08);display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:46px;height:46px;border-radius:12px;background:rgba(255,122,31,.12);border:1px solid rgba(255,122,31,.3);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#FFA45C;">سع</div>
        <div style="display:flex;flex-direction:column;flex:1;gap:1px;">
          <span style="font-size:16px;font-weight:800;">سعود العتيبي</span>
          <span class="kicker num" dir="ltr" style="font-size:9px;">CID-1042 · AGE 34</span>
        </div>
        <div style="width:7px;height:7px;border-radius:999px;background:#FF7A1F;box-shadow:0 0 10px 2px rgba(255,122,31,.6);"></div>
      </div>
      <div style="display:flex;gap:16px;border-top:1px solid rgba(255,255,255,.06);padding-top:12px;">
        <div class="meta">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
          شرطة — رقيب
        </div>
        <div class="meta">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
          <span class="num" dir="ltr">$98,750</span>
        </div>
        <div class="meta">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A5A39D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2.5 2.5"/></svg>
          قبل ساعتين
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <div style="flex:1;height:44px;border-radius:6px;background:linear-gradient(180deg,#FF8A35,#E85D04);color:#14100B;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 20px rgba(255,122,31,.35), inset 0 1px 0 rgba(255,255,255,.3);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="#14100B" stroke="none"><path d="M7 4.5v15l13-7.5z"/></svg>
          دخول المدينة
        </div>
        <div style="width:44px;height:44px;border-radius:6px;background:rgba(255,93,93,.08);border:1px solid rgba(255,93,93,.25);display:flex;align-items:center;justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF5D5D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </div>
      </div>
    </div>

    <!-- normal -->
    <div class="card" style="padding:16px 18px;display:flex;align-items:center;gap:12px;">
      <div style="width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#A5A39D;">فم</div>
      <div style="display:flex;flex-direction:column;flex:1;gap:2px;">
        <span style="font-size:15px;font-weight:800;">فهد المطيري</span>
        <div style="display:flex;gap:12px;">
          <span style="font-size:11px;color:#6E6C66;font-weight:600;">ميكانيكي</span>
          <span class="num" style="font-size:11px;color:#6E6C66;font-weight:600;" dir="ltr">$12,300</span>
          <span style="font-size:11px;color:#6E6C66;font-weight:600;">قبل 3 أيام</span>
        </div>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6E6C66" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </div>

    <!-- empty slot -->
    <div style="background:rgba(16,16,18,.4);border:1px dashed rgba(255,255,255,.14);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:12px;box-sizing:border-box;">
      <div style="width:46px;height:46px;border-radius:12px;background:rgba(255,122,31,.08);border:1px dashed rgba(255,122,31,.35);display:flex;align-items:center;justify-content:center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div style="display:flex;flex-direction:column;flex:1;gap:1px;">
        <span style="font-size:15px;font-weight:800;color:#FFA45C;">إنشاء شخصية جديدة</span>
        <span style="font-size:11px;color:#6E6C66;font-weight:600;">الفتحة الثالثة متاحة</span>
      </div>
    </div>
  </div>

  <!-- bottom hints: quiet strip -->
  <div style="position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:22px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="kbd" dir="ltr">↑↓</span>
      <span style="font-size:12px;font-weight:700;color:#A5A39D;">التنقّل</span>
    </div>
    <div style="width:1px;height:16px;background:rgba(255,255,255,.1);"></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="kbd" dir="ltr">ENTER</span>
      <span style="font-size:12px;font-weight:700;color:#A5A39D;">دخول</span>
    </div>
    <div style="width:1px;height:16px;background:rgba(255,255,255,.1);"></div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="kbd" dir="ltr">R</span>
      <span style="font-size:12px;font-weight:700;color:#A5A39D;">تدوير الشخصية</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
