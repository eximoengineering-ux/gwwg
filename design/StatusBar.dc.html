<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#0B0A09;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F7F4EF;}
    .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);position:relative;overflow:hidden;}
    .barfill{height:100%;border-radius:3px;}
    .kicker{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7A756C;}
    .num{font-variant-numeric:tabular-nums;}
  </style>
</helmet>
<div dir="rtl" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:60px;padding:40px;flex-wrap:wrap;">

  <!-- ═══ full status vertical ═══ -->
  <div style="display:flex;flex-direction:column;gap:16px;width:280px;">
    <!-- health -->
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF5D5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="kicker">الصحة</span>
        </div>
        <span class="num" dir="ltr" style="font-size:12px;color:#F7F4EF;font-weight:800;">85 / 100</span>
      </div>
      <div class="bar"><div class="barfill" style="width:85%;background:linear-gradient(90deg,#FF5D5D,#FF3333);box-shadow:0 0 12px rgba(255,93,93,.6);"></div></div>
    </div>

    <!-- armor -->
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5CA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
          <span class="kicker">الدرع</span>
        </div>
        <span class="num" dir="ltr" style="font-size:12px;color:#F7F4EF;font-weight:800;">45 / 100</span>
      </div>
      <div class="bar"><div class="barfill" style="width:45%;background:linear-gradient(90deg,#5CA8FF,#3D8FFF);box-shadow:0 0 12px rgba(92,168,255,.5);"></div></div>
    </div>

    <!-- hunger -->
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F5B840" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a1 1 0 0 1 0 4H4a1 1 0 0 1 0-4z"/><path d="M6 11c0-3 2.5-5 6-5s6 2 6 5"/><path d="M5 15c0 2 2 4 4 4h6c2 0 4-2 4-4"/></svg>
          <span class="kicker">الجوع</span>
        </div>
        <span class="num" dir="ltr" style="font-size:12px;color:#F7F4EF;font-weight:800;">65 / 100</span>
      </div>
      <div class="bar"><div class="barfill" style="width:65%;background:linear-gradient(90deg,#F5B840,#E6a020);box-shadow:0 0 12px rgba(245,184,64,.5);"></div></div>
    </div>

    <!-- thirst -->
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5CA8FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
          <span class="kicker">العطش</span>
        </div>
        <span class="num" dir="ltr" style="font-size:12px;color:#F7F4EF;font-weight:800;">40 / 100</span>
      </div>
      <div class="bar"><div class="barfill" style="width:40%;background:linear-gradient(90deg,#5CA8FF,#3D8FFF);box-shadow:0 0 12px rgba(92,168,255,.5);"></div></div>
    </div>

    <!-- stamina -->
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:8px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF8A35" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          <span class="kicker">التحمل</span>
        </div>
        <span class="num" dir="ltr" style="font-size:12px;color:#F7F4EF;font-weight:800;">92 / 100</span>
      </div>
      <div class="bar"><div class="barfill" style="width:92%;background:linear-gradient(90deg,#FF8A35,#FFa85c);box-shadow:0 0 12px rgba(255,138,53,.5);"></div></div>
    </div>
  </div>

  <!-- ═══ compact status bar ═══ -->
  <div style="display:flex;flex-direction:column;gap:14px;width:320px;padding:20px;background:linear-gradient(160deg,#241C15 0%,#161311 45%,#100E0D 100%);border:1px solid rgba(255,164,92,.13);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);transform:perspective(1200px) rotateY(6deg) rotateX(-1deg);filter:drop-shadow(0 12px 32px rgba(0,0,0,.55));">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:32px;height:32px;border-radius:8px;background:rgba(255,138,53,.1);border:1px solid rgba(255,164,92,.2);display:flex;align-items:center;justify-content:center;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <div style="flex:1;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
          <span class="kicker">الصحة · الدرع · التحمل</span>
          <span class="num" dir="ltr" style="font-size:11px;color:#B3ADA3;">85 / 45 / 92</span>
        </div>
        <div style="display:flex;gap:2px;">
          <div class="bar" style="flex:1;"><div class="barfill" style="width:85%;background:linear-gradient(90deg,#FF5D5D,#FF3333);box-shadow:0 0 8px rgba(255,93,93,.5);"></div></div>
          <div class="bar" style="flex:1;"><div class="barfill" style="width:45%;background:linear-gradient(90deg,#5CA8FF,#3D8FFF);box-shadow:0 0 8px rgba(92,168,255,.4);"></div></div>
          <div class="bar" style="flex:1;"><div class="barfill" style="width:92%;background:linear-gradient(90deg,#FF8A35,#FFa85c);box-shadow:0 0 8px rgba(255,138,53,.4);"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ warning state ═══ -->
  <div style="display:flex;flex-direction:column;gap:14px;width:320px;padding:20px;background:linear-gradient(160deg,#241C15 0%,#161311 45%,#100E0D 100%);border:1px solid rgba(255,93,93,.2);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.07);transform:perspective(1200px) rotateY(-6deg) rotateX(1deg);filter:drop-shadow(0 12px 32px rgba(0,0,0,.55));">
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
    <div style="animation: pulse 1s ease-in-out infinite;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:32px;height:32px;border-radius:8px;background:rgba(255,93,93,.1);border:1px solid rgba(255,93,93,.3);display:flex;align-items:center;justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF5D5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        </div>
        <div style="flex:1;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <span style="font-size:12px;font-weight:800;color:#FF5D5D;">تحذير — الصحة منخفضة جداً</span>
            <span class="num" dir="ltr" style="font-size:11px;color:#FF5D5D;font-weight:800;">15%</span>
          </div>
          <div class="bar"><div class="barfill" style="width:15%;background:#FF3333;box-shadow:0 0 12px rgba(255,51,51,.7);"></div></div>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
