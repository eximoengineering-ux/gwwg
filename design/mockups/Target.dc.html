<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Segoe UI', system-ui, sans-serif; color: #ECE6D9; }
    a { color: #C3372B; } a:hover { color: #A32A1F; }
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    .scene { position: absolute; inset: 0; background: radial-gradient(1100px 560px at 70% 16%, #1a1d22 0%, rgba(26,29,34,0) 60%), linear-gradient(180deg, #121317 0%, #14151a 52%, #0a0b0d 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%); }
    .tag { position: relative; background: linear-gradient(175deg, #F4EFE4 0%, #EDE6D6 100%); color: #16140F; box-shadow: 0 14px 36px rgba(0,0,0,0.55); clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 50%); }
    .hole { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; border-radius: 50%; background: #101114; box-shadow: 0 0 0 2px rgba(22,20,15,0.6); }
    .lab { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #8A8478; text-transform: uppercase; }
    @keyframes swingIn { 0% { opacity: 0; transform: rotate(6deg) translateX(26px); } 60% { opacity: 1; transform: rotate(-2deg) translateX(0); } 100% { opacity: 1; transform: rotate(0deg); } }
    .swing { opacity: 0; transform-origin: left center; animation: swingIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes drawLine { from { stroke-dashoffset: 60; } to { stroke-dashoffset: 0; } }
    @keyframes reticle { 0%, 100% { transform: scale(1); opacity: 0.95; } 50% { transform: scale(1.05); opacity: 0.7; } }
    @keyframes spinDash { to { stroke-dashoffset: -44; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0a0b0d;">
  <div class="scene"></div>
  <div class="vig"></div>

  <div style="position: absolute; left: 596px; top: 316px; width: 88px; height: 88px;">
    <svg width="88" height="88" viewBox="0 0 88 88" style="overflow: visible; transform-box: fill-box; transform-origin: center; animation: reticle 2.6s ease-in-out infinite;">
      <circle cx="44" cy="44" r="40" fill="none" stroke="#EDE6D6" stroke-width="1.5" stroke-dasharray="4 7" style="animation: spinDash 4s linear infinite;"/>
      <circle cx="44" cy="44" r="28" fill="none" stroke="#C3372B" stroke-width="2"/>
      <path d="M44 4v14M44 70v14M4 44h14M70 44h14" stroke="#C3372B" stroke-width="2" stroke-linecap="round"/>
      <circle cx="44" cy="44" r="3.2" fill="#C3372B"/>
    </svg>
  </div>

  <svg style="position: absolute; left: 640px; top: 300px; overflow: visible;" width="140" height="160" viewBox="0 0 140 160">
    <path d="M44 60 C 70 48, 92 34, 118 30" fill="none" stroke="rgba(237,230,214,0.75)" stroke-width="1.5" stroke-dasharray="60" style="animation: drawLine 0.7s ease-out 0.2s both;"/>
    <path d="M44 62 C 74 62, 96 68, 118 74" fill="none" stroke="rgba(237,230,214,0.45)" stroke-width="1.2" stroke-dasharray="60" style="animation: drawLine 0.7s ease-out 0.32s both;"/>
    <path d="M44 64 C 72 76, 94 98, 118 116" fill="none" stroke="rgba(237,230,214,0.45)" stroke-width="1.2" stroke-dasharray="60" style="animation: drawLine 0.7s ease-out 0.44s both;"/>
  </svg>

  <div style="position: absolute; left: 756px; top: 268px; display: flex; flex-direction: column; gap: 11px; width: 300px;">
    <div class="swing" style="display: flex; align-items: center; gap: 9px; margin-left: 18px; margin-bottom: 2px; animation-delay: 0.05s;">
      <span class="serif" style="font-size: 17px; color: #EDE6D6;">Sultan RS</span>
      <span class="mono" style="font-size: 9.5px; color: #8A8478;">8ABC123 &middot; 2.1M</span>
    </div>

    <div class="tag swing" style="padding: 13px 18px 13px 28px; animation-delay: 0.2s; box-shadow: 0 0 0 2px #C3372B, 0 14px 36px rgba(0,0,0,0.55);">
      <div class="hole"></div>
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span class="serif" style="font-size: 20px;">Open Trunk</span>
        <span class="mono" style="font-size: 10px; color: #C3372B; font-weight: 600;">[1]</span>
      </div>
      <div class="lab" style="margin-top: 3px; color: #C3372B;">50 slot storage &middot; unlocked</div>
    </div>

    <div class="tag swing" style="padding: 11px 18px 11px 28px; width: 240px; animation-delay: 0.32s;">
      <div class="hole"></div>
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 14.5px; font-weight: 600;">Lock Vehicle</span>
        <span class="mono" style="font-size: 10px; color: #57524A;">[2]</span>
      </div>
    </div>

    <div class="tag swing" style="padding: 11px 18px 11px 28px; width: 240px; animation-delay: 0.44s;">
      <div class="hole"></div>
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 14.5px; font-weight: 600;">Push Vehicle</span>
        <span class="mono" style="font-size: 10px; color: #57524A;">[3]</span>
      </div>
    </div>

    <div class="swing" style="margin-left: 18px; margin-top: 2px; animation-delay: 0.56s;">
      <span class="mono" style="font-size: 9.5px; color: #8A8478;">[ALT] HOLD TO KEEP OPEN</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
