<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; color: #F5F1EC; }
    a { color: #FF7A1F; } a:hover { color: #FFB56B; }
    .h { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; }
    .scene { position: absolute; inset: 0; background:
      radial-gradient(1100px 560px at 72% 14%, #1d2534 0%, rgba(29,37,52,0) 60%),
      radial-gradient(700px 380px at 22% 30%, rgba(255,122,31,0.05) 0%, rgba(255,122,31,0) 60%),
      linear-gradient(180deg, #0e1119 0%, #131620 52%, #0a0c11 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.58) 100%); }
    .panel { position: relative; background: linear-gradient(160deg, rgba(26,23,19,0.94), rgba(14,12,10,0.92)); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(14px); }
    .panel::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.016) 0 1px, rgba(0,0,0,0) 1px 3px); }
    .cut { clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
    .kb { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 700; color: #A8A29C; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 5px; padding: 2px 7px; }
    .num { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #A8A29C; flex-shrink: 0; }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0a0c11;">
  <div class="scene"></div>
  <svg style="position: absolute; left: 0; bottom: 0; opacity: 0.75;" width="1280" height="210" viewBox="0 0 1280 210" preserveAspectRatio="none">
    <polygon points="0,210 0,120 60,120 60,88 130,88 130,132 210,132 210,70 236,70 236,52 262,52 262,118 360,118 360,96 430,96 430,140 520,140 520,108 570,108 570,60 590,44 610,60 610,124 720,124 720,92 800,92 800,136 880,136 880,78 940,78 940,116 1040,116 1040,90 1120,90 1120,128 1200,128 1200,102 1280,102 1280,210" fill="#0c0e13"/>
    <polygon points="0,210 0,160 90,160 90,142 180,142 180,168 300,168 300,150 420,150 420,176 560,176 560,154 700,154 700,170 840,170 840,148 980,148 980,172 1120,172 1120,156 1280,156 1280,210" fill="#08090d"/>
    <rect x="222" y="80" width="3" height="4" fill="#FFB56B" opacity="0.55"/><rect x="585" y="66" width="3" height="4" fill="#FF7A1F" opacity="0.7"/>
    <circle cx="590" cy="44" r="2.4" fill="#FF7A1F" opacity="0.9"/>
  </svg>
  <div class="vig"></div>

  <div style="position: absolute; left: 588px; top: 308px; width: 104px; height: 104px;">
    <svg width="104" height="104" viewBox="0 0 104 104" style="overflow: visible;">
      <circle cx="52" cy="52" r="49" fill="none" stroke="rgba(255,122,31,0.5)" stroke-width="1.5" pathLength="360" stroke-dasharray="3 15" style="filter: drop-shadow(0 0 6px rgba(255,122,31,0.4));"/>
      <circle cx="52" cy="52" r="41" fill="none" stroke="rgba(255,122,31,0.25)" stroke-width="1"/>
    </svg>
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 56px; height: 56px; border-radius: 50%; background: rgba(15,13,11,0.88); border: 1px solid rgba(255,122,31,0.6); backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 28px rgba(255,122,31,0.4);">
      <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#FF7A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3" fill="#FF7A1F" stroke="none"/></svg>
    </div>
  </div>

  <div style="position: absolute; left: 692px; top: 358px; width: 46px; height: 2px; background: linear-gradient(90deg, rgba(255,122,31,0.7), rgba(255,122,31,0.1));"></div>

  <div style="position: absolute; left: 740px; top: 282px; display: flex; flex-direction: column; gap: 8px; transform: perspective(1200px) rotateY(-6deg); transform-origin: left center;">
    <div style="display: flex; align-items: center; gap: 8px; margin-left: 2px; margin-bottom: 2px;">
      <span style="font-size: 10px; font-weight: 700; letter-spacing: 0.16em; color: #FFB56B;">SULTAN RS</span>
      <span style="width: 1px; height: 10px; background: rgba(255,255,255,0.15);"></span>
      <span class="h" style="font-size: 10px; font-weight: 600; color: #6B655F;">8ABC123</span>
    </div>

    <div class="panel cut" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px; border-color: rgba(255,122,31,0.6); box-shadow: 0 0 24px rgba(255,122,31,0.2), 0 12px 34px rgba(0,0,0,0.5); transform: translateX(7px);">
      <div style="position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px; background: linear-gradient(180deg, #FF7A1F, rgba(255,122,31,0.25)); box-shadow: 0 0 8px rgba(255,122,31,0.7);"></div>
      <div class="num" style="background: rgba(255,122,31,0.14); border-color: rgba(255,122,31,0.45); color: #FFB56B;">1</div>
      <div style="width: 30px; height: 30px; background: rgba(255,122,31,0.14); border: 1px solid rgba(255,122,31,0.45); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF7A1F" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8zM4 10l2.2-4.6A2 2 0 0 1 8 4.2h8a2 2 0 0 1 1.8 1.2L20 10M12 14v3"/></svg>
      </div>
      <div style="font-size: 14px; font-weight: 700; color: #FFFFFF;">Open Trunk</div>
    </div>

    <div class="panel" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px;">
      <div class="num">2</div>
      <div style="width: 30px; height: 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A8A29C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </div>
      <div style="font-size: 14px; font-weight: 600; color: #D9D4CE;">Lock Vehicle</div>
    </div>

    <div class="panel" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px 12px 12px;">
      <div class="num">3</div>
      <div style="width: 30px; height: 30px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A8A29C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10M12 3l-3.5 3.5M12 3l3.5 3.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
      </div>
      <div style="font-size: 14px; font-weight: 600; color: #D9D4CE;">Push Vehicle</div>
    </div>

    <div style="display: flex; align-items: center; gap: 7px; margin-top: 3px; margin-left: 2px;">
      <span class="kb">ALT</span>
      <span style="font-size: 11px; color: #6B655F; font-weight: 500;">Hold to keep open</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
