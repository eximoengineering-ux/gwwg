<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; color: #F5F1EC; }
    a { color: #FF7A1F; } a:hover { color: #FFB56B; }
    .h { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; }
    .scene { position: absolute; inset: 0; background:
      radial-gradient(1100px 560px at 72% 18%, #1c2330 0%, rgba(28,35,48,0) 62%),
      radial-gradient(860px 480px at 16% 85%, #2a2018 0%, rgba(42,32,24,0) 60%),
      linear-gradient(180deg, #10131b 0%, #12151d 46%, #0a0c11 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0a0c11;">
  <div class="scene"></div>
  <div class="vig"></div>

  <div style="position: absolute; left: 596px; top: 316px; width: 88px; height: 88px;">
    <div style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid rgba(255,122,31,0.45); box-shadow: 0 0 30px rgba(255,122,31,0.25), inset 0 0 20px rgba(255,122,31,0.1);"></div>
    <div style="position: absolute; left: 50%; top: -7px; width: 1.5px; height: 12px; background: rgba(255,122,31,0.7); transform: translateX(-50%);"></div>
    <div style="position: absolute; left: 50%; bottom: -7px; width: 1.5px; height: 12px; background: rgba(255,122,31,0.7); transform: translateX(-50%);"></div>
    <div style="position: absolute; top: 50%; left: -7px; height: 1.5px; width: 12px; background: rgba(255,122,31,0.7); transform: translateY(-50%);"></div>
    <div style="position: absolute; top: 50%; right: -7px; height: 1.5px; width: 12px; background: rgba(255,122,31,0.7); transform: translateY(-50%);"></div>
    <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 52px; height: 52px; border-radius: 50%; background: rgba(15,13,11,0.85); border: 1px solid rgba(255,122,31,0.6); backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 24px rgba(255,122,31,0.35);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF7A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3" fill="#FF7A1F" stroke="none"/></svg>
    </div>
  </div>

  <div style="position: absolute; left: 716px; top: 296px; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 11px; background: rgba(21,19,16,0.9); border: 1px solid rgba(255,122,31,0.6); border-radius: 12px; backdrop-filter: blur(14px); padding: 11px 16px 11px 12px; box-shadow: 0 0 22px rgba(255,122,31,0.2), 0 12px 34px rgba(0,0,0,0.5); transform: translateX(6px);">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: rgba(255,122,31,0.15); border: 1px solid rgba(255,122,31,0.45); display: flex; align-items: center; justify-content: center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF7A1F" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8zM4 10l2.2-4.6A2 2 0 0 1 8 4.2h8a2 2 0 0 1 1.8 1.2L20 10M12 14v3"/></svg>
      </div>
      <div>
        <div style="font-size: 14px; font-weight: 700; color: #FFFFFF;">Open Trunk</div>
        <div style="font-size: 11px; color: #FFB56B; margin-top: 1px;">Sultan RS &middot; 8ABC123</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 11px; background: rgba(21,19,16,0.82); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; backdrop-filter: blur(14px); padding: 11px 16px 11px 12px;">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A8A29C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      </div>
      <div style="font-size: 14px; font-weight: 600; color: #D9D4CE;">Lock Vehicle</div>
    </div>

    <div style="display: flex; align-items: center; gap: 11px; background: rgba(21,19,16,0.82); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; backdrop-filter: blur(14px); padding: 11px 16px 11px 12px;">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A8A29C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v10M12 3l-3.5 3.5M12 3l3.5 3.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
      </div>
      <div style="font-size: 14px; font-weight: 600; color: #D9D4CE;">Push Vehicle</div>
    </div>

    <div style="display: flex; align-items: center; gap: 7px; margin-top: 4px; margin-left: 2px;">
      <span class="h" style="font-size: 10.5px; font-weight: 700; color: #A8A29C; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 5px; padding: 2px 7px;">ALT</span>
      <span style="font-size: 11px; color: #6B655F; font-weight: 500;">Hold to keep open</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
