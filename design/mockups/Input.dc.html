<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; color: #F2F3F7; }
    a { color: #8B93FF; } a:hover { color: #AEB4FF; }
    .d { font-family: 'Sora', 'Segoe UI', system-ui, sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
    .scene { position: absolute; inset: 0; background:
      radial-gradient(1000px 520px at 70% 12%, #1a1d28 0%, rgba(26,29,40,0) 60%),
      radial-gradient(700px 400px at 18% 78%, rgba(139,147,255,0.05) 0%, rgba(139,147,255,0) 60%),
      linear-gradient(180deg, #101116 0%, #12131a 52%, #0b0c10 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.6) 100%); }
    .lab { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5D616E; }
    .field { background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; height: 46px; display: flex; align-items: center; padding: 0 15px; box-sizing: border-box; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04); }
    @keyframes pop { from { opacity: 0; transform: translate(-50%, -47%) scale(0.96); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .rise { opacity: 0; animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes caret { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0b0c10;">
  <div class="scene"></div>
  <div class="vig"></div>

  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 440px; background: rgba(23,24,30,0.85); border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; backdrop-filter: blur(28px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 34px 90px rgba(0,0,0,0.6); padding: 28px 30px 26px; box-sizing: border-box; animation: pop 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;">

    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="width: 42px; height: 42px; border-radius: 14px; background: linear-gradient(140deg, rgba(139,147,255,0.22), rgba(139,147,255,0.08)); border: 1px solid rgba(139,147,255,0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#AEB4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v13.5M4 19.5a1.5 1.5 0 0 0 3 0M20 19.5a1.5 1.5 0 0 1-3 0M8 8h8M8 12h5"/></svg>
      </div>
      <div style="flex: 1;">
        <div class="d" style="font-size: 18px; font-weight: 600; letter-spacing: -0.01em;">Vehicle registration</div>
        <div style="font-size: 12px; color: #9CA0AE; margin-top: 3px; font-weight: 500;">Los Santos DMV &middot; takes about a minute</div>
      </div>
      <div style="width: 30px; height: 30px; border-radius: 10px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9CA0AE" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </div>
    </div>

    <div class="rise" style="margin-top: 22px; animation-delay: 0.12s;">
      <div class="lab">Plate</div>
      <div class="field" style="margin-top: 7px; border-color: rgba(139,147,255,0.5); box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 0 0 3px rgba(139,147,255,0.14);">
        <span class="d num" style="font-size: 15px; font-weight: 600; letter-spacing: 0.14em;">NOVA 21</span>
        <span style="width: 2px; height: 18px; background: #8B93FF; margin-left: 3px; border-radius: 1px; animation: caret 1.2s step-end infinite;"></span>
        <span class="num" style="margin-left: auto; font-size: 11px; color: #5D616E; font-weight: 600;">7 / 8</span>
      </div>
    </div>

    <div class="rise" style="display: flex; gap: 12px; margin-top: 16px; animation-delay: 0.2s;">
      <div style="flex: 1;">
        <div class="lab">Owner</div>
        <div class="field" style="margin-top: 7px;"><span style="font-size: 13.5px; color: #C6C9D4; font-weight: 600;">Ray Calderon</span></div>
      </div>
      <div style="width: 120px;">
        <div class="lab">Citizen ID</div>
        <div class="field num" style="margin-top: 7px;"><span style="font-size: 13px; color: #9CA0AE; font-weight: 600;">NV-2148</span></div>
      </div>
    </div>

    <div class="rise" style="margin-top: 16px; animation-delay: 0.28s;">
      <div class="lab">Class</div>
      <div style="display: flex; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 4px; margin-top: 7px;">
        <div style="flex: 1; text-align: center; padding: 8px 0; border-radius: 9px; background: rgba(139,147,255,0.16); box-shadow: inset 0 0 0 1px rgba(139,147,255,0.35); color: #DDE0FF; font-size: 12.5px; font-weight: 800;">Civilian</div>
        <div style="flex: 1; text-align: center; padding: 8px 0; color: #9CA0AE; font-size: 12.5px; font-weight: 600;">Commercial</div>
        <div style="flex: 1; text-align: center; padding: 8px 0; color: #9CA0AE; font-size: 12.5px; font-weight: 600;">Emergency</div>
      </div>
    </div>

    <div class="rise" style="display: flex; align-items: center; justify-content: space-between; margin-top: 18px; padding: 13px 15px; border-radius: 12px; background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.06); animation-delay: 0.36s;">
      <div>
        <div style="font-size: 12.5px; font-weight: 700; color: #C6C9D4;">Total due today</div>
        <div style="font-size: 11px; color: #5D616E; margin-top: 2px; font-weight: 500;">Registration $800 &middot; Insurance $450</div>
      </div>
      <span class="d num" style="font-size: 21px; font-weight: 700;">$1,250</span>
    </div>

    <div class="rise" style="display: flex; gap: 10px; margin-top: 20px; animation-delay: 0.44s;">
      <div style="flex: 1; height: 46px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); color: #C6C9D4; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; justify-content: center;">Cancel</div>
      <div style="flex: 1.6; height: 46px; border-radius: 12px; background: linear-gradient(140deg, #8B93FF, #6E6BFF); color: #0E0F14; font-weight: 800; font-size: 13.5px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 26px rgba(110,107,255,0.35), inset 0 1px 0 rgba(255,255,255,0.35);">Confirm &amp; pay</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
