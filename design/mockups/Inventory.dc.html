<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>

<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; color: #F5F1EC; }
    a { color: #FF7A1F; } a:hover { color: #FFB56B; }
    .h { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; }
    .scene { position: absolute; inset: 0; background:
      radial-gradient(1100px 560px at 72% 14%, #1d2534 0%, rgba(29,37,52,0) 60%),
      linear-gradient(180deg, #0e1119 0%, #131620 52%, #0a0c11 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0.3) 45%, rgba(0,0,0,0.7) 100%); }
    .panel { position: relative; background: linear-gradient(160deg, rgba(26,23,19,0.94), rgba(14,12,10,0.92)); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(14px); }
    .panel::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.016) 0 1px, rgba(0,0,0,0) 1px 3px); }
    .cut { clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
    .lab { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #6B655F; }
    .slot { position: relative; width: auto; height: 72px; background: rgba(12,11,9,0.85); border: 1px solid rgba(255,255,255,0.07); box-sizing: border-box; }
    .qty { position: absolute; top: 4px; right: 6px; font-family: 'Space Grotesk', sans-serif; font-size: 10px; font-weight: 700; color: #A8A29C; }
    .iname { position: absolute; left: 6px; right: 6px; bottom: 4px; font-size: 8.5px; font-weight: 600; color: #A8A29C; letter-spacing: 0.03em; white-space: nowrap; overflow: hidden; }
    .dur { position: absolute; left: 5px; right: 5px; bottom: 16px; height: 2.5px; background: rgba(255,255,255,0.1); }
    .ico { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .rise { opacity: 0; animation: rise 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes fillW { from { width: 0; } }
    @keyframes riseC { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0a0c11;">
  <div class="scene"></div>
  <div class="vig"></div>

  <div class="panel cut rise" style="position: absolute; left: 92px; top: 84px; width: 418px; padding: 18px 20px; box-sizing: border-box;">

      <div class="h" style="font-size: 15px; font-weight: 700;">POCKETS</div>

        <span class="h" style="font-size: 11.5px; font-weight: 700; color: #FFB56B;">14.2<span style="color: #6B655F;"> / 40kg</span></span>
      </div>
    </div>
    <div style="margin-top: 9px; height: 5px; background: rgba(255,255,255,0.08);"><div style="width: 36%; height: 100%; background: linear-gradient(90deg, #FF7A1F, #FFB56B); animation: fillW 1s cubic-bezier(0.3, 0.7, 0.2, 1) 0.4s both;"></div></div>

    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; margin-top: 14px;">

        <span class="h qty" style="color: #FFB56B;">1</span>
        <svg class="ico" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFB56B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.6h17.4v4.1h-3.1l-.7 2.6a2 2 0 0 1-1.9 1.5h-2.9l1.1-4.1H8.9L7.6 16H4.7L6 11.7H3V7.6zM20.4 7.6l1.1-2.6"/></svg>
        <div class="dur"><div style="width: 82%; height: 100%; background: #42D392;"></div></div>
        <span class="iname" style="color: #FFB56B;">Pistol MK2</span>
      </div>
      <div class="slot"><span class="h qty">24</span><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D9D4CE" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="4" width="10" height="16" rx="2"/><path d="M10 4V2.5h4V4M7 9h10"/></svg><span class="iname">9mm Ammo</span></div>
      <div class="slot"><span class="h qty">3</span><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D9D4CE" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5a7.5 7.5 0 0 1 15 0v.5h-15v-.5zM4 13h16M4.5 16.5h15v.3a2.7 2.7 0 0 1-2.7 2.7H7.2a2.7 2.7 0 0 1-2.7-2.7v-.3z"/></svg><span class="iname">Burger</span></div>
      <div class="slot"><span class="h qty">5</span><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#45C8D8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v4l-3.5 8a4 4 0 0 0 3.7 5.5h3.6A4 4 0 0 0 17.5 15L14 7V3"/></svg><span class="iname">Water</span></div>
      <div class="slot"><span class="h qty">2</span><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#42D392" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7" width="17" height="12" rx="2"/><path d="M12 10v6M9 13h6"/></svg><div class="dur"><div style="width: 60%; height: 100%; background: #E8B04B;"></div></div><span class="iname">Medkit</span></div>
      <div class="slot"><span class="h qty">1</span><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D9D4CE" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="2.5" width="11" height="19" rx="2.8"/><path d="M9.3 4.6h3.4"/></svg><span class="iname">Phone</span></div>
      <div class="slot"><span class="h qty">2,840</span><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#42D392" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/></svg><span class="iname">Cash</span></div>
      <div class="slot"><span class="h qty">1</span><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8B04B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4.5 4.5 0 0 0-6 6L3 18v3h3l5.5-5.5a4.5 4.5 0 0 0 6-6L14 13l-3-3 3.5-3.5z"/></svg><div class="dur"><div style="width: 90%; height: 100%; background: #42D392;"></div></div><span class="iname">Repair Kit</span></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
    </div>
  </div>

  <div class="rise" style="position: absolute; left: 542px; top: 220px; width: 196px; display: flex; flex-direction: column; gap: 8px; animation-delay: 0.15s;">
    <div class="panel" style="padding: 12px 14px;">
      <div class="lab" style="color: #FFB56B;">Pistol MK2</div>
      <div style="font-size: 10.5px; color: #A8A29C; line-height: 1.5; margin-top: 5px;">Serial EMB-7741 &middot; 1.1kg<br>Durability 82%</div>
    </div>
    <div class="cut" style="height: 38px; background: linear-gradient(135deg, #FF7A1F, #E8540E); color: #17100A; font-weight: 700; font-size: 12.5px; display: flex; align-items: center; justify-content: center;">Use</div>
    <div style="height: 38px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); color: #D9D4CE; font-weight: 600; font-size: 12.5px; display: flex; align-items: center; justify-content: center;">Give</div>
    <div style="height: 38px; background: rgba(244,84,78,0.08); border: 1px solid rgba(244,84,78,0.3); color: #F4544E; font-weight: 600; font-size: 12.5px; display: flex; align-items: center; justify-content: center;">Drop</div>
    <div style="display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 2px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B655F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13M17 7l-3.5-3.5M20 17H7M7 17l3.5 3.5"/></svg>
      <span style="font-size: 10px; color: #6B655F; font-weight: 600;">DRAG TO MOVE</span>
    </div>
  </div>

  <div class="panel cut rise" style="position: absolute; right: 92px; top: 84px; width: 418px; padding: 18px 20px; box-sizing: border-box; animation-delay: 0.1s;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="h" style="font-size: 15px; font-weight: 700;">TRUNK <span style="color: #6B655F; font-size: 11px; font-weight: 600;">&middot; SULTAN RS</span></div>
      <span class="h" style="font-size: 11.5px; font-weight: 700; color: #FFB56B;">9.6<span style="color: #6B655F;"> / 60kg</span></span>
    </div>
    <div style="margin-top: 9px; height: 5px; background: rgba(255,255,255,0.08);"><div style="width: 16%; height: 100%; background: linear-gradient(90deg, #FF7A1F, #FFB56B); animation: fillW 1s cubic-bezier(0.3, 0.7, 0.2, 1) 0.5s both;"></div></div>

    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 7px; margin-top: 14px;">
      <div class="slot"><span class="h qty">2</span><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8B04B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h8a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2zM15 9h2.5a2 2 0 0 1 2 2v6a1.8 1.8 0 0 0 3.6 0V9.8L20 6.5M6 8h6"/></svg><span class="iname">Jerry Can</span></div>
      <div class="slot"><span class="h qty">4</span><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D9D4CE" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/></svg><span class="iname">Wheel</span></div>
      <div class="slot"><span class="h qty">1</span><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B98CF0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="11" rx="2"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h7A1.5 1.5 0 0 1 17 6.5V8M8 12.5h8"/></svg><span class="iname">Toolbox</span></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
      <div class="slot"></div>
    </div>
  </div>

  <div style="position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); display: flex; gap: 8px; opacity: 0; animation: riseC 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;">
    <div class="slot" style="width: 62px; height: 62px; border-color: rgba(255,122,31,0.5); box-shadow: 0 0 14px rgba(255,122,31,0.15);"><span class="h" style="position: absolute; top: 3px; left: 6px; font-size: 9.5px; font-weight: 700; color: #FFB56B;">1</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFB56B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.6h17.4v4.1h-3.1l-.7 2.6a2 2 0 0 1-1.9 1.5h-2.9l1.1-4.1H8.9L7.6 16H4.7L6 11.7H3V7.6z"/></svg></div>
    <div class="slot" style="width: 62px; height: 62px;"><span class="h" style="position: absolute; top: 3px; left: 6px; font-size: 9.5px; font-weight: 700; color: #6B655F;">2</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#D9D4CE" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5a7.5 7.5 0 0 1 15 0v.5h-15v-.5zM4 13h16M4.5 16.5h15v.3a2.7 2.7 0 0 1-2.7 2.7H7.2a2.7 2.7 0 0 1-2.7-2.7v-.3z"/></svg></div>
    <div class="slot" style="width: 62px; height: 62px;"><span class="h" style="position: absolute; top: 3px; left: 6px; font-size: 9.5px; font-weight: 700; color: #6B655F;">3</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#45C8D8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v4l-3.5 8a4 4 0 0 0 3.7 5.5h3.6A4 4 0 0 0 17.5 15L14 7V3"/></svg></div>
    <div class="slot" style="width: 62px; height: 62px;"><span class="h" style="position: absolute; top: 3px; left: 6px; font-size: 9.5px; font-weight: 700; color: #6B655F;">4</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#42D392" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7" width="17" height="12" rx="2"/><path d="M12 10v6M9 13h6"/></svg></div>
    <div class="slot" style="width: 62px; height: 62px;"><span class="h" style="position: absolute; top: 3px; left: 6px; font-size: 9.5px; font-weight: 700; color: #6B655F;">5</span></div>

</div>
