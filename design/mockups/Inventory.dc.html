<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Segoe UI', system-ui, sans-serif; color: #ECE6D9; }
    a { color: #C3372B; } a:hover { color: #A32A1F; }
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    .scene { position: absolute; inset: 0; background: radial-gradient(1100px 560px at 70% 16%, #1a1d22 0%, rgba(26,29,34,0) 60%), linear-gradient(180deg, #121317 0%, #14151a 52%, #0a0b0d 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0.2) 45%, rgba(0,0,0,0.62) 100%); }
    .card { position: relative; background: linear-gradient(175deg, #F4EFE4 0%, #EDE6D6 100%); color: #16140F; box-shadow: 0 22px 54px rgba(0,0,0,0.6); }
    .card::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(rgba(22,20,15,0.045) 1px, transparent 1px); background-size: 5px 5px; }
    .lab { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #8A8478; text-transform: uppercase; }
    .slot { position: relative; height: 70px; border: 1px solid rgba(22,20,15,0.45); background: #F7F2E8; box-sizing: border-box; }
    .qty { position: absolute; top: 3px; right: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 600; color: #57524A; }
    .iname { position: absolute; left: 5px; right: 5px; bottom: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 7px; font-weight: 600; color: #8A8478; letter-spacing: 0.04em; white-space: nowrap; overflow: hidden; text-transform: uppercase; }
    .dur { position: absolute; left: 4px; right: 4px; bottom: 13px; height: 2px; background: rgba(22,20,15,0.15); }
    .ico { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); }
    .btnInk { background: #16140F; color: #F1EBDF; font-weight: 700; }
    .btnLine { border: 1.5px solid #16140F; color: #16140F; font-weight: 700; box-sizing: border-box; }
    @keyframes deal { from { opacity: 0; transform: translateY(26px) rotate(-1.2deg); } to { opacity: 1; transform: none; } }
    .deal { opacity: 0; animation: deal 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes growW { from { width: 0; } }
    @keyframes riseC { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0a0b0d;">
  <div class="scene"></div>
  <div class="vig"></div>

  <div class="card deal" style="position: absolute; left: 88px; top: 74px; width: 428px; padding: 20px 24px 18px;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div>
        <div class="lab" style="color: #C3372B;">Manifest A &middot; Carried</div>
        <div class="serif" style="font-size: 25px; margin-top: 3px;">Pockets</div>
      </div>
      <div style="text-align: right;">
        <span class="serif" style="font-size: 19px;">14.2</span><span class="mono" style="font-size: 9.5px; color: #8A8478;"> / 40 KG</span>
      </div>
    </div>
    <div style="margin-top: 8px; height: 7px; border: 1px solid #16140F; padding: 1.5px; box-sizing: border-box;"><div style="width: 36%; height: 100%; background: #16140F; animation: growW 1s cubic-bezier(0.3, 0.7, 0.2, 1) 0.4s both;"></div></div>
    <div style="height: 2.5px; border-top: 1.5px solid #16140F; border-bottom: 1px solid #16140F; margin: 12px 0;"></div>

    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;">
      <div class="slot" style="border: 2px solid #C3372B; box-shadow: 2px 2px 0 rgba(195,55,43,0.3);">
        <span class="qty" style="color: #C3372B;">1</span>
        <svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C3372B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.6h17.4v4.1h-3.1l-.7 2.6a2 2 0 0 1-1.9 1.5h-2.9l1.1-4.1H8.9L7.6 16H4.7L6 11.7H3V7.6zM20.4 7.6l1.1-2.6"/></svg>
        <div class="dur"><div style="width: 82%; height: 100%; background: #2E7D5B;"></div></div>
        <span class="iname" style="color: #C3372B;">Pistol MK2</span>
      </div>
      <div class="slot"><span class="qty">24</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="4" width="10" height="16" rx="2"/><path d="M10 4V2.5h4V4M7 9h10"/></svg><span class="iname">9mm</span></div>
      <div class="slot"><span class="qty">3</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5a7.5 7.5 0 0 1 15 0v.5h-15v-.5zM4 13h16M4.5 16.5h15v.3a2.7 2.7 0 0 1-2.7 2.7H7.2a2.7 2.7 0 0 1-2.7-2.7v-.3z"/></svg><span class="iname">Burger</span></div>
      <div class="slot"><span class="qty">5</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v4l-3.5 8a4 4 0 0 0 3.7 5.5h3.6A4 4 0 0 0 17.5 15L14 7V3"/></svg><span class="iname">Water</span></div>
      <div class="slot"><span class="qty">2</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7" width="17" height="12" rx="2"/><path d="M12 10v6M9 13h6"/></svg><div class="dur"><div style="width: 60%; height: 100%; background: #B07818;"></div></div><span class="iname">Medkit</span></div>
      <div class="slot"><span class="qty">1</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="2.5" width="11" height="19" rx="2.8"/><path d="M9.3 4.6h3.4"/></svg><span class="iname">Phone</span></div>
      <div class="slot"><span class="qty">2,840</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2E7D5B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/></svg><span class="iname">Cash</span></div>
      <div class="slot"><span class="qty">1</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4.5 4.5 0 0 0-6 6L3 18v3h3l5.5-5.5a4.5 4.5 0 0 0 6-6L14 13l-3-3 3.5-3.5z"/></svg><div class="dur"><div style="width: 90%; height: 100%; background: #2E7D5B;"></div></div><span class="iname">Repair Kit</span></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
    </div>
  </div>

  <div class="deal" style="position: absolute; left: 546px; top: 214px; width: 188px; display: flex; flex-direction: column; gap: 8px; animation-delay: 0.15s;">
    <div class="card" style="padding: 12px 14px; box-shadow: 0 0 0 2px #C3372B, 0 14px 34px rgba(0,0,0,0.5);">
      <div class="lab" style="color: #C3372B;">In Hand</div>
      <div class="serif" style="font-size: 18px; margin-top: 3px;">Pistol MK2</div>
      <div class="mono" style="font-size: 8.5px; color: #57524A; margin-top: 4px; line-height: 1.7;">SERIAL MRL-7741<br>1.1 KG &middot; COND. 82%</div>
    </div>
    <div class="btnInk" style="height: 38px; display: flex; align-items: center; justify-content: center; font-size: 12px; box-shadow: 0 10px 26px rgba(0,0,0,0.5);">Use</div>
    <div class="card btnLine" style="height: 38px; display: flex; align-items: center; justify-content: center; font-size: 12px; border: none;">Hand Over</div>
    <div class="card" style="height: 38px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #C3372B; box-shadow: inset 0 0 0 1.5px #C3372B, 0 10px 26px rgba(0,0,0,0.5);">Drop</div>
    <div class="mono" style="text-align: center; font-size: 8.5px; color: #8A8478; letter-spacing: 0.14em; margin-top: 2px;">DRAG BETWEEN SHEETS</div>
  </div>

  <div class="card deal" style="position: absolute; right: 88px; top: 74px; width: 428px; padding: 20px 24px 18px; animation-delay: 0.1s;">
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
      <div>
        <div class="lab">Manifest B &middot; Vehicle</div>
        <div class="serif" style="font-size: 25px; margin-top: 3px;">Trunk <span style="font-style: italic; font-size: 16px; color: #57524A;">&mdash; Sultan RS</span></div>
      </div>
      <div style="text-align: right;">
        <span class="serif" style="font-size: 19px;">9.6</span><span class="mono" style="font-size: 9.5px; color: #8A8478;"> / 60 KG</span>
      </div>
    </div>
    <div style="margin-top: 8px; height: 7px; border: 1px solid #16140F; padding: 1.5px; box-sizing: border-box;"><div style="width: 16%; height: 100%; background: #16140F; animation: growW 1s cubic-bezier(0.3, 0.7, 0.2, 1) 0.5s both;"></div></div>
    <div style="height: 2.5px; border-top: 1.5px solid #16140F; border-bottom: 1px solid #16140F; margin: 12px 0;"></div>

    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px;">
      <div class="slot"><span class="qty">2</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h8a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2zM15 9h2.5a2 2 0 0 1 2 2v6a1.8 1.8 0 0 0 3.6 0V9.8L20 6.5M6 8h6"/></svg><span class="iname">Jerry Can</span></div>
      <div class="slot"><span class="qty">4</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.6"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3"/></svg><span class="iname">Wheel</span></div>
      <div class="slot"><span class="qty">1</span><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="11" rx="2"/><path d="M7 8V6.5A1.5 1.5 0 0 1 8.5 5h7A1.5 1.5 0 0 1 17 6.5V8M8 12.5h8"/></svg><span class="iname">Toolbox</span></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
      <div class="slot" style="background: repeating-linear-gradient(45deg, #F7F2E8 0 8px, #F1EBDF 8px 16px);"></div>
    </div>
  </div>

  <div style="position: absolute; left: 50%; bottom: 42px; display: flex; gap: 7px; opacity: 0; animation: riseC 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards; transform: translateX(-50%);">
    <div class="card" style="width: 60px; height: 60px; box-shadow: 0 0 0 2px #C3372B, 0 12px 30px rgba(0,0,0,0.5);"><span class="serif" style="position: absolute; top: 2px; left: 7px; font-style: italic; font-size: 13px; color: #C3372B;">1</span><svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#C3372B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="top: 55%;"><path d="M3 7.6h17.4v4.1h-3.1l-.7 2.6a2 2 0 0 1-1.9 1.5h-2.9l1.1-4.1H8.9L7.6 16H4.7L6 11.7H3V7.6z"/></svg></div>
    <div class="card" style="width: 60px; height: 60px;"><span class="serif" style="position: absolute; top: 2px; left: 7px; font-style: italic; font-size: 13px; color: #8A8478;">2</span><svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="top: 55%;"><path d="M4.5 9.5a7.5 7.5 0 0 1 15 0v.5h-15v-.5zM4 13h16M4.5 16.5h15v.3a2.7 2.7 0 0 1-2.7 2.7H7.2a2.7 2.7 0 0 1-2.7-2.7v-.3z"/></svg></div>
    <div class="card" style="width: 60px; height: 60px;"><span class="serif" style="position: absolute; top: 2px; left: 7px; font-style: italic; font-size: 13px; color: #8A8478;">3</span><svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="top: 55%;"><path d="M9 3h6M10 3v4l-3.5 8a4 4 0 0 0 3.7 5.5h3.6A4 4 0 0 0 17.5 15L14 7V3"/></svg></div>
    <div class="card" style="width: 60px; height: 60px;"><span class="serif" style="position: absolute; top: 2px; left: 7px; font-style: italic; font-size: 13px; color: #8A8478;">4</span><svg class="ico" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="top: 55%;"><rect x="3.5" y="7" width="17" height="12" rx="2"/><path d="M12 10v6M9 13h6"/></svg></div>
    <div class="card" style="width: 60px; height: 60px;"><span class="serif" style="position: absolute; top: 2px; left: 7px; font-style: italic; font-size: 13px; color: #8A8478;">5</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
