    body { margin: 0; font-family: 'Archivo', 'Segoe UI', system-ui, sans-serif; color: #16140F; }
    a { color: #C3372B; } a:hover { color: #A32A1F; }
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    .desk { position: absolute; inset: 0; background: linear-gradient(180deg, #101113 0%, #0c0d0e 55%, #08090a 100%); }
    .lab { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #8A8478; text-transform: uppercase; }
    .ltag { position: relative; background: linear-gradient(175deg, #F4EFE4 0%, #EDE6D6 100%); box-shadow: 0 14px 36px rgba(0,0,0,0.5); clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%); padding: 14px 30px 13px 18px; box-sizing: border-box; }
    .lhole { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 8px; height: 8px; border-radius: 50%; background: #0c0d0e; box-shadow: 0 0 0 2px rgba(22,20,15,0.55); }
    @keyframes deal { from { opacity: 0; transform: translateY(24px) rotate(-1.5deg); } to { opacity: 1; transform: none; } }
    .deal { opacity: 0; animation: deal 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes pinDrop { 0% { opacity: 0; transform: translateY(-16px) scale(1.4); } 65% { opacity: 1; transform: translateY(1px) scale(0.95); } 100% { opacity: 1; transform: none; } }
    .pin { opacity: 0; animation: pinDrop 0.45s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes ping { 0% { transform: scale(0.5); opacity: 0.7; } 100% { transform: scale(2.6); opacity: 0; } }
    .ping { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid #C3372B; animation: ping 1.9s ease-out infinite; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
