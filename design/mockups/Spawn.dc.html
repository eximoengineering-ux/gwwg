    .lab { font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #8A8177; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    .rise { opacity: 0; animation: rise 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes pinDrop { 0% { opacity: 0; transform: translateY(-14px); } 60% { opacity: 1; transform: translateY(2px); } 100% { opacity: 1; transform: none; } }
    .pin { opacity: 0; animation: pinDrop 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes ping { 0% { transform: scale(0.5); opacity: 0.8; } 100% { transform: scale(2.4); opacity: 0; } }
    .ping { position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid #FF7A1F; animation: ping 1.8s ease-out infinite; }
    @keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
