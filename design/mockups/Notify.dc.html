<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; color: #F5F1EC; }
    a { color: #FF7A1F; } a:hover { color: #FFB56B; }
    .h { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; }
    .scene { position: absolute; inset: 0; background:
      radial-gradient(1100px 560px at 72% 18%, #1c2330 0%, rgba(28,35,48,0) 62%),
      radial-gradient(860px 480px at 16% 85%, #2a2018 0%, rgba(42,32,24,0) 60%),
      linear-gradient(180deg, #10131b 0%, #12151d 46%, #0a0c11 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
    .toast { width: 340px; background: rgba(21,19,16,0.9); border: 1px solid rgba(255,255,255,0.09); border-radius: 12px; backdrop-filter: blur(14px); box-shadow: 0 14px 40px rgba(0,0,0,0.5); overflow: hidden; }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0a0c11;">
  <div class="scene"></div>
  <div class="vig"></div>

  <div style="position: absolute; top: 24px; right: 24px; display: flex; flex-direction: column; gap: 10px;">
    <div class="toast">
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;">
        <div style="width: 32px; height: 32px; border-radius: 9px; background: rgba(66,211,146,0.13); border: 1px solid rgba(66,211,146,0.45); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#42D392" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>
        </div>
        <div style="flex: 1;">
          <div style="font-size: 13.5px; font-weight: 700;">Deposit complete</div>
          <div style="font-size: 12.5px; color: #A8A29C; line-height: 1.45; margin-top: 2px;">$2,500 transferred to your savings account.</div>
        </div>
      </div>
      <div style="height: 3px; background: rgba(255,255,255,0.06);"><div style="width: 72%; height: 100%; background: #42D392;"></div></div>
    </div>

    <div class="toast">
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;">
        <div style="width: 32px; height: 32px; border-radius: 9px; background: rgba(255,122,31,0.13); border: 1px solid rgba(255,122,31,0.45); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF7A1F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7M3 12h18"/></svg>
        </div>
        <div style="flex: 1;">
          <div style="font-size: 13.5px; font-weight: 700;">New contract available</div>
          <div style="font-size: 12.5px; color: #A8A29C; line-height: 1.45; margin-top: 2px;">A delivery job was posted at the depot. Check your job center.</div>
        </div>
      </div>
      <div style="height: 3px; background: rgba(255,255,255,0.06);"><div style="width: 45%; height: 100%; background: #FF7A1F;"></div></div>
    </div>

    <div class="toast" style="border-color: rgba(244,84,78,0.35);">
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;">
        <div style="width: 32px; height: 32px; border-radius: 9px; background: rgba(244,84,78,0.13); border: 1px solid rgba(244,84,78,0.5); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F4544E" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v9M12 17.5v.5"/></svg>
        </div>
        <div style="flex: 1;">
          <div style="font-size: 13.5px; font-weight: 700;">Action failed</div>
          <div style="font-size: 12.5px; color: #A8A29C; line-height: 1.45; margin-top: 2px;">This vehicle is locked. Find the keys or lockpick it.</div>
        </div>
      </div>
      <div style="height: 3px; background: rgba(255,255,255,0.06);"><div style="width: 88%; height: 100%; background: #F4544E;"></div></div>
    </div>
  </div>

  <div style="position: absolute; left: 470px; top: 388px; display: flex; align-items: center; gap: 9px; background: rgba(21,19,16,0.88); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; backdrop-filter: blur(14px); padding: 9px 14px 9px 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.45);">
    <span class="h" style="font-size: 12px; font-weight: 700; color: #FF7A1F; background: rgba(255,122,31,0.12); border: 1px solid rgba(255,122,31,0.4); border-radius: 5px; padding: 3px 9px;">E</span>
    <span style="font-size: 13px; font-weight: 600; color: #D9D4CE;">Open Trunk</span>
  </div>

  <div style="position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); width: 384px; background: rgba(21,19,16,0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; backdrop-filter: blur(14px); box-shadow: 0 16px 44px rgba(0,0,0,0.55); padding: 15px 18px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF7A1F" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4.5 4.5 0 0 0-6 6L3 18v3h3l5.5-5.5a4.5 4.5 0 0 0 6-6L14 13l-3-3 3.5-3.5z"/></svg>
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #D9D4CE;">REPAIRING ENGINE</span>
      </div>
      <span class="h" style="font-size: 14px; font-weight: 700; color: #FFB56B;">64%</span>
    </div>
    <div style="margin-top: 11px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden;">
      <div style="width: 64%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #FF7A1F, #FFB56B); box-shadow: 0 0 14px rgba(255,122,31,0.65);"></div>
    </div>
    <div style="margin-top: 9px; font-size: 11px; color: #6B655F; font-weight: 500;">Press X to cancel</div>
  </div>
</div>
</x-dc>
</body>
</html>
