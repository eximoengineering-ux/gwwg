<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; color: #F2F3F7; }
    a { color: #8B93FF; } a:hover { color: #AEB4FF; }
    .d { font-family: 'Sora', 'Segoe UI', system-ui, sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
    .scene { position: absolute; inset: 0; background:
      radial-gradient(1000px 520px at 70% 12%, #1a1d28 0%, rgba(26,29,40,0) 60%),
      radial-gradient(700px 400px at 18% 78%, rgba(139,147,255,0.05) 0%, rgba(139,147,255,0) 60%),
      linear-gradient(180deg, #101116 0%, #12131a 52%, #0b0c10 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%); }
    .toast { position: relative; width: 330px; background: rgba(23,24,30,0.82); border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; backdrop-filter: blur(24px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 16px 40px rgba(0,0,0,0.45); overflow: hidden; }
    .lab { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5D616E; }
    .key { font-size: 11px; font-weight: 800; padding: 4px 9px; border-radius: 8px; background: rgba(255,255,255,0.07); border: 1px solid rgba(139,147,255,0.35); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 2px 0 rgba(0,0,0,0.35); color: #AEB4FF; }
    @keyframes in { from { opacity: 0; transform: translateY(-12px) scale(0.98); } to { opacity: 1; transform: none; } }
    .in { opacity: 0; animation: in 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }
    .rise { opacity: 0; animation: rise 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes drain { to { transform: scaleX(0); } }
    .drain { transform-origin: left center; animation: drain 8s linear 1.2s forwards; }
    @keyframes growW { from { width: 0; } }
    @keyframes ripple { 0% { box-shadow: 0 0 0 0 rgba(139,147,255,0.35); } 70% { box-shadow: 0 0 0 8px rgba(139,147,255,0); } 100% { box-shadow: 0 0 0 0 rgba(139,147,255,0); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0b0c10;">
  <div class="scene"></div>
  <div class="vig"></div>

  <div style="position: absolute; top: 24px; right: 26px; display: flex; flex-direction: column; gap: 10px;">
    <div class="toast in">
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px 12px;">
        <div style="width: 34px; height: 34px; border-radius: 11px; background: rgba(95,212,162,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5FD4A2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.5l5 5 10-11"/></svg>
        </div>
        <div style="flex: 1;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 13.5px; font-weight: 800;">Deposit complete</span>
            <span class="num" style="font-size: 10px; color: #5D616E; font-weight: 700;">now</span>
          </div>
          <div style="font-size: 12px; color: #9CA0AE; margin-top: 2px; line-height: 1.5; font-weight: 500;">$2,500 moved to your savings.</div>
        </div>
      </div>
      <div style="height: 2.5px; margin: 0 16px 10px; border-radius: 2px; background: rgba(255,255,255,0.07); overflow: hidden;"><div class="drain" style="width: 72%; height: 100%; border-radius: 2px; background: #5FD4A2;"></div></div>
    </div>

    <div class="toast in" style="animation-delay: 0.1s;">
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px 12px;">
        <div style="width: 34px; height: 34px; border-radius: 11px; background: rgba(139,147,255,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#AEB4FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7.2" width="19" height="11.8" rx="3"/><path d="M8.3 7.2V5.6a2.3 2.3 0 0 1 2.3-2.3h2.8a2.3 2.3 0 0 1 2.3 2.3v1.6M2.5 12.4h19"/></svg>
        </div>
        <div style="flex: 1;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 13.5px; font-weight: 800;">New contract</span>
            <span class="num" style="font-size: 10px; color: #5D616E; font-weight: 700;">2m</span>
          </div>
          <div style="font-size: 12px; color: #9CA0AE; margin-top: 2px; line-height: 1.5; font-weight: 500;">A delivery run was posted at the depot.</div>
        </div>
      </div>
      <div style="height: 2.5px; margin: 0 16px 10px; border-radius: 2px; background: rgba(255,255,255,0.07); overflow: hidden;"><div class="drain" style="width: 45%; height: 100%; border-radius: 2px; background: #8B93FF; animation-duration: 6s;"></div></div>
    </div>

    <div class="toast in" style="animation-delay: 0.2s;">
      <div style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px 12px;">
        <div style="width: 34px; height: 34px; border-radius: 11px; background: rgba(255,107,107,0.12); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF8A8A" stroke-width="2.4" stroke-linecap="round"><path d="M12 5.5v8M12 17.2v.5"/></svg>
        </div>
        <div style="flex: 1;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 13.5px; font-weight: 800;">Vehicle locked</span>
            <span class="num" style="font-size: 10px; color: #5D616E; font-weight: 700;">5m</span>
          </div>
          <div style="font-size: 12px; color: #9CA0AE; margin-top: 2px; line-height: 1.5; font-weight: 500;">Find the keys or pick the lock.</div>
        </div>
      </div>
      <div style="height: 2.5px; margin: 0 16px 10px; border-radius: 2px; background: rgba(255,255,255,0.07); overflow: hidden;"><div class="drain" style="width: 88%; height: 100%; border-radius: 2px; background: #FF8A8A; animation-duration: 11s;"></div></div>
    </div>
  </div>

  <div class="rise" style="position: absolute; left: 478px; top: 386px; display: flex; align-items: center; gap: 10px; background: rgba(23,24,30,0.82); border: 1px solid rgba(255,255,255,0.07); border-radius: 999px; backdrop-filter: blur(24px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 12px 30px rgba(0,0,0,0.4); padding: 9px 16px 9px 10px; animation-delay: 0.3s;">
    <span class="key" style="animation: ripple 2s ease-out infinite;">E</span>
    <span style="font-size: 13px; font-weight: 700; color: #C6C9D4;">Open trunk</span>
  </div>

  <div class="rise" style="position: absolute; left: 50%; bottom: 60px; margin-left: -195px; width: 390px; background: rgba(23,24,30,0.85); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; backdrop-filter: blur(26px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 20px 50px rgba(0,0,0,0.5); padding: 16px 20px 15px; box-sizing: border-box; animation-delay: 0.2s;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#AEB4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4.5 4.5 0 0 0-6 6L3 18v3h3l5.5-5.5a4.5 4.5 0 0 0 6-6L14 13l-3-3 3.5-3.5z"/></svg>
        <span style="font-size: 13px; font-weight: 800;">Repairing engine</span>
      </div>
      <span class="d num" style="font-size: 16px; font-weight: 700; color: #AEB4FF;">64%</span>
    </div>
    <div style="margin-top: 12px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden;">
      <div style="width: 64%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #8B93FF, #AEB4FF); box-shadow: 0 0 12px rgba(139,147,255,0.5); animation: growW 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;"></div>
    </div>
    <div style="display: flex; justify-content: space-between; margin-top: 9px;">
      <span style="font-size: 11px; color: #5D616E; font-weight: 600;">Press X to cancel</span>
      <span class="num" style="font-size: 11px; color: #5D616E; font-weight: 700;">~4s left</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
