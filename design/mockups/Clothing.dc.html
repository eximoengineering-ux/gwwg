<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; color: #F5F1EC; }
    a { color: #FF7A1F; } a:hover { color: #FFB56B; }
    .h { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; }
    .scene { position: absolute; inset: 0; background:
      radial-gradient(900px 620px at 50% 40%, #232a35 0%, rgba(35,42,53,0) 62%),
      linear-gradient(180deg, #0e1119 0%, #131620 52%, #0a0c11 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.66) 100%); }
    .panel { position: relative; background: linear-gradient(160deg, rgba(26,23,19,0.94), rgba(14,12,10,0.92)); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(14px); }
    .panel::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.016) 0 1px, rgba(0,0,0,0) 1px 3px); }
    .cut { clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%); }
    .lab { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #6B655F; }
    .cat { width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; background: rgba(26,23,19,0.9); border: 1px solid rgba(255,255,255,0.08); }
    .sw { width: 26px; height: 26px; border: 1px solid rgba(255,255,255,0.15); box-sizing: border-box; }
    .arr { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); }
    @keyframes slideL { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: none; } }
    .slideL { opacity: 0; animation: slideL 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes slideR { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
    .slideR { opacity: 0; animation: slideR 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .rise { opacity: 0; animation: rise 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0a0c11;">
  <div class="scene"></div>
  <div class="vig"></div>

  <div class="rise" style="position: absolute; left: 56px; top: 44px;">
    <div class="lab" style="color: #FFB56B;">SUBURBAN &middot; VESPUCCI</div>
    <div class="h" style="font-size: 24px; font-weight: 700; margin-top: 4px;">Wardrobe</div>
  </div>

  <div style="position: absolute; left: 56px; top: 138px; display: flex; flex-direction: column; gap: 8px;">
    <div class="cat slideL"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A8A29C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5a8 8 0 0 1 16 0v3a8 8 0 0 1-16 0zM8 10.5h2M14 10.5h2M9 15.5c1 1.5 5 1.5 6 0"/></svg></div>
    <div class="cat slideL" style="border-color: rgba(255,122,31,0.55); background: rgba(255,122,31,0.12); box-shadow: 0 0 16px rgba(255,122,31,0.2); animation-delay: 0.06s;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FF7A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3.5L4 6l1.5 4.5L8 9.5V20h8V9.5l2.5 1L20 6l-5-2.5a3 3 0 0 1-6 0z"/></svg></div>
    <div class="cat slideL" style="animation-delay: 0.12s;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A8A29C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3.5h10l1.5 17h-4L12 12l-2.5 8.5h-4z"/></svg></div>
    <div class="cat slideL" style="animation-delay: 0.18s;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A8A29C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15l1-8h4l.5 3.5a6 6 0 0 0 5 0L15 7h4l1 8M4 15l-1.5 3.5L5 20h14l2.5-1.5L20 15M4 15h16"/></svg></div>
    <div class="cat slideL" style="animation-delay: 0.24s;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A8A29C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="13" r="3.6"/><circle cx="17" cy="13" r="3.6"/><path d="M10.6 13h2.8M3.4 12l-1-2M20.6 12l1-2"/></svg></div>
    <div class="cat slideL" style="animation-delay: 0.3s;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#A8A29C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 16.5L12 4l8.5 12.5M7 16.5a2.5 2.5 0 1 0 10 0"/></svg></div>
  </div>

  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -52%);">
    <div style="animation: floaty 5s ease-in-out infinite;">
      <svg width="200" height="360" viewBox="0 0 200 360">
        <ellipse cx="100" cy="345" rx="62" ry="10" fill="rgba(0,0,0,0.45)"/>
        <circle cx="100" cy="48" r="26" fill="#25211c" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
        <path d="M62 118c0-22 17-38 38-38s38 16 38 38l6 78c0 8-6 14-14 14H70c-8 0-14-6-14-14z" fill="#2b2620" stroke="rgba(255,122,31,0.45)" stroke-width="1.5"/>
        <path d="M60 122l-14 62c-1.5 7 3 12 9 12s9-4 10-9l9-48M140 122l14 62c1.5 7-3 12-9 12s-9-4-10-9l-9-48" fill="#25211c" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
        <path d="M74 210l-4 108c0 7 5 12 12 12s11-5 11-11l7-82 7 82c0 6 5 11 11 11s12-5 12-12l-4-108z" fill="#221e19" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="rise" style="display: flex; justify-content: center; gap: 10px; margin-top: 8px; animation-delay: 0.3s;">
      <div class="arr"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A8A29C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l-5 7 5 7M4 12h11a5 5 0 0 1 5 5"/></svg></div>
      <div class="arr" style="border-color: rgba(255,122,31,0.5); background: rgba(255,122,31,0.1);"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF7A1F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l5 7-5 7M20 12H9a5 5 0 0 0-5 5"/></svg></div>
    </div>
  </div>

  <div style="position: absolute; right: 56px; top: 128px; width: 300px; display: flex; flex-direction: column; gap: 10px; transform: perspective(1200px) rotateY(-7deg); transform-origin: right center;">
    <div class="panel cut slideR" style="padding: 17px 19px;">
      <div style="position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: linear-gradient(180deg, #FF7A1F, rgba(255,122,31,0.2)); animation: pulseGlow 2.4s ease-in-out infinite;"></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span class="lab" style="color: #FFB56B;">Jackets</span>
        <span class="h" style="font-size: 12px; font-weight: 700; color: #FFB56B;">12<span style="color: #6B655F;"> / 48</span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; margin-top: 12px;">
        <div class="arr" style="width: 30px; height: 30px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A8A29C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>
        <div style="flex: 1; text-align: center;">
          <div style="font-size: 13.5px; font-weight: 700;">Bomber &middot; Ember Edition</div>
          <div style="font-size: 10.5px; color: #6B655F; margin-top: 2px;">Benny's exclusive</div>
        </div>
        <div class="arr" style="width: 30px; height: 30px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A8A29C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></div>
      </div>
    </div>

    <div class="panel slideR" style="padding: 17px 19px; animation-delay: 0.1s;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span class="lab">Texture</span>
        <span class="h" style="font-size: 12px; font-weight: 700; color: #A8A29C;">4<span style="color: #6B655F;"> / 8</span></span>
      </div>
      <div style="display: flex; gap: 7px; margin-top: 12px;">
        <div class="sw" style="background: #2b2620;"></div>
        <div class="sw" style="background: #443a2e;"></div>
        <div class="sw" style="background: #1d2434;"></div>
        <div class="sw" style="background: linear-gradient(135deg, #FF7A1F, #E8540E); border-color: #FFB56B; box-shadow: 0 0 10px rgba(255,122,31,0.5);"></div>
        <div class="sw" style="background: #3a2020;"></div>
        <div class="sw" style="background: #20342a;"></div>
      </div>
    </div>

    <div class="panel slideR" style="padding: 17px 19px; animation-delay: 0.2s;">
      <div class="lab">Saved Outfits</div>
      <div style="display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px;">
        <span class="h" style="font-size: 10.5px; font-weight: 700; color: #FFB56B; background: rgba(255,122,31,0.1); border: 1px solid rgba(255,122,31,0.4); padding: 5px 11px;">WORK FIT</span>
        <span class="h" style="font-size: 10.5px; font-weight: 700; color: #A8A29C; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); padding: 5px 11px;">CASUAL</span>
        <span class="h" style="font-size: 10.5px; font-weight: 700; color: #A8A29C; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); padding: 5px 11px;">RACE NIGHT</span>
        <span class="h" style="font-size: 10.5px; font-weight: 700; color: #6B655F; border: 1px dashed rgba(255,255,255,0.2); padding: 5px 11px;">+ SAVE</span>
      </div>
    </div>

    <div class="slideR" style="display: flex; gap: 10px; animation-delay: 0.3s;">
      <div class="cut" style="flex: 1.6; height: 44px; background: linear-gradient(135deg, #FF7A1F, #E8540E); color: #17100A; font-weight: 700; font-size: 13.5px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(255,122,31,0.35);">Buy &middot; $210</div>
      <div style="flex: 1; height: 44px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.12); color: #D9D4CE; font-weight: 600; font-size: 13px; display: flex; align-items: center; justify-content: center;">Exit</div>
    </div>
  </div>

  <div class="rise" style="position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; gap: 14px; animation-delay: 0.4s;">
    <div style="display: flex; align-items: center; gap: 7px;"><span class="h" style="font-size: 11px; font-weight: 700; color: #A8A29C; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 5px; padding: 2px 7px;">&#8592;&#8594;</span><span style="font-size: 11px; color: #6B655F; font-weight: 500;">Rotate</span></div>
    <div style="display: flex; align-items: center; gap: 7px;"><span class="h" style="font-size: 11px; font-weight: 700; color: #A8A29C; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 5px; padding: 2px 7px;">Z</span><span style="font-size: 11px; color: #6B655F; font-weight: 500;">Zoom</span></div>
  </div>
</div>
</x-dc>
</body>
</html>
