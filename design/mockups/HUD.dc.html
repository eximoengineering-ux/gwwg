  <style>

    .scene { position: absolute; inset: 0; background: radial-gradient(1100px 560px at 70% 16%, #1a1d22 0%, rgba(26,29,34,0) 60%), linear-gradient(180deg, #121317 0%, #14151a 52%, #0a0b0d 100%); }

    .card { position: relative; background: linear-gradient(175deg, #F4EFE4 0%, #EDE6D6 100%); color: #16140F; box-shadow: 0 16px 44px rgba(0,0,0,0.6); }

    .lab { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #8A8478; text-transform: uppercase; }
    .stamp { display: inline-block; font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 0.12em; color: #C3372B; border: 2px solid #C3372B; border-radius: 3px; transform: rotate(-6deg); opacity: 0.88; box-shadow: inset 0 0 0 1.5px #F1EBDF, inset 0 0 0 3px rgba(195,55,43,0.55); }
    .digit { font-family: 'IBM Plex Mono', monospace; width: 30px; height: 42px; background: #16140F; color: #F1EBDF; font-size: 26px; font-weight: 600; display: flex; align-items: center; justify-content: center; border-radius: 2px; position: relative; }
    .digit::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(241,235,223,0.18); }
    @keyframes deal { from { opacity: 0; transform: translateY(22px) rotate(-1.2deg); } to { opacity: 1; transform: none; } }
    .deal { opacity: 0; animation: deal 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes dealD { from { opacity: 0; transform: translateY(-18px) rotate(1deg); } to { opacity: 1; transform: none; } }
    .dealD { opacity: 0; animation: dealD 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes growW { from { width: 0; } }
    @keyframes blinkStamp { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.3; } }
    @keyframes eq { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
    .eqb { transform-origin: center bottom; animation: eq 0.9s ease-in-out infinite; background: #16140F; width: 3px; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
