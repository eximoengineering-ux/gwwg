<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; color: #F2F3F7; }
    a { color: #8B93FF; } a:hover { color: #AEB4FF; }
    .d { font-family: 'Sora', 'Segoe UI', system-ui, sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
    .scene { position: absolute; inset: 0; background:
      radial-gradient(1000px 520px at 70% 12%, #1a1d28 0%, rgba(26,29,40,0) 60%),
      radial-gradient(700px 400px at 18% 78%, rgba(139,147,255,0.05) 0%, rgba(139,147,255,0) 60%),
      linear-gradient(180deg, #101116 0%, #12131a 52%, #0b0c10 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%); }
    .panel { position: relative; background: rgba(23,24,30,0.78); border: 1px solid rgba(255,255,255,0.07); border-radius: 18px; backdrop-filter: blur(24px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 20px 50px rgba(0,0,0,0.45); }
    .lab { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5D616E; }
    .ring { position: relative; width: 46px; height: 46px; }
    @keyframes in { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }
    .in { opacity: 0; animation: in 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes inD { from { opacity: 0; transform: translateY(-12px) scale(0.98); } to { opacity: 1; transform: none; } }
    .inD { opacity: 0; animation: inD 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes sweep100 { from { stroke-dasharray: 0 100; } }
    @keyframes sweep360 { from { stroke-dasharray: 0 360; } }
    @keyframes growW { from { width: 0; } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes eq { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
    .eqb { transform-origin: center bottom; animation: eq 0.9s ease-in-out infinite; width: 2.5px; border-radius: 2px; background: #8B93FF; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0b0c10;">
  <div class="scene"></div>
  <div class="vig"></div>

  <div class="panel inD" style="position: absolute; top: 24px; left: 26px; display: flex; align-items: center; gap: 9px; padding: 10px 16px; border-radius: 999px;">
    <span style="width: 6px; height: 6px; border-radius: 50%; background: #8B93FF; box-shadow: 0 0 10px rgba(139,147,255,0.8); animation: breathe 3s ease-in-out infinite;"></span>
    <span class="d" style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em;">Nova RP</span>
    <span class="num" style="font-size: 11.5px; color: #5D616E; font-weight: 600;">#214</span>
  </div>

  <div class="panel inD" style="position: absolute; top: 24px; right: 26px; width: 172px; padding: 13px 17px; animation-delay: 0.08s;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5FD4A2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="3"/><circle cx="12" cy="12" r="2.4"/></svg>
        <span class="lab">cash</span>
      </div>
      <span class="num" style="font-size: 13.5px; font-weight: 800;">$2,840</span>
    </div>
    <div style="height: 1px; background: rgba(255,255,255,0.06); margin: 10px 0;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA0AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10h17M5.5 10V8.2L12 4l6.5 4.2V10M7 10v6.5M12 10v6.5M17 10v6.5M4.5 16.5h15v3h-15z"/></svg>
        <span class="lab">bank</span>
      </div>
      <span class="num" style="font-size: 13.5px; font-weight: 800; color: #9CA0AE;">$18,540</span>
    </div>
  </div>

  <div style="position: absolute; left: 26px; bottom: 24px; display: flex; align-items: flex-end; gap: 14px;">
    <div class="in" style="display: flex; flex-direction: column; align-items: center; gap: 9px;">
      <div style="position: relative; width: 178px; height: 178px;">
        <div style="position: absolute; inset: 0; border-radius: 50%; overflow: hidden; border: 1px solid rgba(255,255,255,0.09); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 20px 50px rgba(0,0,0,0.55);">
          <div style="position: absolute; inset: 0; background: linear-gradient(140deg, #191d24, #20262a 45%, #171b21);"></div>
          <div style="position: absolute; left: -20px; top: 72px; width: 230px; height: 11px; background: #2a3138; transform: rotate(-9deg); border-radius: 5px;"></div>
          <div style="position: absolute; left: 74px; top: -16px; width: 10px; height: 220px; background: #2a3138; transform: rotate(14deg); border-radius: 5px;"></div>
          <div style="position: absolute; left: 22px; top: 122px; width: 145px; height: 7px; background: #242b31; transform: rotate(4deg); border-radius: 4px;"></div>
          <div style="position: absolute; left: 83px; top: 82px; width: 13px; height: 13px; border-radius: 50%; background: #8B93FF; box-shadow: 0 0 0 5px rgba(139,147,255,0.22), 0 0 16px rgba(139,147,255,0.7);"></div>
          <div style="position: absolute; inset: 0; background: radial-gradient(closest-side, rgba(0,0,0,0) 62%, rgba(0,0,0,0.45) 100%);"></div>
        </div>
        <svg width="178" height="178" viewBox="0 0 178 178" style="position: absolute; inset: 0; overflow: visible;">
          <circle cx="89" cy="89" r="86" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" pathLength="360" stroke-dasharray="1.5 10.5"/>
        </svg>
        <span class="lab" style="position: absolute; left: 50%; top: -3px; transform: translateX(-50%); background: #14151b; border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; padding: 2px 8px; color: #9CA0AE;">N</span>
      </div>
      <div class="panel" style="padding: 7px 15px; border-radius: 999px;">
        <span style="font-size: 11.5px; font-weight: 700; color: #C6C9D4;">Legion Square</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 42px;">
      <div class="ring in" style="animation-delay: 0.08s;">
        <svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="rgba(23,24,30,0.82)" stroke="rgba(255,255,255,0.08)" stroke-width="3.5"/><circle cx="23" cy="23" r="19" fill="none" stroke="#5FD4A2" stroke-width="3.5" pathLength="100" stroke-dasharray="84 16" transform="rotate(-90 23 23)" stroke-linecap="round" style="animation: sweep100 1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;"/></svg>
        <svg style="position: absolute; left: 15px; top: 15px;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C6C9D4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.6-9.2-9A5.2 5.2 0 0 1 12 6.7 5.2 5.2 0 0 1 21.2 11C19 15.4 12 20 12 20z"/></svg>
      </div>
      <div class="ring in" style="animation-delay: 0.14s;">
        <svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="rgba(23,24,30,0.82)" stroke="rgba(255,255,255,0.08)" stroke-width="3.5"/><circle cx="23" cy="23" r="19" fill="none" stroke="#8B93FF" stroke-width="3.5" pathLength="100" stroke-dasharray="45 55" transform="rotate(-90 23 23)" stroke-linecap="round" style="animation: sweep100 1s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;"/></svg>
        <svg style="position: absolute; left: 15px; top: 15px;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C6C9D4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 7.6-8 9-4.6-1.4-8-4.5-8-9V6l8-3z"/></svg>
      </div>
      <div class="ring in" style="animation-delay: 0.2s;">
        <svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="rgba(23,24,30,0.82)" stroke="rgba(255,255,255,0.08)" stroke-width="3.5"/><circle cx="23" cy="23" r="19" fill="none" stroke="#FFC46B" stroke-width="3.5" pathLength="100" stroke-dasharray="66 34" transform="rotate(-90 23 23)" stroke-linecap="round" style="animation: sweep100 1s cubic-bezier(0.22, 1, 0.36, 1) 0.6s both;"/></svg>
        <svg style="position: absolute; left: 15px; top: 15px;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C6C9D4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5a7.5 7.5 0 0 1 15 0v.5h-15v-.5zM4 13h16M4.5 16.5h15v.3a2.7 2.7 0 0 1-2.7 2.7H7.2a2.7 2.7 0 0 1-2.7-2.7v-.3z"/></svg>
      </div>
      <div class="ring in" style="animation-delay: 0.26s;">
        <svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="rgba(23,24,30,0.82)" stroke="rgba(255,255,255,0.08)" stroke-width="3.5"/><circle cx="23" cy="23" r="19" fill="none" stroke="#6BC8E8" stroke-width="3.5" pathLength="100" stroke-dasharray="78 22" transform="rotate(-90 23 23)" stroke-linecap="round" style="animation: sweep100 1s cubic-bezier(0.22, 1, 0.36, 1) 0.7s both;"/></svg>
        <svg style="position: absolute; left: 15px; top: 15px;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C6C9D4" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5S6 10 6 14.5a6 6 0 0 0 12 0C18 10 12 3.5 12 3.5z"/></svg>
      </div>
      <div class="panel in" style="width: 46px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 5px; animation-delay: 0.32s; box-sizing: border-box;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#8B93FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <div style="display: flex; align-items: flex-end; gap: 2px; height: 11px;">
          <span class="eqb" style="height: 7px;"></span>
          <span class="eqb" style="height: 11px; animation-delay: 0.2s;"></span>
        </div>
      </div>
    </div>
  </div>

  <div style="position: absolute; right: 26px; bottom: 24px; display: flex; align-items: flex-end; gap: 12px;">
    <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px;">
      <div class="panel in" style="padding: 9px 14px; border-radius: 999px; display: flex; align-items: center; gap: 8px; animation-delay: 0.2s;">
        <span style="width: 6px; height: 6px; border-radius: 50%; background: #FF6B6B; animation: breathe 1.6s ease-in-out infinite;"></span>
        <span class="lab" style="color: #FF8A8A;">belt</span>
      </div>
      <div class="panel in" style="padding: 9px 14px; border-radius: 999px; display: flex; align-items: center; gap: 9px; animation-delay: 0.26s;">
        <span class="lab">fuel</span>
        <div style="width: 44px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.09); overflow: hidden;"><div style="width: 58%; height: 100%; border-radius: 2px; background: #FFC46B; animation: growW 1s cubic-bezier(0.22, 1, 0.36, 1) 0.6s both;"></div></div>
        <span class="num" style="font-size: 10.5px; color: #9CA0AE; font-weight: 700;">58</span>
      </div>
      <div class="panel in" style="padding: 9px 14px; border-radius: 999px; display: flex; align-items: center; gap: 9px; justify-content: space-between; animation-delay: 0.32s;">
        <span class="lab">gear</span>
        <span class="d num" style="font-size: 13px; font-weight: 700; color: #AEB4FF;">3</span>
      </div>
    </div>

    <div class="in" style="position: relative; width: 158px; height: 158px; animation-delay: 0.14s;">
      <div style="position: absolute; inset: 10px; border-radius: 50%; background: rgba(23,24,30,0.82); border: 1px solid rgba(255,255,255,0.07); backdrop-filter: blur(24px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 20px 50px rgba(0,0,0,0.5);"></div>
      <svg width="158" height="158" viewBox="0 0 158 158" style="position: absolute; inset: 0; overflow: visible;">
        <circle cx="79" cy="79" r="70" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="5" pathLength="360" stroke-dasharray="270 90" transform="rotate(135 79 79)" stroke-linecap="round"/>
        <circle cx="79" cy="79" r="70" fill="none" stroke="url(#novaArc)" stroke-width="5" pathLength="360" stroke-dasharray="167 193" transform="rotate(135 79 79)" stroke-linecap="round" style="filter: drop-shadow(0 0 8px rgba(139,147,255,0.45)); animation: sweep360 1.3s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;"/>
        <defs>
          <linearGradient id="novaArc" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#6E6BFF"/>
            <stop offset="1" stop-color="#AEB4FF"/>
          </linearGradient>
        </defs>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <span class="d num" style="font-size: 42px; font-weight: 700; line-height: 1; letter-spacing: -0.02em;">87</span>
        <span class="lab" style="margin-top: 4px;">mph</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
