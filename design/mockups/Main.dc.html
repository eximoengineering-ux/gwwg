<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; color: #F2F3F7; }
    a { color: #8B93FF; } a:hover { color: #AEB4FF; }
    .d { font-family: 'Sora', 'Segoe UI', system-ui, sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
    .scene { position: absolute; inset: 0; background:
      radial-gradient(1000px 520px at 70% 12%, #1a1d28 0%, rgba(26,29,40,0) 60%),
      radial-gradient(700px 400px at 18% 78%, rgba(139,147,255,0.05) 0%, rgba(139,147,255,0) 60%),
      linear-gradient(180deg, #101116 0%, #12131a 52%, #0b0c10 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%); }
    .panel { position: relative; background: rgba(23,24,30,0.78); border: 1px solid rgba(255,255,255,0.07); border-radius: 18px; backdrop-filter: blur(24px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 20px 50px rgba(0,0,0,0.45); }
    .lab { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5D616E; }
    @keyframes in { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: none; } }
    .in { opacity: 0; animation: in 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes growW { from { width: 0; } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes eq { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1); } }
    .eqb { transform-origin: center bottom; animation: eq 0.9s ease-in-out infinite; width: 2.5px; border-radius: 2px; background: #8B93FF; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0b0c10;">
  <div class="scene"></div>
  <div class="vig"></div>

  <div class="panel in" style="position: absolute; top: 24px; right: 26px; display: flex; align-items: center; gap: 16px; padding: 11px 18px; border-radius: 999px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #8B93FF; box-shadow: 0 0 10px rgba(139,147,255,0.8); animation: breathe 3s ease-in-out infinite;"></span>
      <span class="d" style="font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em;">Nova RP</span>
      <span class="num" style="font-size: 11.5px; color: #5D616E; font-weight: 600;">#214</span>
    </div>
    <span style="width: 1px; height: 16px; background: rgba(255,255,255,0.08);"></span>
    <div style="display: flex; align-items: center; gap: 6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5FD4A2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="3"/><circle cx="12" cy="12" r="2.4"/></svg>
      <span class="num" style="font-size: 13px; font-weight: 700;">$2,840</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9CA0AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10h17M5.5 10V8.2L12 4l6.5 4.2V10M7 10v6.5M12 10v6.5M17 10v6.5M4.5 16.5h15v3h-15z"/></svg>
      <span class="num" style="font-size: 13px; font-weight: 700; color: #9CA0AE;">$18,540</span>
    </div>
  </div>

  <div style="position: absolute; left: 26px; bottom: 24px; display: flex; align-items: flex-end; gap: 12px;">
    <div class="in" style="position: relative; width: 190px; height: 190px; border-radius: 26px; overflow: hidden; border: 1px solid rgba(255,255,255,0.09); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 20px 50px rgba(0,0,0,0.5);">
      <div style="position: absolute; inset: 0; background: linear-gradient(140deg, #191d24, #20262a 45%, #171b21);"></div>
      <div style="position: absolute; left: -20px; top: 74px; width: 240px; height: 11px; background: #2a3138; transform: rotate(-9deg); border-radius: 5px;"></div>
      <div style="position: absolute; left: 78px; top: -16px; width: 10px; height: 230px; background: #2a3138; transform: rotate(14deg); border-radius: 5px;"></div>
      <div style="position: absolute; left: 26px; top: 128px; width: 150px; height: 7px; background: #242b31; transform: rotate(4deg); border-radius: 4px;"></div>
      <div style="position: absolute; left: 88px; top: 86px; width: 14px; height: 14px; border-radius: 50%; background: #8B93FF; box-shadow: 0 0 0 5px rgba(139,147,255,0.22), 0 0 16px rgba(139,147,255,0.7);"></div>
      <div style="position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 11px; font-weight: 700; color: #F2F3F7; text-shadow: 0 1px 6px rgba(0,0,0,0.7);">Legion Square</span>
        <span class="lab" style="color: #9CA0AE;">N</span>
      </div>
      <div style="position: absolute; inset: 0; background: radial-gradient(120% 100% at 50% 40%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.4) 100%);"></div>
    </div>

    <div class="panel in" style="display: flex; align-items: center; gap: 14px; padding: 13px 18px; border-radius: 999px; animation-delay: 0.1s;">
      <div style="display: flex; align-items: center; gap: 7px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5FD4A2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.6-9.2-9A5.2 5.2 0 0 1 12 6.7 5.2 5.2 0 0 1 21.2 11C19 15.4 12 20 12 20z"/></svg>
        <div style="width: 44px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.09); overflow: hidden;"><div style="width: 84%; height: 100%; border-radius: 2px; background: #5FD4A2; animation: growW 1s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;"></div></div>
      </div>
      <div style="display: flex; align-items: center; gap: 7px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8B93FF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 7.6-8 9-4.6-1.4-8-4.5-8-9V6l8-3z"/></svg>
        <div style="width: 44px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.09); overflow: hidden;"><div style="width: 45%; height: 100%; border-radius: 2px; background: #8B93FF; animation: growW 1s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;"></div></div>
      </div>
      <div style="display: flex; align-items: center; gap: 7px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFC46B" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 9.5a7.5 7.5 0 0 1 15 0v.5h-15v-.5zM4 13h16M4.5 16.5h15v.3a2.7 2.7 0 0 1-2.7 2.7H7.2a2.7 2.7 0 0 1-2.7-2.7v-.3z"/></svg>
        <div style="width: 44px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.09); overflow: hidden;"><div style="width: 66%; height: 100%; border-radius: 2px; background: #FFC46B; animation: growW 1s cubic-bezier(0.22, 1, 0.36, 1) 0.6s both;"></div></div>
      </div>
      <div style="display: flex; align-items: center; gap: 7px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6BC8E8" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5S6 10 6 14.5a6 6 0 0 0 12 0C18 10 12 3.5 12 3.5z"/></svg>
        <div style="width: 44px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.09); overflow: hidden;"><div style="width: 78%; height: 100%; border-radius: 2px; background: #6BC8E8; animation: growW 1s cubic-bezier(0.22, 1, 0.36, 1) 0.7s both;"></div></div>
      </div>
      <span style="width: 1px; height: 18px; background: rgba(255,255,255,0.08);"></span>
      <div style="display: flex; align-items: flex-end; gap: 2.5px; height: 13px;">
        <span class="eqb" style="height: 9px;"></span>
        <span class="eqb" style="height: 13px; animation-delay: 0.2s;"></span>
        <span class="eqb" style="height: 7px; animation-delay: 0.45s;"></span>
      </div>
    </div>
  </div>

  <div class="panel in" style="position: absolute; right: 26px; bottom: 24px; padding: 16px 22px 15px; animation-delay: 0.16s;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <div>
        <div style="display: flex; align-items: baseline; gap: 6px;">
          <span class="d num" style="font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -0.02em;">87</span>
          <span class="lab">mph</span>
        </div>
        <div style="margin-top: 10px; width: 132px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.09); overflow: hidden;">
          <div style="width: 58%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, #8B93FF, #AEB4FF); animation: growW 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;"></div>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 6px;">
          <span class="lab">fuel</span>
          <span class="num" style="font-size: 10.5px; color: #9CA0AE; font-weight: 700;">58%</span>
        </div>
      </div>
      <div style="width: 1px; align-self: stretch; background: rgba(255,255,255,0.07);"></div>
      <div style="display: flex; flex-direction: column; gap: 9px; align-items: center;">
        <div class="d num" style="width: 34px; height: 34px; border-radius: 11px; background: rgba(139,147,255,0.12); border: 1px solid rgba(139,147,255,0.35); color: #AEB4FF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center;">3</div>
        <div style="display: flex; align-items: center; gap: 5px;">
          <span style="width: 6px; height: 6px; border-radius: 50%; background: #FF6B6B; animation: breathe 1.6s ease-in-out infinite;"></span>
          <span class="lab" style="color: #FF6B6B;">belt</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
