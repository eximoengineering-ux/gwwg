<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif; color: #F5F1EC; }
    a { color: #FF7A1F; } a:hover { color: #FFB56B; }
    .h { font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif; }
    .scene { position: absolute; inset: 0; background:
      radial-gradient(1100px 560px at 72% 14%, #1d2534 0%, rgba(29,37,52,0) 60%),
      radial-gradient(700px 380px at 22% 30%, rgba(255,122,31,0.05) 0%, rgba(255,122,31,0) 60%),
      linear-gradient(180deg, #0e1119 0%, #131620 52%, #0a0c11 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0.2) 45%, rgba(0,0,0,0.62) 100%); }
    .app { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .tile { position: relative; width: 48px; height: 48px; border-radius: 13px; display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.5), inset 0 -2px 3px rgba(0,0,0,0.35), 0 6px 12px rgba(0,0,0,0.5), 0 1px 3px rgba(0,0,0,0.4); }
    .tile::before { content: ""; position: absolute; inset: 0; border-radius: 13px; background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.06) 40%, rgba(0,0,0,0.04) 62%, rgba(0,0,0,0.2) 100%); pointer-events: none; }
    .tile::after { content: ""; position: absolute; left: 3px; right: 3px; top: 1px; height: 46%; border-radius: 11px 11px 22px 22px; background: linear-gradient(180deg, rgba(255,255,255,0.34), rgba(255,255,255,0)); pointer-events: none; }
    .tile svg { position: relative; z-index: 1; filter: drop-shadow(0 1.5px 1.5px rgba(0,0,0,0.55)); }
    .aname { font-size: 8.5px; font-weight: 600; color: #A8A29C; letter-spacing: 0.02em; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
    @keyframes phoneUp { from { opacity: 0; transform: translate(-50%, -44%) rotate(1.5deg); } to { opacity: 1; transform: translate(-50%, -50%) rotate(0deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .rise { opacity: 0; animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
    @keyframes riseC { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0a0c11;">
  <div class="scene"></div>
  <div class="vig"></div>

  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 306px; height: 648px; animation: phoneUp 0.65s cubic-bezier(0.2, 0.8, 0.2, 1) both;">
    <div style="position: absolute; inset: 0; border-radius: 40px; background: linear-gradient(160deg, #23201c, #0d0b0a); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 40px 90px rgba(0,0,0,0.7), 0 0 40px rgba(255,122,31,0.08), inset 0 0 0 3px #060505;"></div>
    <div style="position: absolute; left: 10px; top: 10px; right: 10px; bottom: 10px; border-radius: 32px; overflow: hidden; background: radial-gradient(340px 260px at 85% -5%, rgba(255,122,31,0.22), rgba(255,122,31,0) 60%), radial-gradient(300px 300px at 0% 105%, rgba(76,158,235,0.1), rgba(76,158,235,0) 55%), linear-gradient(175deg, #14110e 0%, #0c0a09 100%);">

      <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 0;">
        <span class="h" style="font-size: 12px; font-weight: 700;">21:42</span>
        <div style="display: flex; align-items: center; gap: 5px;">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="#A8A29C"><rect x="2" y="14" width="3.4" height="6" rx="1"/><rect x="7.5" y="10" width="3.4" height="10" rx="1"/><rect x="13" y="6" width="3.4" height="14" rx="1"/><rect x="18.5" y="2.5" width="3.4" height="17.5" rx="1" fill="rgba(168,162,156,0.35)"/></svg>
          <div style="width: 19px; height: 9.5px; border: 1px solid rgba(255,255,255,0.35); border-radius: 3px; padding: 1.2px; box-sizing: border-box;"><div style="width: 64%; height: 100%; border-radius: 1.5px; background: #42D392;"></div></div>
        </div>
      </div>

      <div class="rise" style="padding: 18px 22px 0; animation-delay: 0.15s;">
        <div class="h" style="font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: 0.01em;">21:42</div>
        <div style="font-size: 11.5px; color: #A8A29C; margin-top: 5px;">Friday, August 22 &middot; Los Santos 24&deg;</div>
      </div>

      <div style="margin: 16px 14px 0; background: rgba(30,26,22,0.85); border: 1px solid rgba(255,255,255,0.08); border-radius: 15px; padding: 11px 13px; display: flex; gap: 10px; align-items: flex-start; opacity: 0; animation: slideDown 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;">
        <div class="tile" style="width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(160deg, #FFB56B, #E8540E 70%); flex-shrink: 0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14a2 2 0 0 1-2 2H8l-4.5 4V5a2 2 0 0 1 2-2H19a2 2 0 0 1 2 2v9z"/></svg>
        </div>
        <div style="flex: 1;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 11.5px; font-weight: 700;">Mia Vasquez</span>
            <span style="font-size: 9px; color: #6B655F;">now</span>
          </div>
          <div style="font-size: 11px; color: #A8A29C; margin-top: 2px; line-height: 1.4;">Tow truck needed at Sandy, you in?</div>
        </div>
      </div>

      <div class="rise" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 8px; padding: 20px 18px 0; animation-delay: 0.4s;">
        <div class="app"><div class="tile" style="background: linear-gradient(160deg, #7CE8A2 0%, #2AA95C 55%, #1C7F42 100%);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div><span class="aname">Phone</span></div>
        <div class="app"><div class="tile" style="background: linear-gradient(160deg, #6FB9FF 0%, #2E7FE8 55%, #1D5CB8 100%);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14a2 2 0 0 1-2 2H8l-4.5 4V5a2 2 0 0 1 2-2H19a2 2 0 0 1 2 2v9z"/></svg></div><span class="aname">Messages</span></div>
        <div class="app"><div class="tile" style="background: linear-gradient(160deg, #FFC98A 0%, #FF7A1F 50%, #C24409 100%);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M5 10V8l7-4 7 4v2M6 10v7M12 10v7M18 10v7M4 17h16v3H4z"/></svg></div><span class="aname">Bank</span></div>
        <div class="app"><div class="tile" style="background: linear-gradient(160deg, #8FE5F8 0%, #35B5DC 55%, #1B84A8 100%);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 5.5c-.8.4-1.6.6-2.5.7a4.3 4.3 0 0 0-7.4 3v1A10.3 10.3 0 0 1 3 6s-4 9 5 13a11.7 11.7 0 0 1-7 2c9 5 20 0 20-11.5 0-.3 0-.6-.1-.9A7.7 7.7 0 0 0 22 5.5z"/></svg></div><span class="aname">Birdy</span></div>
        <div class="app"><div class="tile" style="background: linear-gradient(160deg, #D7E3F2 0%, #8FA5C0 55%, #5E7492 100%);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5L12 13l9.5-5.5"/></svg></div><span class="aname">Mail</span></div>
        <div class="app"><div class="tile" style="background: linear-gradient(160deg, #4a4f58 0%, #23262c 60%, #131519 100%);"><div style="position: absolute; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 36% 32%, #9fc5ee 0%, #3c6ea8 32%, #1b2f4d 68%, #0c1524 100%); box-shadow: inset 0 1px 2px rgba(255,255,255,0.4), 0 1px 3px rgba(0,0,0,0.6); z-index: 1;"></div><div style="position: absolute; width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.75); top: 12px; left: 13px; z-index: 2; filter: blur(0.5px);"></div></div><span class="aname">Camera</span></div>
        <div class="app"><div class="tile" style="background: linear-gradient(160deg, #FFD9A8 0%, #E8983B 55%, #A8641A 100%);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 13.1l1.7-4.4a2.2 2.2 0 0 1 2.1-1.4h11.2a2.2 2.2 0 0 1 2.1 1.4l1.7 4.4M2.2 13.1h19.6a.9.9 0 0 1 .9.9v3.1h-2.5M1.3 14v3.1h2.5M6.9 17.4a1.85 1.85 0 1 0 .01 0M17.1 17.4a1.85 1.85 0 1 0 .01 0M9.6 17.4h4.8"/></svg></div><span class="aname">Garage</span></div>
        <div class="app"><div class="tile" style="background: linear-gradient(160deg, #C9A6F5 0%, #8E5BD8 55%, #5F35A2 100%);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7.2" width="19" height="11.8" rx="2"/><path d="M8.3 7.2V5.6a2.3 2.3 0 0 1 2.3-2.3h2.8a2.3 2.3 0 0 1 2.3 2.3v1.6M2.5 12.4h19"/></svg></div><span class="aname">Jobs</span></div>
        <div class="app"><div class="tile" style="background: linear-gradient(160deg, #A9EFC8 0%, #37B877 55%, #1F8A54 100%);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.6 5.3 5.9.9-4.2 4.1 1 5.9-5.3-2.8-5.3 2.8 1-5.9L3.5 8.7l5.9-.9z"/></svg></div><span class="aname">Services</span></div>
        <div class="app"><div class="tile" style="background: linear-gradient(160deg, #FF9E97 0%, #E8443A 55%, #A82420 100%);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg></div><span class="aname">Alarms</span></div>
        <div class="app"><div class="tile" style="background: linear-gradient(160deg, #FFE49A 0%, #E8B23B 55%, #B27E14 100%);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M11.8 3.5c.6 3.2-1.5 4.6-1.5 7a3.4 3.4 0 0 0 6.8.3c0-3.3-3.3-4.3-3.3-7.3M6.5 13.5a5.5 5.5 0 1 0 11 .2"/></svg></div><span class="aname">Crypto</span></div>
        <div class="app"><div class="tile" style="background: linear-gradient(160deg, #C4CBD6 0%, #7B8494 55%, #4C5462 100%);"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></div><span class="aname">Settings</span></div>
      </div>

      <div class="rise" style="position: absolute; left: 14px; right: 14px; bottom: 14px; background: rgba(34,29,24,0.75); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 8px 6px; animation-delay: 0.55s;">
        <div class="tile" style="width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(160deg, #FFC98A 0%, #FF7A1F 50%, #C24409 100%);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div>
        <div class="tile" style="width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(160deg, #6FB9FF 0%, #2E7FE8 55%, #1D5CB8 100%);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14a2 2 0 0 1-2 2H8l-4.5 4V5a2 2 0 0 1 2-2H19a2 2 0 0 1 2 2v9z"/></svg></div>
        <div class="tile" style="width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(160deg, #4a4f58 0%, #23262c 60%, #131519 100%);"><div style="position: absolute; width: 23px; height: 23px; border-radius: 50%; background: radial-gradient(circle at 36% 32%, #9fc5ee 0%, #3c6ea8 32%, #1b2f4d 68%, #0c1524 100%); box-shadow: inset 0 1px 2px rgba(255,255,255,0.4), 0 1px 3px rgba(0,0,0,0.6); z-index: 1;"></div><div style="position: absolute; width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.75); top: 11px; left: 12px; z-index: 2; filter: blur(0.5px);"></div></div>
        <div class="tile" style="width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(160deg, #D7E3F2 0%, #8FA5C0 55%, #5E7492 100%);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5L16 16"/></svg></div>
      </div>
    </div>
    <div style="position: absolute; left: 50%; top: 16px; transform: translateX(-50%); width: 74px; height: 18px; border-radius: 10px; background: #060505;"></div>
  </div>

  <div style="position: absolute; left: 50%; bottom: 18px; display: flex; align-items: center; gap: 7px; opacity: 0; animation: riseC 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s forwards; transform: translateX(-50%);">
    <span class="h" style="font-size: 11px; font-weight: 700; color: #A8A29C; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 5px; padding: 2px 7px;">M</span>
    <span style="font-size: 11px; color: #6B655F; font-weight: 500;">Close phone</span>
  </div>
</div>
</x-dc>
</body>
</html>
