<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Segoe UI', system-ui, sans-serif; color: #ECE6D9; }
    a { color: #C3372B; } a:hover { color: #A32A1F; }
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    .scene { position: absolute; inset: 0; background: radial-gradient(1100px 560px at 70% 16%, #1a1d22 0%, rgba(26,29,34,0) 60%), linear-gradient(180deg, #121317 0%, #14151a 52%, #0a0b0d 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0.2) 45%, rgba(0,0,0,0.62) 100%); }
    .app { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .tile { width: 47px; height: 47px; border: 1.5px solid #16140F; background: #F7F2E8; display: flex; align-items: center; justify-content: center; border-radius: 10px; box-shadow: 2px 2px 0 rgba(22,20,15,0.14); }
    .aname { font-family: 'IBM Plex Mono', monospace; font-size: 7.5px; font-weight: 600; color: #57524A; letter-spacing: 0.06em; text-transform: uppercase; }
    @keyframes phoneUp { from { opacity: 0; transform: translate(-50%, -44%) rotate(1.5deg); } to { opacity: 1; transform: translate(-50%, -50%) rotate(0deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .rise { opacity: 0; animation: rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
    @keyframes riseC { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0a0b0d;">
  <div class="scene"></div>
  <div class="vig"></div>

  <div style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 312px; height: 650px; animation: phoneUp 0.65s cubic-bezier(0.2, 0.8, 0.2, 1) both;">
    <div style="position: absolute; inset: 0; border-radius: 34px; background: linear-gradient(160deg, #201e1a, #0e0d0b); box-shadow: 0 40px 90px rgba(0,0,0,0.75), inset 0 1px 1px rgba(255,255,255,0.12);"></div>
    <div style="position: absolute; left: 11px; top: 11px; right: 11px; bottom: 11px; border-radius: 25px; overflow: hidden; background: linear-gradient(175deg, #F2EDE1 0%, #EAE3D2 100%);">
      <div style="position: absolute; inset: 0; background-image: radial-gradient(rgba(22,20,15,0.05) 1px, transparent 1px); background-size: 4px 4px; pointer-events: none;"></div>

      <div class="mono" style="display: flex; justify-content: space-between; align-items: center; padding: 13px 20px 0; font-size: 9.5px; color: #57524A; position: relative;">
        <span style="font-weight: 600;">21:42</span>
        <span>MARLOW&nbsp;OS</span>
        <span>&#9679;&#9679;&#9679;&#9675; &nbsp;86%</span>
      </div>

      <div class="rise" style="padding: 20px 22px 0; position: relative; animation-delay: 0.15s;">
        <div class="serif" style="font-size: 52px; line-height: 0.95; color: #16140F;">21:42</div>
        <div class="serif" style="font-style: italic; font-size: 14px; color: #57524A; margin-top: 5px;">Saturday, August 22 &mdash; clear, 24&deg;</div>
        <div style="height: 2px; border-top: 1.5px solid #16140F; margin-top: 12px;"></div>
      </div>

      <div style="margin: 12px 16px 0; border: 1.5px solid #16140F; background: #F7F2E8; padding: 10px 13px; position: relative; opacity: 0; animation: slideDown 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #C3372B;"></div>
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <span style="font-size: 11px; font-weight: 700; color: #16140F;">Mia Vasquez</span>
          <span class="mono" style="font-size: 8px; color: #8A8478;">NOW</span>
        </div>
        <div class="serif" style="font-style: italic; font-size: 12.5px; color: #57524A; margin-top: 2px;">&ldquo;Tow truck needed at Sandy, you in?&rdquo;</div>
      </div>

      <div class="rise" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px 6px; padding: 18px 16px 0; position: relative; animation-delay: 0.42s;">
        <div class="app"><div class="tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a12 12 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></div><span class="aname">Calls</span></div>
        <div class="app"><div class="tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14a2 2 0 0 1-2 2H8l-4.5 4V5a2 2 0 0 1 2-2H19a2 2 0 0 1 2 2v9z"/></svg></div><span class="aname">Wires</span></div>
        <div class="app"><div class="tile" style="border-color: #C3372B; box-shadow: 2px 2px 0 rgba(195,55,43,0.3);"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#C3372B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M5 10V8l7-4 7 4v2M6 10v7M12 10v7M18 10v7M4 17h16v3H4z"/></svg></div><span class="aname" style="color: #C3372B;">Fleeca</span></div>
        <div class="app"><div class="tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 5.5c-.8.4-1.6.6-2.5.7a4.3 4.3 0 0 0-7.4 3v1A10.3 10.3 0 0 1 3 6s-4 9 5 13a11.7 11.7 0 0 1-7 2c9 5 20 0 20-11.5 0-.3 0-.6-.1-.9A7.7 7.7 0 0 0 22 5.5z"/></svg></div><span class="aname">Birdy</span></div>
        <div class="app"><div class="tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5L12 13l9.5-5.5"/></svg></div><span class="aname">Post</span></div>
        <div class="app"><div class="tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3a1.5 1.5 0 0 1 1.5 1.5V18a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 18V9.5A1.5 1.5 0 0 1 4 8z"/><circle cx="12" cy="13.4" r="3.4"/></svg></div><span class="aname">Camera</span></div>
        <div class="app"><div class="tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 13.1l1.7-4.4a2.2 2.2 0 0 1 2.1-1.4h11.2a2.2 2.2 0 0 1 2.1 1.4l1.7 4.4M2.2 13.1h19.6a.9.9 0 0 1 .9.9v3.1h-2.5M1.3 14v3.1h2.5M6.9 17.4a1.85 1.85 0 1 0 .01 0M17.1 17.4a1.85 1.85 0 1 0 .01 0M9.6 17.4h4.8"/></svg></div><span class="aname">Valet</span></div>
        <div class="app"><div class="tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7.2" width="19" height="11.8" rx="2"/><path d="M8.3 7.2V5.6a2.3 2.3 0 0 1 2.3-2.3h2.8a2.3 2.3 0 0 1 2.3 2.3v1.6M2.5 12.4h19"/></svg></div><span class="aname">Work</span></div>
        <div class="app"><div class="tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg></div><span class="aname">Clock</span></div>
        <div class="app"><div class="tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l2.6 5.3 5.9.9-4.2 4.1 1 5.9-5.3-2.8-5.3 2.8 1-5.9L3.5 8.7l5.9-.9z"/></svg></div><span class="aname">Ads</span></div>
        <div class="app"><div class="tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11.8 3.5c.6 3.2-1.5 4.6-1.5 7a3.4 3.4 0 0 0 6.8.3c0-3.3-3.3-4.3-3.3-7.3M6.5 13.5a5.5 5.5 0 1 0 11 .2"/></svg></div><span class="aname">Coin</span></div>
        <div class="app"><div class="tile"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#16140F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></div><span class="aname">Tune</span></div>
      </div>

      <div class="rise" style="position: absolute; left: 14px; right: 14px; bottom: 12px; border-top: 1.5px solid #16140F; padding-top: 9px; display: flex; justify-content: space-around; animation-delay: 0.55s;">
        <div class="mono" style="font-size: 8.5px; color: #57524A; letter-spacing: 0.1em;">RECENTS</div>
        <div class="mono" style="font-size: 8.5px; color: #C3372B; font-weight: 600; letter-spacing: 0.1em;">&#9632; HOME</div>
        <div class="mono" style="font-size: 8.5px; color: #57524A; letter-spacing: 0.1em;">SEARCH</div>
      </div>
    </div>
    <div style="position: absolute; left: 50%; top: 17px; transform: translateX(-50%); width: 64px; height: 15px; border-radius: 8px; background: #0a0908;"></div>
  </div>

  <div style="position: absolute; left: 50%; bottom: 16px; display: flex; align-items: center; gap: 8px; opacity: 0; animation: riseC 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.65s forwards; transform: translateX(-50%);">
    <span class="mono" style="font-size: 10px; color: #8A8478; letter-spacing: 0.14em;">[M] POCKET THE PHONE</span>
  </div>
</div>
</x-dc>
</body>
</html>
