<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Archivo', 'Segoe UI', system-ui, sans-serif; color: #ECE6D9; }
    a { color: #C3372B; } a:hover { color: #A32A1F; }
    .serif { font-family: 'Instrument Serif', Georgia, serif; }
    .mono { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    .scene { position: absolute; inset: 0; background: radial-gradient(1100px 560px at 70% 16%, #1a1d22 0%, rgba(26,29,34,0) 60%), linear-gradient(180deg, #121317 0%, #14151a 52%, #0a0b0d 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.55) 100%); }
    .card { position: relative; background: linear-gradient(175deg, #F4EFE4 0%, #EDE6D6 100%); color: #16140F; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    .card::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(rgba(22,20,15,0.045) 1px, transparent 1px); background-size: 5px 5px; }
    .lab { font-family: 'IBM Plex Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: #8A8478; text-transform: uppercase; }
    .stamp { display: inline-block; font-family: 'Archivo', sans-serif; font-weight: 800; letter-spacing: 0.12em; color: #C3372B; border: 2px solid #C3372B; border-radius: 3px; transform: rotate(5deg); opacity: 0.88; box-shadow: inset 0 0 0 1.5px #F1EBDF, inset 0 0 0 3px rgba(195,55,43,0.55); }
    @keyframes deal { from { opacity: 0; transform: translateX(32px) rotate(0.8deg); } to { opacity: 1; transform: none; } }
    .deal { opacity: 0; animation: deal 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    @keyframes growW { from { width: 0; } }
    @keyframes stampIn { 0% { opacity: 0; transform: scale(1.7) rotate(14deg); } 60% { opacity: 1; transform: scale(0.96) rotate(4deg); } 100% { opacity: 0.88; transform: scale(1) rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0a0b0d;">
  <div class="scene"></div>
  <svg style="position: absolute; left: 0; bottom: 0; opacity: 0.6;" width="1280" height="180" viewBox="0 0 1280 180" preserveAspectRatio="none">
    <polygon points="0,180 0,105 90,105 90,70 170,70 170,112 260,112 260,54 300,54 300,96 420,96 420,118 540,118 540,72 600,72 600,40 622,28 644,40 644,96 760,96 760,122 900,122 900,80 1000,80 1000,110 1120,110 1120,88 1280,88 1280,180" fill="#0d0e11"/>
  </svg>
  <div class="vig"></div>

  <div class="card deal" style="position: absolute; right: 76px; top: 68px; width: 392px; padding: 0 0 16px;">
    <div style="padding: 22px 26px 0;">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <div class="lab" style="color: #C3372B;">Valet Board &middot; Form V-7</div>
          <div class="serif" style="font-size: 30px; line-height: 1.05; margin-top: 6px;">Legion Square<br><span style="font-style: italic; font-size: 21px; color: #57524A;">garage &amp; storage</span></div>
        </div>
        <span class="stamp" style="font-size: 11px; padding: 4px 9px; animation: stampIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.5s both;">3 / 5</span>
      </div>
      <div style="height: 2.5px; border-top: 1.5px solid #16140F; border-bottom: 1px solid #16140F; margin: 16px 0 0;"></div>
    </div>

    <div style="padding: 6px 26px 0; position: relative; background: rgba(195,55,43,0.06);">
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #C3372B;"></div>
      <div style="display: flex; align-items: baseline; gap: 12px; padding: 12px 0 4px;">
        <span class="serif" style="font-style: italic; font-size: 19px; color: #C3372B;">01</span>
        <div style="flex: 1;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span class="serif" style="font-size: 21px;">Sultan RS</span>
            <span class="mono" style="font-size: 10.5px; font-weight: 600; border: 1px solid #16140F; padding: 2px 7px; background: #F7F2E8;">8ABC123</span>
          </div>
          <div style="display: flex; gap: 16px; margin-top: 8px; padding-bottom: 12px;">
            <div style="flex: 1;"><div style="display: flex; justify-content: space-between;"><span class="lab" style="color: #57524A;">Fuel</span><span class="mono" style="font-size: 9px; font-weight: 600;">84</span></div><div style="margin-top: 3px; height: 5px; border: 1px solid #16140F; padding: 1px; box-sizing: border-box;"><div style="width: 84%; height: 100%; background: #16140F; animation: growW 0.9s cubic-bezier(0.3, 0.7, 0.2, 1) 0.5s both;"></div></div></div>
            <div style="flex: 1;"><div style="display: flex; justify-content: space-between;"><span class="lab" style="color: #57524A;">Engine</span><span class="mono" style="font-size: 9px; font-weight: 600;">97</span></div><div style="margin-top: 3px; height: 5px; border: 1px solid #16140F; padding: 1px; box-sizing: border-box;"><div style="width: 97%; height: 100%; background: #2E7D5B; animation: growW 0.9s cubic-bezier(0.3, 0.7, 0.2, 1) 0.6s both;"></div></div></div>
            <span class="serif" style="font-style: italic; font-size: 18px; color: #C3372B; align-self: flex-end;">&rarr;</span>
          </div>
        </div>
      </div>
    </div>

    <div class="deal" style="padding: 0 26px; animation-delay: 0.12s;">
      <div style="display: flex; align-items: baseline; gap: 12px; padding: 13px 0; border-bottom: 1px solid rgba(22,20,15,0.22);">
        <span class="serif" style="font-style: italic; font-size: 17px; color: #8A8478;">02</span>
        <div style="flex: 1;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 15px; font-weight: 600;">Elegy Retro Custom</span>
            <span class="mono" style="font-size: 10px; color: #57524A;">4KLM980</span>
          </div>
          <div class="mono" style="font-size: 9.5px; color: #8A8478; margin-top: 3px;">FUEL 42 &middot; ENGINE 88</div>
        </div>
      </div>
    </div>

    <div class="deal" style="padding: 0 26px; animation-delay: 0.2s;">
      <div style="display: flex; align-items: baseline; gap: 12px; padding: 13px 0; border-bottom: 1px solid rgba(22,20,15,0.22);">
        <span class="serif" style="font-style: italic; font-size: 17px; color: #8A8478;">03</span>
        <div style="flex: 1;">
          <div style="display: flex; justify-content: space-between; align-items: baseline;">
            <span style="font-size: 15px; font-weight: 600;">Bravado Bison</span>
            <span class="mono" style="font-size: 10px; color: #57524A;">2QRS445</span>
          </div>
          <div class="mono" style="font-size: 9.5px; color: #8A8478; margin-top: 3px;">FUEL 96 &middot; ENGINE 100</div>
        </div>
      </div>
    </div>

    <div class="deal" style="padding: 0 26px; animation-delay: 0.28s;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; opacity: 0.55;">
        <span class="serif" style="font-style: italic; font-size: 17px; color: #8A8478;">04</span>
        <div style="flex: 1;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 15px; font-weight: 600; text-decoration: line-through; text-decoration-thickness: 1.5px;">Kamacho</span>
            <span class="stamp" style="font-size: 8.5px; padding: 2px 6px; transform: rotate(-4deg);">OUT</span>
          </div>
          <div class="mono" style="font-size: 9.5px; color: #8A8478; margin-top: 3px;">LAST SEEN &mdash; SANDY SHORES</div>
        </div>
      </div>
    </div>

    <div class="deal" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 26px 0; border-top: 1.5px dashed rgba(22,20,15,0.4); margin-top: 4px; animation-delay: 0.36s;">
      <div style="display: flex; gap: 12px;">
        <span class="mono" style="font-size: 9.5px; color: #57524A;">[&#8593;&#8595;] BROWSE</span>
        <span class="mono" style="font-size: 9.5px; color: #C3372B; font-weight: 600;">[&#8629;] RETRIEVE</span>
        <span class="mono" style="font-size: 9.5px; color: #57524A;">[ESC] CLOSE</span>
      </div>
      <span class="mono" style="font-size: 8.5px; color: #8A8478;">V-7 / LS-94</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
