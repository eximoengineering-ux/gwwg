<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Manrope', 'Segoe UI', system-ui, sans-serif; color: #F2F3F7; }
    a { color: #8B93FF; } a:hover { color: #AEB4FF; }
    .d { font-family: 'Sora', 'Segoe UI', system-ui, sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
    .scene { position: absolute; inset: 0; background:
      radial-gradient(1000px 520px at 70% 12%, #1a1d28 0%, rgba(26,29,40,0) 60%),
      radial-gradient(700px 400px at 18% 78%, rgba(139,147,255,0.05) 0%, rgba(139,147,255,0) 60%),
      linear-gradient(180deg, #101116 0%, #12131a 52%, #0b0c10 100%); }
    .vig { position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%); }
    .panel { position: relative; background: rgba(23,24,30,0.78); border: 1px solid rgba(255,255,255,0.07); border-radius: 18px; backdrop-filter: blur(24px); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 20px 50px rgba(0,0,0,0.45); }
    .row { position: relative; border-radius: 14px; padding: 13px 16px; display: flex; align-items: center; gap: 13px; }
    .lab { font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: #5D616E; }
    .chip { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,0.06); color: #9CA0AE; }
    .key { font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 7px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 2px 0 rgba(0,0,0,0.35); color: #9CA0AE; }
    @keyframes in { from { opacity: 0; transform: translateY(14px) scale(0.98); } to { opacity: 1; transform: none; } }
    .in { opacity: 0; animation: in 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    @keyframes growW { from { width: 0; } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</helmet>
<div style="position: relative; width: 1280px; height: 720px; overflow: hidden; background: #0b0c10;">
  <div class="scene"></div>
  <div class="vig"></div>

  <div class="panel in" style="position: absolute; right: 84px; top: 88px; width: 396px; padding: 22px 18px 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 6px 16px;">
      <div>
        <div class="lab" style="color: #8B93FF;">Garage</div>
        <div class="d" style="font-size: 21px; font-weight: 600; margin-top: 4px; letter-spacing: -0.01em;">Legion Square</div>
      </div>
      <span class="chip" style="background: rgba(139,147,255,0.12); color: #AEB4FF;">3 / 5 stored</span>
    </div>

    <div class="row in" style="background: rgba(139,147,255,0.09); box-shadow: inset 0 0 0 1px rgba(139,147,255,0.35), inset 0 1px 0 rgba(255,255,255,0.08); animation-delay: 0.08s;">
      <span style="position: absolute; left: 7px; top: 50%; transform: translateY(-50%); width: 4px; height: 26px; border-radius: 2px; background: #8B93FF; box-shadow: 0 0 10px rgba(139,147,255,0.7);"></span>
      <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(139,147,255,0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: 6px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#AEB4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 13.1l1.7-4.4a2.2 2.2 0 0 1 2.1-1.4h11.2a2.2 2.2 0 0 1 2.1 1.4l1.7 4.4M2.2 13.1h19.6a.9.9 0 0 1 .9.9v3.1h-2.5M1.3 14v3.1h2.5M6.9 17.4a1.85 1.85 0 1 0 .01 0M17.1 17.4a1.85 1.85 0 1 0 .01 0M9.6 17.4h4.8"/></svg>
      </div>
      <div style="flex: 1;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 14.5px; font-weight: 800;">Sultan RS</span>
          <span class="chip num" style="background: rgba(255,255,255,0.07); color: #C6C9D4;">8ABC123</span>
        </div>
        <div style="display: flex; gap: 14px; margin-top: 7px; align-items: center;">
          <div style="display: flex; align-items: center; gap: 6px;"><span class="lab">Fuel</span><div style="width: 46px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.09); overflow: hidden;"><div style="width: 84%; height: 100%; background: #FFC46B; border-radius: 2px; animation: growW 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;"></div></div></div>
          <div style="display: flex; align-items: center; gap: 6px;"><span class="lab">Engine</span><div style="width: 46px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.09); overflow: hidden;"><div style="width: 97%; height: 100%; background: #5FD4A2; border-radius: 2px; animation: growW 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;"></div></div></div>
        </div>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8B93FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>

    <div class="row in" style="animation-delay: 0.15s;">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9CA0AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 13.1l1.7-4.4a2.2 2.2 0 0 1 2.1-1.4h11.2a2.2 2.2 0 0 1 2.1 1.4l1.7 4.4M2.2 13.1h19.6a.9.9 0 0 1 .9.9v3.1h-2.5M1.3 14v3.1h2.5M6.9 17.4a1.85 1.85 0 1 0 .01 0M17.1 17.4a1.85 1.85 0 1 0 .01 0M9.6 17.4h4.8"/></svg>
      </div>
      <div style="flex: 1;">
        <span style="font-size: 14.5px; font-weight: 700; color: #C6C9D4;">Elegy Retro Custom</span>
        <div class="num" style="font-size: 11px; color: #5D616E; margin-top: 4px; font-weight: 600;">4KLM980 &middot; fuel 42% &middot; engine 88%</div>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3A3D47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>

    <div class="row in" style="animation-delay: 0.22s;">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#9CA0AE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 13.1l1.7-4.4a2.2 2.2 0 0 1 2.1-1.4h11.2a2.2 2.2 0 0 1 2.1 1.4l1.7 4.4M2.2 13.1h19.6a.9.9 0 0 1 .9.9v3.1h-2.5M1.3 14v3.1h2.5M6.9 17.4a1.85 1.85 0 1 0 .01 0M17.1 17.4a1.85 1.85 0 1 0 .01 0M9.6 17.4h4.8"/></svg>
      </div>
      <div style="flex: 1;">
        <span style="font-size: 14.5px; font-weight: 700; color: #C6C9D4;">Bravado Bison</span>
        <div class="num" style="font-size: 11px; color: #5D616E; margin-top: 4px; font-weight: 600;">2QRS445 &middot; fuel 96% &middot; engine 100%</div>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3A3D47" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </div>

    <div class="row in" style="opacity: 0; animation-delay: 0.29s; filter: opacity(0.55);">
      <div style="width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5D616E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.3" width="15" height="9.7" rx="3"/><path d="M8 10.3V7.4a4 4 0 0 1 8 0v2.9"/></svg>
      </div>
      <div style="flex: 1;">
        <span style="font-size: 14.5px; font-weight: 700; color: #9CA0AE;">Kamacho</span>
        <div style="font-size: 11px; color: #5D616E; margin-top: 4px; font-weight: 600;">Out &middot; last seen Sandy Shores</div>
      </div>
      <span class="chip" style="background: rgba(255,107,107,0.1); color: #FF9B9B;">out</span>
    </div>

    <div class="in" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 6px 0; margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.06); animation-delay: 0.36s;">
      <div style="display: flex; gap: 12px; align-items: center;">
        <div style="display: flex; align-items: center; gap: 6px;"><span class="key">&#8593;&#8595;</span><span style="font-size: 11px; color: #5D616E; font-weight: 600;">Browse</span></div>
        <div style="display: flex; align-items: center; gap: 6px;"><span class="key" style="color: #AEB4FF; border-color: rgba(139,147,255,0.35);">&#8629;</span><span style="font-size: 11px; color: #5D616E; font-weight: 600;">Retrieve</span></div>
        <div style="display: flex; align-items: center; gap: 6px;"><span class="key">esc</span><span style="font-size: 11px; color: #5D616E; font-weight: 600;">Close</span></div>
      </div>
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #8B93FF; animation: breathe 3s ease-in-out infinite;"></span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
