<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#0B0B0C;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F5F5F3;}
    a{color:#FF7A1F;} a:hover{color:#FFA45C;}
    @keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(300%);}}
    @keyframes floatGlow{0%,100%{opacity:.5;}50%{opacity:1;}}
  </style>
</helmet>
<div dir="rtl" style="width:1440px;height:810px;position:relative;overflow:hidden;background:
  radial-gradient(1100px 500px at 50% -15%, rgba(255,122,31,.14), transparent 65%),
  radial-gradient(900px 500px at 85% 110%, rgba(232,93,4,.08), transparent 60%),
  linear-gradient(180deg,#0E0F13 0%,#0B0B0C 100%);">

  <!-- subtle grid pattern -->
  <div style="position:absolute;inset:0;background:
    linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px),
    linear-gradient(0deg,rgba(255,255,255,.02) 1px,transparent 1px);
    background-size:64px 64px;"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(800px 500px at 50% 50%, transparent 30%, rgba(11,11,12,.8) 100%);"></div>

  <!-- top bar -->
  <div style="position:absolute;top:32px;inset-inline-start:48px;inset-inline-end:48px;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:12px;font-weight:700;color:#A8A8A4;background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 14px;">اللاعبون <span dir="ltr" style="color:#FFA45C;font-weight:800;font-variant-numeric:tabular-nums;">128 / 200</span></span>
      <span style="font-size:12px;font-weight:700;color:#A8A8A4;background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 14px;">discord.gg/[رابط السيرفر]</span>
    </div>
    <!-- music control -->
    <div style="display:flex;align-items:center;gap:12px;background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 8px 6px 16px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A8A8A4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <div style="width:80px;height:4px;border-radius:999px;background:#242428;position:relative;" dir="ltr"><div style="position:absolute;left:0;top:0;bottom:0;width:55%;border-radius:999px;background:#FF7A1F;"></div></div>
      <div style="width:30px;height:30px;border-radius:999px;background:#1C1C1F;border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="#F5F5F3" stroke="none"><path d="M6 4h3v16H6zM15 4h3v16h-3z"/></svg>
      </div>
    </div>
  </div>

  <!-- center identity -->
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);display:flex;flex-direction:column;align-items:center;gap:20px;">
    <div style="position:relative;">
      <div style="position:absolute;inset:-30px;background:radial-gradient(closest-side, rgba(255,122,31,.25), transparent);border-radius:999px;animation:floatGlow 3s ease-in-out infinite;"></div>
      <div style="position:relative;width:110px;height:110px;border-radius:26px;background:linear-gradient(135deg,#FF7A1F,#E85D04);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:44px;color:#14100B;box-shadow:0 24px 64px rgba(255,122,31,.35);">MT</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <h1 style="margin:0;font-size:44px;font-weight:900;letter-spacing:.5px;">MT <span style="color:#FF7A1F;">ROLEPLAY</span></h1>
      <p style="margin:0;font-size:15px;font-weight:600;color:#A8A8A4;">مدينة واقعية · اقتصاد متكامل · قصتك تبدأ هنا</p>
    </div>
  </div>

  <!-- tip card -->
  <div style="position:absolute;bottom:150px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 20px;backdrop-filter:blur(14px);max-width:620px;box-sizing:border-box;">
    <div style="width:38px;height:38px;border-radius:9px;background:rgba(255,122,31,.14);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5A5.9 5.9 0 0 0 18 7.5 6 6 0 0 0 6 7.5c0 1.5.5 2.9 1.5 4 .8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:1px;">
      <span style="font-size:12px;font-weight:800;color:#FFA45C;">نصيحة</span>
      <span style="font-size:13px;font-weight:600;color:#F5F5F3;line-height:1.6;">اضغط مطوّلاً على <span dir="ltr" style="color:#FFA45C;font-weight:800;">F1</span> لفتح القائمة الدائرية والوصول السريع لكل التفاعلات</span>
    </div>
  </div>

  <!-- progress -->
  <div style="position:absolute;bottom:64px;inset-inline-start:48px;inset-inline-end:48px;display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-size:13px;font-weight:700;color:#A8A8A4;">تحميل خرائط المدينة…</span>
      <span dir="ltr" style="font-size:14px;font-weight:800;color:#FFA45C;font-variant-numeric:tabular-nums;">72%</span>
    </div>
    <div style="height:6px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden;position:relative;" dir="ltr">
      <div style="height:100%;width:72%;border-radius:999px;background:linear-gradient(90deg,#E85D04,#FF7A1F);position:relative;overflow:hidden;">
        <div style="position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shimmer 1.8s ease-in-out infinite;"></div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
