<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#0B0A09;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F7F4EF;}
    a{color:#FF7A1F;} a:hover{color:#FFA45C;}
    @keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(400%);}}
    @keyframes breathe{0%,100%{opacity:.35;}50%{opacity:.8;}}
    .kicker{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#7A756C;}
    .num{font-variant-numeric:tabular-nums;}
    .stripes{background-image:repeating-linear-gradient(-45deg,rgba(255,138,53,.3) 0 2px,transparent 2px 9px);}
    .tickcol{width:2px;height:8px;background:rgba(255,235,210,.14);border-radius:1px;}
  </style>
</helmet>
<div dir="rtl" style="width:1440px;height:810px;position:relative;overflow:hidden;background:
  radial-gradient(1200px 680px at 84% -12%, rgba(255,122,31,.15), transparent 58%),
  radial-gradient(900px 520px at 6% 112%, rgba(242,107,10,.1), transparent 60%),
  linear-gradient(180deg,#12100E 0%,#0B0A09 100%);">

  <!-- warm dot grid + vignette -->
  <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(255,190,130,.06) 1px, transparent 1.4px);background-size:26px 26px;opacity:.5;"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(1100px 640px at 40% 45%, transparent 28%, rgba(11,10,9,.9) 100%);"></div>

  <!-- ghost monogram -->
  <span style="position:absolute;bottom:-140px;inset-inline-end:-60px;font-size:560px;font-weight:900;color:rgba(255,235,210,.03);line-height:1;pointer-events:none;" dir="ltr">MT</span>

  <!-- ambient beams -->
  <div style="position:absolute;top:-160px;inset-inline-start:180px;width:360px;height:600px;background:linear-gradient(180deg,rgba(255,138,53,.12),transparent 72%);filter:blur(46px);animation:breathe 5s ease-in-out infinite;transform:rotate(6deg);"></div>
  <div class="stripes" style="position:absolute;top:120px;inset-inline-end:220px;width:220px;height:44px;transform:skewX(-24deg);opacity:.22;border-radius:6px;"></div>
  <div class="stripes" style="position:absolute;top:174px;inset-inline-end:300px;width:120px;height:16px;transform:skewX(-24deg);opacity:.35;border-radius:4px;"></div>

  <!-- ═══ identity lockup ═══ -->
  <div style="position:absolute;top:168px;inset-inline-start:110px;display:flex;flex-direction:column;gap:22px;max-width:660px;">
    <div style="display:flex;align-items:center;gap:14px;">
      <div style="width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#FF9A3D,#F26B0A);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:#1A120B;box-shadow:0 12px 34px rgba(255,122,31,.45), inset 0 1px 0 rgba(255,255,255,.4);transform:skewX(-6deg);"><span style="display:inline-block;transform:skewX(6deg);">MT</span></div>
      <div style="padding:5px 16px;border:1px solid rgba(255,164,92,.3);background:rgba(255,138,53,.08);border-radius:999px;transform:skewX(-6deg);"><span class="kicker" style="color:#FFA45C;display:inline-block;transform:skewX(6deg);">Roleplay City</span></div>
    </div>
    <div style="position:relative;" dir="ltr">
      <h1 style="margin:0;font-size:112px;font-weight:900;line-height:.94;letter-spacing:-.01em;">MT<br><span style="background:linear-gradient(100deg,#FFB878 0%,#FF7A1F 55%,#F26B0A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;">ROLEPLAY</span></h1>
      <div style="position:absolute;top:100%;left:4px;margin-top:14px;height:3px;width:210px;border-radius:2px;background:linear-gradient(90deg,#FF8A35,transparent);box-shadow:0 0 16px rgba(255,138,53,.6);"></div>
    </div>
    <p style="margin:10px 0 0;font-size:16px;font-weight:600;color:#B3ADA3;line-height:1.8;">مدينة واقعية · اقتصاد متكامل · قصتك تبدأ هنا</p>
    <div style="display:flex;align-items:center;gap:10px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5A5.9 5.9 0 0 0 18 7.5 6 6 0 0 0 6 7.5c0 1.5.5 2.9 1.5 4 .8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>
      <span style="font-size:13px;font-weight:600;color:#B3ADA3;">اضغط مطوّلاً على <span dir="ltr" style="color:#FFA45C;font-weight:800;">F1</span> لفتح القائمة الدائرية والوصول السريع لكل التفاعلات</span>
    </div>
  </div>

  <!-- ═══ top strips ═══ -->
  <div style="position:absolute;top:44px;inset-inline-start:110px;display:flex;align-items:center;gap:18px;">
    <span style="font-size:12px;font-weight:700;color:#B3ADA3;">اللاعبون <span class="num" dir="ltr" style="color:#FFA45C;font-weight:800;">128/200</span></span>
    <div style="width:1px;height:14px;background:rgba(255,164,92,.2);"></div>
    <span style="font-size:12px;font-weight:700;color:#B3ADA3;">ديسكورد <span dir="ltr" style="color:#7A756C;">[رابط السيرفر]</span></span>
  </div>
  <div style="position:absolute;top:44px;inset-inline-end:110px;display:flex;align-items:center;gap:12px;">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#7A756C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span style="font-size:11px;font-weight:700;color:#7A756C;">مقطع <span dir="ltr">2 / 6</span></span>
    <div style="width:90px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);position:relative;" dir="ltr"><div style="position:absolute;left:0;top:0;bottom:0;width:55%;border-radius:2px;background:#FF8A35;box-shadow:0 0 8px rgba(255,138,53,.5);"></div></div>
    <div style="width:30px;height:30px;border-radius:999px;border:1px solid rgba(255,164,92,.22);display:flex;align-items:center;justify-content:center;">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="#B3ADA3" stroke="none"><path d="M6 4h3v16H6zM15 4h3v16h-3z"/></svg>
    </div>
  </div>

  <!-- ═══ progress ═══ -->
  <div style="position:absolute;bottom:0;left:0;right:0;">
    <span class="num" style="position:absolute;bottom:48px;inset-inline-end:96px;font-size:150px;font-weight:900;color:rgba(255,235,210,.05);line-height:1;pointer-events:none;" dir="ltr">72<span style="font-size:60px;">%</span></span>
    <div style="display:flex;align-items:flex-end;justify-content:space-between;padding:0 64px 14px;">
      <div style="display:flex;flex-direction:column;gap:8px;">
        <span style="font-size:12px;font-weight:700;color:#7A756C;">تحميل خرائط المدينة…</span>
        <div style="display:flex;gap:6px;align-items:flex-end;" dir="ltr">
          <div class="tickcol" style="height:12px;background:#FF8A35;"></div><div class="tickcol" style="background:#FF8A35;"></div><div class="tickcol" style="background:#FF8A35;"></div><div class="tickcol" style="height:12px;background:#FF8A35;"></div><div class="tickcol" style="background:#FF8A35;"></div><div class="tickcol" style="background:#FF8A35;"></div><div class="tickcol" style="height:12px;background:#FF8A35;"></div><div class="tickcol" style="background:#FF8A35;"></div><div class="tickcol"></div><div class="tickcol" style="height:12px;"></div><div class="tickcol"></div><div class="tickcol"></div>
        </div>
      </div>
      <span class="num" dir="ltr" style="font-size:24px;font-weight:900;color:#FFA45C;">72<span style="font-size:12px;color:#7A756C;font-weight:700;">%</span></span>
    </div>
    <div style="height:4px;background:rgba(255,255,255,.06);position:relative;overflow:hidden;" dir="ltr">
      <div style="height:100%;width:72%;background:linear-gradient(90deg,#F26B0A,#FF9A3D);position:relative;overflow:hidden;box-shadow:0 0 18px rgba(255,138,53,.65);border-radius:0 3px 3px 0;">
        <div style="position:absolute;inset:0;background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.3) 0 5px,transparent 5px 12px);opacity:.5;"></div>
        <div style="position:absolute;top:0;bottom:0;width:25%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:shimmer 2s ease-in-out infinite;"></div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
