<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#0B0A09;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F7F4EF;}
    a{color:#FF7A1F;} a:hover{color:#FFA45C;}
    .kicker{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7A756C;}
    .num{font-variant-numeric:tabular-nums;}
    .tick{display:inline-block;width:8px;height:9px;border-radius:3px;background:linear-gradient(180deg,#FF9A3D,#F26B0A);transform:skewX(-14deg);margin-inline-end:8px;vertical-align:middle;}
    .glass{background:rgba(19,16,13,.85);border:1px solid rgba(255,164,92,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
    .shadow{filter:drop-shadow(0 12px 30px rgba(0,0,0,.5));}
    .glowline{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#FF8A35 30%,#FF8A35 70%,transparent);box-shadow:0 0 14px rgba(255,138,53,.55);}
    .healthbar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);position:relative;overflow:hidden;}
    .healthfill{height:100%;border-radius:3px;background:linear-gradient(90deg,#FF5D5D,#FF3333);box-shadow:0 0 12px rgba(255,93,93,.6);}
    .armorfill{height:100%;border-radius:3px;background:linear-gradient(90deg,#5CA8FF,#3D8FFF);box-shadow:0 0 12px rgba(92,168,255,.5);}
  </style>
</helmet>
<div dir="rtl" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:40px;">

  <!-- ═══ centered target ═══ -->
  <div style="display:flex;flex-direction:column;gap:20px;align-items:center;">
    <div style="position:relative;width:200px;height:200px;">
      <svg width="200" height="200" viewBox="0 0 200 200" style="position:absolute;inset:0;">
        <defs>
          <style>
            @keyframes pulse{0%,100%{opacity:.4;}50%{opacity:1;}}
            @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
          </style>
        </defs>
        <!-- outer circle -->
        <circle cx="100" cy="100" r="95" fill="none" stroke="rgba(255,138,53,.15)" stroke-width="2"/>
        <!-- middle circle spinning -->
        <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(255,138,53,.25)" stroke-width="1.5" style="animation:spin 8s linear infinite;transform-origin:center;"/>
        <!-- inner circle pulsing -->
        <circle cx="100" cy="100" r="55" fill="none" stroke="#FF8A35" stroke-width="2" style="animation:pulse 1.5s ease-in-out infinite;"/>
        <!-- crosshair -->
        <g stroke="#FF8A35" stroke-width="1.5" stroke-linecap="round" opacity=".7">
          <line x1="100" y1="50" x2="100" y2="70"/>
          <line x1="100" y1="130" x2="100" y2="150"/>
          <line x1="50" y1="100" x2="70" y2="100"/>
          <line x1="130" y1="100" x2="150" y2="100"/>
        </g>
        <!-- target dot -->
        <circle cx="100" cy="100" r="4" fill="#FF8A35" opacity=".8"/>
      </svg>
    </div>
    <span style="font-size:11px;color:#B3ADA3;text-align:center;max-width:180px;">اضغط <span dir="ltr" style="color:#FFA45C;font-weight:800;">TAB</span> لتبديل الهدف</span>
  </div>

  <!-- ═══ target info panel (on left side) ═══ -->
  <div class="shadow" style="display:flex;flex-direction:column;gap:14px;transform:perspective(1200px) rotateY(-8deg) rotateX(2deg);">
    <div class="glass" style="border-radius:14px;padding:16px;width:280px;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.08), -8px 16px 32px rgba(0,0,0,.6);">
      <div class="glowline" style="position:absolute;top:0;left:16px;right:16px;"></div>

      <!-- header -->
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div style="display:flex;flex-direction:column;gap:2px;">
          <span style="font-size:14px;font-weight:900;">محمد العتيبي</span>
          <span class="kicker num" dir="ltr">PID-1042 · GANG</span>
        </div>
        <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#FF5D5D,#E63333);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#1A120B;">🔴</div>
      </div>

      <!-- health section -->
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="kicker" style="color:#FF5D5D;">الصحة</span>
          <span class="num" dir="ltr" style="font-size:12px;color:#F7F4EF;font-weight:800;">75 / 100</span>
        </div>
        <div class="healthbar" style="width:100%;">
          <div class="healthfill" style="width:75%;"></div>
        </div>
      </div>

      <!-- armor section -->
      <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="kicker" style="color:#5CA8FF;">الدرع</span>
          <span class="num" dir="ltr" style="font-size:12px;color:#F7F4EF;font-weight:800;">45 / 100</span>
        </div>
        <div class="healthbar" style="width:100%;">
          <div class="armorfill" style="width:45%;"></div>
        </div>
      </div>

      <!-- status -->
      <div style="display:flex;gap:8px;padding:10px;border-radius:8px;background:rgba(255,93,93,.08);border:1px solid rgba(255,93,93,.2);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FF5D5D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 6v6l4 2"/>
        </svg>
        <span style="font-size:11px;color:#B3ADA3;">مسلّح · تحت السلاح</span>
      </div>
    </div>
  </div>

  <!-- ═══ health only variant (right side) ═══ -->
  <div class="shadow" style="display:flex;flex-direction:column;gap:14px;transform:perspective(1200px) rotateY(6deg) rotateX(-2deg);">
    <div class="glass" style="border-radius:14px;padding:12px 14px;width:240px;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 6px 12px 28px rgba(0,0,0,.5);">
      <div class="glowline" style="position:absolute;top:0;left:14px;right:14px;opacity:.5;"></div>

      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <div style="width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#FF5D5D,#E63333);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;color:#1A120B;">🔴</div>
        <div style="display:flex;flex-direction:column;gap:1px;flex:1;">
          <span style="font-size:12px;font-weight:800;">فهد المطيري</span>
          <span class="kicker num" dir="ltr" style="font-size:8px;">PID-2104</span>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;">
        <div class="healthbar" style="width:100%;height:4px;">
          <div class="healthfill" style="width:60%;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:10px;">
          <span class="kicker">الصحة</span>
          <span class="num" dir="ltr" style="color:#F7F4EF;font-weight:800;">60%</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ distant target (far away) ═══ -->
  <div style="display:flex;flex-direction:column;gap:12px;align-items:center;">
    <div style="position:relative;width:120px;height:120px;">
      <svg width="120" height="120" viewBox="0 0 120 120" style="position:absolute;inset:0;">
        <circle cx="60" cy="60" r="55" fill="none" stroke="rgba(255,138,53,.2)" stroke-width="2"/>
        <circle cx="60" cy="60" r="40" fill="none" stroke="rgba(255,138,53,.3)" stroke-width="1"/>
        <circle cx="60" cy="60" r="3" fill="#FF8A35"/>
      </svg>
    </div>
    <div style="text-align:center;">
      <div style="font-size:11px;font-weight:800;">مجهول</div>
      <div class="num" dir="ltr" style="font-size:10px;color:#B3ADA3;">324م</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
