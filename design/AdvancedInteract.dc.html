<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#0B0A09;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F7F4EF;}
    a{color:#FF7A1F;} a:hover{color:#FFA45C;}
    .kicker{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7A756C;}
    .num{font-variant-numeric:tabular-nums;}
    .tick{display:inline-block;width:8px;height:9px;border-radius:3px;background:linear-gradient(180deg,#FF9A3D,#F26B0A);transform:skewX(-14deg);margin-inline-end:8px;vertical-align:middle;}
    .panel{background:linear-gradient(160deg,#241C15 0%,#161311 45%,#100E0D 100%);border:1px solid rgba(255,164,92,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);border-radius:14px;}
    .glass{background:rgba(19,16,13,.85);border:1px solid rgba(255,164,92,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
    .shadow{filter:drop-shadow(0 16px 36px rgba(0,0,0,.5));}
    .glowline{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#FF8A35 30%,#FF8A35 70%,transparent);box-shadow:0 0 14px rgba(255,138,53,.55);}
    .kbd{min-width:24px;height:24px;padding:0 7px;border-radius:7px;background:#262019;border:1px solid rgba(255,164,92,.22);box-shadow:inset 0 -2px 0 rgba(0,0,0,.5);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;box-sizing:border-box;}
  </style>
</helmet>
<div dir="rtl" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:40px;flex-wrap:wrap;">

  <!-- ═══ advanced context menu ═══ -->
  <div class="shadow" style="display:flex;flex-direction:column;gap:14px;">
    <div class="panel" style="padding:14px 0;width:320px;position:relative;overflow:hidden;">
      <div class="glowline" style="position:absolute;top:0;left:14px;right:14px;"></div>

      <div style="padding:14px 16px;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          <span style="font-size:12px;font-weight:800;">خيارات سريعة</span>
        </div>
      </div>

      <!-- options -->
      <div style="display:flex;flex-direction:column;">
        <!-- option 1 -->
        <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid rgba(255,164,92,.08);cursor:pointer;transition:all .2s ease;" onmouseover="this.style.background='rgba(255,138,53,.06)'" onmouseout="this.style.background=''">
          <div style="width:36px;height:36px;border-radius:8px;background:rgba(255,122,31,.1);border:1px solid rgba(255,164,92,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="2"><path d="M7 4.5v15l13-7.5z"/></svg>
          </div>
          <div style="flex:1;">
            <span style="font-size:12px;font-weight:800;">استقبال الهدية</span>
            <div style="font-size:10px;color:#B3ADA3;margin-top:2px;">الضغط والإمساك <span class="kbd" dir="ltr">E</span></div>
          </div>
          <span class="num" dir="ltr" style="font-size:10px;color:#7A756C;">5.2ث</span>
        </div>

        <!-- option 2 -->
        <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid rgba(255,164,92,.08);cursor:pointer;transition:all .2s ease;" onmouseover="this.style.background='rgba(255,138,53,.06)'" onmouseout="this.style.background=''">
          <div style="width:36px;height:36px;border-radius:8px;background:rgba(62,207,142,.1);border:1px solid rgba(62,207,142,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <div style="flex:1;">
            <span style="font-size:12px;font-weight:800;">فتح الباب</span>
            <div style="font-size:10px;color:#B3ADA3;margin-top:2px;">فورية <span class="kbd" dir="ltr">R</span></div>
          </div>
        </div>

        <!-- option 3 -->
        <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid rgba(255,164,92,.08);cursor:pointer;transition:all .2s ease;" onmouseover="this.style.background='rgba(255,138,53,.06)'" onmouseout="this.style.background=''">
          <div style="width:36px;height:36px;border-radius:8px;background:rgba(92,168,255,.1);border:1px solid rgba(92,168,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5CA8FF" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          </div>
          <div style="flex:1;">
            <span style="font-size:12px;font-weight:800;">معاينة</span>
            <div style="font-size:10px;color:#B3ADA3;margin-top:2px;">الفورية <span class="kbd" dir="ltr">T</span></div>
          </div>
        </div>

        <!-- option 4 -->
        <div style="display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid rgba(255,164,92,.08);cursor:pointer;transition:all .2s ease;" onmouseover="this.style.background='rgba(255,138,53,.06)'" onmouseout="this.style.background=''">
          <div style="width:36px;height:36px;border-radius:8px;background:rgba(255,93,93,.1);border:1px solid rgba(255,93,93,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF5D5D" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </div>
          <div style="flex:1;">
            <span style="font-size:12px;font-weight:800;">حذف</span>
            <div style="font-size:10px;color:#B3ADA3;margin-top:2px;">حذر! <span class="kbd" dir="ltr">DEL</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ drag & drop preview ═══ -->
  <div class="shadow" style="display:flex;flex-direction:column;gap:14px;">
    <div class="panel" style="padding:16px;width:320px;position:relative;overflow:hidden;">
      <div class="glowline" style="position:absolute;top:0;left:16px;right:16px;"></div>

      <div style="margin-bottom:12px;">
        <span class="kicker" style="color:#FFA45C;">سحب وإفلات</span>
      </div>

      <!-- source slot -->
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;">
        <span style="font-size:11px;font-weight:700;color:#B3ADA3;">من</span>
        <div style="width:100%;height:70px;border-radius:10px;background:linear-gradient(160deg,#241C15,#100E0D);border:2px solid rgba(255,122,31,.35);display:flex;align-items:center;justify-content:center;position:relative;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          <span class="num" style="position:absolute;bottom:5px;right:8px;font-size:10px;font-weight:700;color:#FFA45C;" dir="ltr">x8</span>
          <div style="position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:4px;background:#FF8A35;color:#1A120B;font-weight:900;font-size:9px;display:flex;align-items:center;justify-content:center;">1</div>
        </div>
      </div>

      <!-- arrow -->
      <div style="display:flex;align-items:center;justify-content:center;margin-bottom:14px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><polyline points="19 12 12 19 5 12"/></svg>
      </div>

      <!-- target slot -->
      <div style="display:flex;flex-direction:column;gap:8px;">
        <span style="font-size:11px;font-weight:700;color:#B3ADA3;">إلى</span>
        <div style="width:100%;height:70px;border-radius:10px;background:rgba(19,16,13,.4);border:2px dashed rgba(255,164,92,.25);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:all .2s ease;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
      </div>

      <p style="margin:12px 0 0;font-size:10px;color:#B3ADA3;text-align:center;">اسحب للنقل · اترك للإفلات</p>
    </div>
  </div>

  <!-- ═══ skill cooldown ═══ -->
  <div class="shadow" style="display:flex;flex-direction:column;gap:14px;">
    <div class="panel" style="padding:16px;width:320px;position:relative;overflow:hidden;">
      <div class="glowline" style="position:absolute;top:0;left:16px;right:16px;"></div>

      <div style="margin-bottom:12px;">
        <span class="kicker" style="color:#5CA8FF;">مهارات و قدرات</span>
      </div>

      <!-- skill card -->
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:50px;height:50px;border-radius:10px;background:linear-gradient(135deg,rgba(92,168,255,.2),rgba(92,168,255,.1));border:1px solid rgba(92,168,255,.25);display:flex;align-items:center;justify-content:center;position:relative;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5CA8FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <!-- cooldown overlay -->
            <div style="position:absolute;inset:0;border-radius:10px;background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,.8) 100%);display:flex;align-items:center;justify-content:center;">
              <span style="font-weight:900;font-size:14px;color:#F7F4EF;">8</span>
            </div>
          </div>
          <div style="flex:1;">
            <span style="font-size:13px;font-weight:800;">الركض السريع</span>
            <span class="num" dir="ltr" style="font-size:10px;color:#B3ADA3;margin-top:2px;">تعطيل: 8 ثواني</span>
          </div>
          <span class="kbd" dir="ltr">SHIFT</span>
        </div>

        <!-- progress bar -->
        <div style="height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;">
          <div style="height:100%;width:30%;background:linear-gradient(90deg,#5CA8FF,#7dc3ff);box-shadow:0 0 8px rgba(92,168,255,.4);border-radius:3px;"></div>
        </div>
      </div>

      <div class="glowline" style="margin:12px 0;opacity:.4;"></div>

      <!-- ready skill -->
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:50px;height:50px;border-radius:10px;background:linear-gradient(135deg,rgba(62,207,142,.2),rgba(62,207,142,.1));border:1px solid rgba(62,207,142,.25);display:flex;align-items:center;justify-content:center;position:relative;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <!-- ready indicator -->
          <div style="position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:999px;background:#3ECF8E;border:2px solid #0B0A09;box-shadow:0 0 8px rgba(62,207,142,.8);"></div>
        </div>
        <div style="flex:1;">
          <span style="font-size:13px;font-weight:800;color:#3ECF8E;">الدرع السحري</span>
          <span class="num" dir="ltr" style="font-size:10px;color:#3ECF8E;margin-top:2px;">جاهز للاستخدام</span>
        </div>
        <span class="kbd" style="background:#3ECF8E;color:#0B0A09;border:none;" dir="ltr">Q</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
