<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#0B0A09;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F7F4EF;}
    a{color:#FF7A1F;} a:hover{color:#FFA45C;}
    .kicker{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#7A756C;}
    .num{font-variant-numeric:tabular-nums;}
    .stripes{background-image:repeating-linear-gradient(-45deg,rgba(255,138,53,.3) 0 2px,transparent 2px 9px);}
  </style>
</helmet>
<div dir="rtl" style="width:820px;height:920px;background:
  radial-gradient(520px 520px at 50% 54%, rgba(255,122,31,.08), transparent 70%),
  #0B0A09;padding:36px 40px 28px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;">

  <div style="position:absolute;inset:0;background-image:radial-gradient(rgba(255,190,130,.05) 1px, transparent 1.4px);background-size:26px 26px;opacity:.5;"></div>
  <span style="position:absolute;top:6px;inset-inline-end:20px;font-size:80px;font-weight:900;color:rgba(255,255,255,.035);line-height:1;pointer-events:none;" dir="ltr">06</span>

  <div style="display:flex;flex-direction:column;gap:4px;position:relative;">
    <div style="align-self:flex-start;padding:3px 12px;border:1px solid rgba(255,122,31,.3);background:rgba(255,122,31,.08);border-radius:10px;transform:skewX(-10deg);"><span class="kicker" style="color:#FFA45C;display:inline-block;transform:skewX(10deg);">mt_radialmenu</span></div>
    <h1 style="margin:0;font-size:24px;font-weight:900;line-height:1.25;">القائمة الدائرية</h1>
    <p style="margin:0;font-size:13px;color:#B3ADA3;line-height:1.5;">ضغط مستمر على <span dir="ltr" style="color:#FFA45C;font-weight:800;">F1</span> — المشهد خلفها يُعتم 50% ويُموّه</p>
  </div>

  <div style="position:relative;width:720px;height:720px;align-self:center;">
    <svg width="720" height="720" viewBox="0 0 720 720">
      <defs>
        <linearGradient id="segActive" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FF9A3D"/>
          <stop offset="1" stop-color="#F26B0A"/>
        </linearGradient>
        <linearGradient id="segBase" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="rgba(36,28,21,.97)"/>
          <stop offset="1" stop-color="rgba(17,14,12,.97)"/>
        </linearGradient>
        <pattern id="diagP" width="8" height="8" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="2.5" height="8" fill="rgba(255,255,255,.15)"/></pattern>
      </defs>

      <!-- outer tick ruler ring -->
      <circle cx="360" cy="360" r="284" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="7" stroke-dasharray="1.5 13.4"/>
      <!-- active glow arc -->
      <path d="M267.6,110.9 A265,265 0 0 1 452.4,110.9" fill="none" stroke="#FF7A1F" stroke-width="3" stroke-linecap="round" style="filter:drop-shadow(0 0 10px rgba(255,122,31,.8));"/>

      <g>
        <path d="M272.5,125.7 A250,250 0 0 1 447.5,125.7 L419.5,200.7 A170,170 0 0 0 300.5,200.7 Z"
              fill="url(#segActive)" style="filter:drop-shadow(0 0 22px rgba(255,122,31,.45));"/>
        <path d="M272.5,125.7 A250,250 0 0 1 447.5,125.7 L419.5,200.7 A170,170 0 0 0 300.5,200.7 Z" fill="url(#diagP)"/>
        <path transform="rotate(45,360,360)" d="M272.5,125.7 A250,250 0 0 1 447.5,125.7 L419.5,200.7 A170,170 0 0 0 300.5,200.7 Z" fill="url(#segBase)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
        <path transform="rotate(90,360,360)" d="M272.5,125.7 A250,250 0 0 1 447.5,125.7 L419.5,200.7 A170,170 0 0 0 300.5,200.7 Z" fill="url(#segBase)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
        <path transform="rotate(135,360,360)" d="M272.5,125.7 A250,250 0 0 1 447.5,125.7 L419.5,200.7 A170,170 0 0 0 300.5,200.7 Z" fill="url(#segBase)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
        <path transform="rotate(180,360,360)" d="M272.5,125.7 A250,250 0 0 1 447.5,125.7 L419.5,200.7 A170,170 0 0 0 300.5,200.7 Z" fill="url(#segBase)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
        <path transform="rotate(225,360,360)" d="M272.5,125.7 A250,250 0 0 1 447.5,125.7 L419.5,200.7 A170,170 0 0 0 300.5,200.7 Z" fill="url(#segBase)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
        <path transform="rotate(270,360,360)" d="M272.5,125.7 A250,250 0 0 1 447.5,125.7 L419.5,200.7 A170,170 0 0 0 300.5,200.7 Z" fill="url(#segBase)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
        <path transform="rotate(315,360,360)" d="M272.5,125.7 A250,250 0 0 1 447.5,125.7 L419.5,200.7 A170,170 0 0 0 300.5,200.7 Z" fill="url(#segBase)" stroke="rgba(255,255,255,.06)" stroke-width="1"/>
      </g>

      <!-- icons at radius 210 -->
      <g transform="translate(348,138)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A120B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6"/></svg>
      </g>
      <g transform="translate(496.5,199.5)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
      </g>
      <g transform="translate(558,348)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg>
      </g>
      <g transform="translate(496.5,496.5)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><path d="M9 9h.01M15 9h.01"/></svg>
      </g>
      <g transform="translate(348,558)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
      </g>
      <g transform="translate(199.5,496.5)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v6"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="m7 15-1.8-1.8a2 2 0 0 0-2.8 2.8L8 21.6c1 1 2.4 1.6 3.8 1.6H15a5 5 0 0 0 5-5v-5a2 2 0 0 0-4 0"/></svg>
      </g>
      <g transform="translate(138,348)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
      </g>
      <g transform="translate(199.5,199.5)">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </g>

      <!-- center hub with bracket marks -->
      <circle cx="360" cy="360" r="128" fill="#14110E" stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>
      <path d="M348 240 h24 M348 480 h24 M240 348 v24 M480 348 v24" stroke="rgba(255,122,31,.5)" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div style="position:absolute;top:0;left:0;width:720px;height:720px;display:flex;align-items:center;justify-content:center;pointer-events:none;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;">
        <span class="kicker num" style="color:#FFA45C;font-size:9px;" dir="ltr">1 / 8 · Vehicle</span>
        <span style="font-size:22px;font-weight:900;line-height:1.2;">المركبة</span>
        <span style="font-size:11px;font-weight:600;color:#7A756C;">قفل · صندوق · محرك</span>
        <div style="display:flex;align-items:center;gap:6px;margin-top:10px;">
          <span dir="ltr" style="min-width:24px;height:22px;padding:0 6px;border-radius:10px;background:#262019;border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.55);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;box-sizing:border-box;transform:skewX(-6deg);">ESC</span>
          <span style="font-size:10px;font-weight:700;color:#7A756C;">إغلاق</span>
        </div>
      </div>
    </div>
  </div>

  <div style="display:flex;align-items:center;justify-content:center;gap:8px;position:relative;">
    <div class="stripes" style="width:36px;height:8px;border-radius:2px;transform:skewX(-24deg);opacity:.5;"></div>
    <span style="font-size:11px;color:#7A756C;font-weight:600;">القطاع النشط يتوسّع <span dir="ltr">4%</span> مع توهج · فتح 200ms بدوران <span dir="ltr">-6°→0°</span> · 8 قطاعات كحد أقصى</span>
    <div class="stripes" style="width:36px;height:8px;border-radius:2px;transform:skewX(-24deg);opacity:.5;"></div>
  </div>

</div>
</x-dc>
</body>
</html>
