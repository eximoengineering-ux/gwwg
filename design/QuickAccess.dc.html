<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#0B0A09;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F7F4EF;}
    a{color:#FF7A1F;} a:hover{color:#FFA45C;}
    .kicker{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7A756C;}
    .num{font-variant-numeric:tabular-nums;}
    .panel{background:linear-gradient(160deg,#241C15 0%,#161311 45%,#100E0D 100%);border:1px solid rgba(255,164,92,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);border-radius:14px;}
    .shadow{filter:drop-shadow(0 16px 36px rgba(0,0,0,.5));}
    .glowline{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#FF8A35 30%,#FF8A35 70%,transparent);box-shadow:0 0 14px rgba(255,138,53,.55);}
    .slot{width:70px;height:70px;border-radius:12px;background:linear-gradient(160deg,#241C15,#100E0D);border:1px solid rgba(255,164,92,.13);position:relative;display:flex;align-items:center;justify-content:center;box-sizing:border-box;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);cursor:pointer;transition:all .2s ease;}
    .slot:hover{border-color:rgba(255,164,92,.35);background:linear-gradient(160deg,#2a231a,#140d0a);}
    .slot-active{border-color:rgba(255,164,92,.4);background:linear-gradient(160deg,#2a231a,#140d0a);}
    .slot-hotkey{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:6px;background:#FF8A35;color:#1A120B;font-weight:900;font-size:10px;display:flex;align-items:center;justify-content:center;}
  </style>
</helmet>
<div dir="rtl" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:60px;padding:40px;flex-wrap:wrap;">

  <!-- ═══ quick access bar (horizontal) ═══ -->
  <div class="shadow" style="display:flex;flex-direction:column;gap:14px;transform:perspective(1200px) rotateY(-4deg) rotateX(2deg);">
    <div class="panel" style="padding:16px;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.07), -4px 12px 30px rgba(0,0,0,.55);">
      <div class="glowline" style="position:absolute;top:0;left:16px;right:16px;"></div>

      <div style="margin-bottom:12px;">
        <span class="kicker" style="color:#FFA45C;">الوصول السريع</span>
      </div>

      <div style="display:flex;gap:8px;">
        <!-- slot 1 -->
        <div class="slot slot-active" style="position:relative;">
          <div class="slot-hotkey">1</div>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          <div style="position:absolute;bottom:4px;right:4px;width:8px;height:8px;border-radius:999px;background:#FF8A35;box-shadow:0 0 8px rgba(255,138,53,.8);"></div>
        </div>

        <!-- slot 2 -->
        <div class="slot" style="position:relative;">
          <div class="slot-hotkey">2</div>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a1 1 0 0 1 0 4H4a1 1 0 0 1 0-4z"/><path d="M6 11c0-3 2.5-5 6-5s6 2 6 5"/><path d="M5 15c0 2 2 4 4 4h6c2 0 4-2 4-4"/></svg>
        </div>

        <!-- slot 3 -->
        <div class="slot" style="position:relative;">
          <div class="slot-hotkey">3</div>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>

        <!-- slot 4 -->
        <div class="slot" style="position:relative;">
          <div class="slot-hotkey">4</div>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
        </div>

        <!-- slot empty -->
        <div class="slot" style="border-style:dashed;opacity:.5;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ quick access grid (3x3) ═══ -->
  <div class="shadow" style="display:flex;flex-direction:column;gap:14px;transform:perspective(1200px) rotateY(3deg) rotateX(-2deg);">
    <div class="panel" style="padding:20px;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 3px 10px 28px rgba(0,0,0,.5);">
      <div class="glowline" style="position:absolute;top:0;left:20px;right:20px;"></div>

      <div style="margin-bottom:16px;">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span class="kicker">حقيبة الجسم</span>
        </div>
        <p style="margin:0;font-size:11px;color:#B3ADA3;">9 أماكن متاحة من أصل 10</p>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3, 80px);gap:10px;justify-content:center;">
        <div class="slot" style="position:relative;">
          <div class="slot-hotkey" style="background:#FF8A35;">1</div>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          <span class="num" style="position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:700;color:#FFA45C;" dir="ltr">x1</span>
        </div>

        <div class="slot" style="position:relative;">
          <div class="slot-hotkey" style="background:#FF8A35;">2</div>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a1 1 0 0 1 0 4H4a1 1 0 0 1 0-4z"/><path d="M6 11c0-3 2.5-5 6-5s6 2 6 5"/><path d="M5 15c0 2 2 4 4 4h6c2 0 4-2 4-4"/></svg>
          <span class="num" style="position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:700;color:#FFA45C;" dir="ltr">x3</span>
        </div>

        <div class="slot" style="position:relative;">
          <div class="slot-hotkey" style="background:#FF8A35;">3</div>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span class="num" style="position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:700;color:#FFA45C;" dir="ltr">x1</span>
        </div>

        <div class="slot" style="position:relative;">
          <div class="slot-hotkey" style="background:#3ECF8E;">4</div>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span class="num" style="position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:700;color:#3ECF8E;" dir="ltr">x5</span>
        </div>

        <div class="slot" style="position:relative;">
          <div class="slot-hotkey" style="background:#5CA8FF;">5</div>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#5CA8FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
          <span class="num" style="position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:700;color:#5CA8FF;" dir="ltr">x1</span>
        </div>

        <div class="slot" style="position:relative;">
          <div class="slot-hotkey" style="background:#F5B840;">6</div>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F5B840" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="num" style="position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:700;color:#F5B840;" dir="ltr">x2</span>
        </div>

        <div class="slot" style="border-style:dashed;opacity:.5;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>

        <div class="slot" style="border-style:dashed;opacity:.5;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ favorites wheel ═══ -->
  <div class="shadow" style="display:flex;flex-direction:column;gap:14px;align-items:center;transform:perspective(1200px) rotateY(-5deg) rotateX(1deg);">
    <div class="panel" style="padding:20px;position:relative;width:280px;height:280px;display:flex;align-items:center;justify-content:center;overflow:visible;box-shadow:inset 0 1px 0 rgba(255,255,255,.07), -6px 14px 32px rgba(0,0,0,.6);">
      <svg width="280" height="280" viewBox="0 0 280 280" style="position:absolute;inset:0;">
        <circle cx="140" cy="140" r="130" fill="none" stroke="rgba(255,138,53,.1)" stroke-width="2"/>
        <circle cx="140" cy="140" r="90" fill="none" stroke="rgba(255,138,53,.15)" stroke-width="1"/>
        <circle cx="140" cy="140" r="50" fill="none" stroke="rgba(255,138,53,.2)" stroke-width="1"/>

        <!-- center -->
        <circle cx="140" cy="140" r="30" fill="rgba(255,138,53,.08)" stroke="rgba(255,164,92,.25)" stroke-width="2"/>
        <text x="140" y="145" text-anchor="middle" fill="#FFA45C" font-weight="900" font-size="12" font-family="Cairo">المفضلة</text>
      </svg>

      <!-- items around wheel -->
      <div style="position:absolute;width:200px;height:200px;">
        <!-- top -->
        <div style="position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          <span class="num" style="font-size:9px;color:#7A756C;" dir="ltr">1</span>
        </div>

        <!-- right -->
        <div style="position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a1 1 0 0 1 0 4H4a1 1 0 0 1 0-4z"/><path d="M6 11c0-3 2.5-5 6-5s6 2 6 5"/><path d="M5 15c0 2 2 4 4 4h6c2 0 4-2 4-4"/></svg>
          <span class="num" style="font-size:9px;color:#7A756C;" dir="ltr">2</span>
        </div>

        <!-- bottom -->
        <div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span class="num" style="font-size:9px;color:#7A756C;" dir="ltr">3</span>
        </div>

        <!-- left -->
        <div style="position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span class="num" style="font-size:9px;color:#7A756C;" dir="ltr">4</span>
        </div>
      </div>
    </div>

    <div style="text-align:center;font-size:11px;color:#B3ADA3;">
      <span>اضغط <span dir="ltr" style="color:#FFA45C;font-weight:800;">الزر الأيمن</span> للتدوير</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
