<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <script src="./interactive.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#0B0A09;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F7F4EF;}
    a{color:#FF7A1F;} a:hover{color:#FFA45C;}
    .kicker{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7A756C;}
    .num{font-variant-numeric:tabular-nums;}
    .tick{display:inline-block;width:8px;height:9px;border-radius:3px;background:linear-gradient(180deg,#FF9A3D,#F26B0A);transform:skewX(-14deg);margin-inline-end:8px;vertical-align:middle;}
    .glass{background:rgba(19,16,13,.9);border:1px solid rgba(255,164,92,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
    .shadow{filter:drop-shadow(0 12px 30px rgba(0,0,0,.5));}
    .glowline{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#FF8A35 30%,#FF8A35 70%,transparent);box-shadow:0 0 14px rgba(255,138,53,.55);}
    .kbd{min-width:26px;height:24px;padding:0 8px;border-radius:7px;background:#262019;border:1px solid rgba(255,164,92,.22);box-shadow:inset 0 -2px 0 rgba(0,0,0,.5);display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;box-sizing:border-box;transform:skewX(-6deg);}
    .proximity{height:4px;border-radius:2px;background:rgba(255,255,255,.08);position:relative;overflow:hidden;}
    .proximity .bar{height:100%;border-radius:2px;background:linear-gradient(90deg,#FF8A35,#FF9A3D);box-shadow:0 0 10px rgba(255,138,53,.5);}
    .btn{height:36px;padding:0 18px;border-radius:10px;background:linear-gradient(180deg,#FF9A3D,#F26B0A);color:#1A120B;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(255,122,31,.4), inset 0 1px 0 rgba(255,255,255,.35);transform:skewX(-6deg);}
    .btn>span{display:inline-block;transform:skewX(6deg);display:flex;align-items:center;gap:8px;}
  </style>
</helmet>
<div dir="rtl" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;gap:60px;padding:40px;flex-wrap:wrap;">

  <!-- ═══ standard interact prompt ═══ -->
  <div class="shadow" style="display:flex;flex-direction:column;gap:14px;transform:perspective(1200px) rotateY(-6deg) rotateX(1deg);" data-interactive="panel">
    <div class="glass" style="border-radius:14px;padding:14px 16px;width:300px;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.08), -6px 14px 32px rgba(0,0,0,.6);">
      <div class="glowline" style="position:absolute;top:0;left:16px;right:16px;"></div>

      <!-- location header -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        <div style="display:flex;flex-direction:column;gap:1px;flex:1;">
          <span style="font-size:11px;font-weight:700;color:#B3ADA3;">مصرف الدولة</span>
          <span class="kicker" dir="ltr">•  5م</span>
        </div>
      </div>

      <!-- action section -->
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="kbd" dir="ltr">E</span>
          <div style="display:flex;flex-direction:column;gap:1px;flex:1;">
            <span style="font-size:13px;font-weight:800;">سحب الأموال</span>
            <span style="font-size:11px;color:#B3ADA3;">الضغط والإمساك</span>
          </div>
        </div>
        <div class="proximity" style="width:100%;">
          <div class="bar" style="width:85%;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ compact interact ═══ -->
  <div class="shadow" style="display:flex;flex-direction:column;gap:14px;" data-interactive="panel">
    <div class="glass" style="border-radius:12px;padding:10px 12px;width:220px;position:relative;overflow:hidden;">
      <div class="glowline" style="position:absolute;top:0;left:12px;right:12px;opacity:.4;"></div>

      <div style="display:flex;align-items:center;gap:10px;">
        <div style="display:flex;align-items:center;gap:6px;flex:1;">
          <span class="kbd" style="min-width:20px;" dir="ltr">F</span>
          <div style="display:flex;flex-direction:column;gap:0px;">
            <span style="font-size:12px;font-weight:800;">فتح السيارة</span>
            <span class="kicker">فورية</span>
          </div>
        </div>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- ═══ complex interaction (multiple options) ═══ -->
  <div class="shadow" style="display:flex;flex-direction:column;gap:14px;transform:perspective(1200px) rotateY(5deg) rotateX(-1deg);" data-interactive="panel">
    <div class="glass" style="border-radius:14px;padding:14px 16px;width:320px;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 5px 12px 28px rgba(0,0,0,.5);">
      <div class="glowline" style="position:absolute;top:0;left:16px;right:16px;"></div>

      <!-- location -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <div style="display:flex;flex-direction:column;gap:1px;flex:1;">
          <span style="font-size:11px;font-weight:700;color:#B3ADA3;">خزينة فندق جراند</span>
          <span class="kicker" dir="ltr">•  2م</span>
        </div>
      </div>

      <!-- options -->
      <div style="display:flex;flex-direction:column;gap:8px;">
        <!-- option 1 -->
        <div style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:rgba(255,138,53,.06);border:1px solid rgba(255,164,92,.15);">
          <span class="kbd" style="min-width:20px;" dir="ltr">E</span>
          <div style="display:flex;flex-direction:column;gap:1px;flex:1;">
            <span style="font-size:12px;font-weight:800;">فتح الخزينة</span>
            <span style="font-size:10px;color:#B3ADA3;">مدة الاختراق: 30ث</span>
          </div>
        </div>

        <!-- option 2 -->
        <div style="display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:rgba(255,93,93,.06);border:1px solid rgba(255,93,93,.15);">
          <span class="kbd" style="min-width:20px;" dir="ltr">R</span>
          <div style="display:flex;flex-direction:column;gap:1px;flex:1;">
            <span style="font-size:12px;font-weight:800;">الاقتراب أكثر</span>
            <span style="font-size:10px;color:#B3ADA3;">أنت بعيد جداً (5م)</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ hold to interact (progress) ═══ -->
  <div class="shadow" style="display:flex;flex-direction:column;gap:14px;transform:perspective(1200px) rotateY(-4deg) rotateX(0.5deg);" data-interactive="panel">
    <div class="glass" style="border-radius:14px;padding:14px 16px;width:280px;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.08), -4px 10px 26px rgba(0,0,0,.55);">
      <div class="glowline" style="position:absolute;top:0;left:16px;right:16px;"></div>

      <!-- action -->
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
        <span class="kbd" dir="ltr">E</span>
        <span style="font-size:13px;font-weight:800;">تفتيش الجثة</span>
      </div>

      <!-- progress bar -->
      <div style="display:flex;flex-direction:column;gap:6px;">
        <div class="proximity" style="width:100%;height:6px;">
          <div class="bar" style="width:62%;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:10px;color:#B3ADA3;">جارٍ...</span>
          <span class="num" dir="ltr" style="font-size:11px;color:#FFA45C;font-weight:800;">2.5 / 4.0ث</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ unavailable interact ═══ -->
  <div class="shadow" style="display:flex;flex-direction:column;gap:14px;" data-interactive="panel">
    <div style="border-radius:14px;padding:14px 16px;width:280px;position:relative;overflow:hidden;background:rgba(19,16,13,.6);border:1px solid rgba(255,164,92,.08);">

      <div style="display:flex;align-items:center;gap:10px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A756C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="15" y1="9" x2="9" y2="15"/>
          <line x1="9" y1="9" x2="15" y2="15"/>
        </svg>
        <div style="display:flex;flex-direction:column;gap:1px;">
          <span style="font-size:12px;font-weight:800;color:#B3ADA3;">الباب مغلق</span>
          <span style="font-size:10px;color:#7A756C;">في الانتظار: <span dir="ltr">3 دقائق</span></span>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
