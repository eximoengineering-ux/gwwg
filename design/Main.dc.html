<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#0B0B0C;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F5F5F3;}
    a{color:#FF7A1F;} a:hover{color:#FFA45C;}
    @keyframes pulseWarn{0%,100%{opacity:1;}50%{opacity:.35;}}
    @keyframes slideIn{from{transform:translateY(-8px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    .num{font-variant-numeric:tabular-nums;}
  </style>
</helmet>
<div style="width:1440px;height:810px;position:relative;overflow:hidden;background:
  radial-gradient(900px 420px at 70% -10%, rgba(255,122,31,.10), transparent 60%),
  radial-gradient(1200px 700px at 50% 120%, #1a1c22 0%, transparent 60%),
  linear-gradient(180deg,#101218 0%,#0B0C10 45%,#0B0B0C 100%);">

  <!-- simulated environment depth -->
  <div style="position:absolute;bottom:0;left:0;right:0;height:300px;background:linear-gradient(180deg,transparent, rgba(0,0,0,.55));"></div>
  <div style="position:absolute;bottom:120px;left:180px;width:220px;height:180px;background:rgba(255,255,255,.02);border-radius:4px;"></div>
  <div style="position:absolute;bottom:100px;left:430px;width:150px;height:230px;background:rgba(255,255,255,.025);border-radius:4px;"></div>
  <div style="position:absolute;bottom:140px;right:260px;width:260px;height:150px;background:rgba(255,255,255,.02);border-radius:4px;"></div>

  <!-- ===== Top right (RTL): server + money ===== -->
  <div dir="rtl" style="position:absolute;top:24px;inset-inline-start:24px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;">
    <div style="display:flex;align-items:center;gap:10px;background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;backdrop-filter:blur(14px);">
      <div style="width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#FF7A1F,#E85D04);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;color:#14100B;">MT</div>
      <div style="display:flex;flex-direction:column;">
        <span style="font-size:12px;font-weight:800;line-height:1.2;">MT ROLEPLAY</span>
        <span class="num" dir="ltr" style="font-size:10px;color:#A8A8A4;font-weight:600;line-height:1.2;">ID 245 · 21:47</span>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;align-items:center;gap:10px;background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 12px;backdrop-filter:blur(14px);min-width:150px;box-sizing:border-box;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>
        <span class="num" dir="ltr" style="font-size:15px;font-weight:800;color:#3ECF8E;">$ 12,450</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 12px;backdrop-filter:blur(14px);min-width:150px;box-sizing:border-box;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#A8A8A4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M4 18V10M8 18V10M12 18V10M16 18V10M20 18V10"/><path d="m2 10 10-6 10 6"/></svg>
        <span class="num" dir="ltr" style="font-size:15px;font-weight:800;color:#F5F5F3;">$ 86,300</span>
      </div>
    </div>
  </div>

  <!-- ===== In-context notification (top-left visually = inset-inline-end in RTL) ===== -->
  <div dir="rtl" style="position:absolute;top:24px;inset-inline-end:24px;display:flex;flex-direction:column;gap:8px;animation:slideIn .2s ease-out;">
    <div style="display:flex;align-items:center;gap:12px;background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-inline-start:3px solid #3ECF8E;border-radius:8px;padding:12px 14px;backdrop-filter:blur(14px);min-width:280px;box-shadow:0 12px 32px rgba(0,0,0,.45);box-sizing:border-box;">
      <div style="width:34px;height:34px;border-radius:8px;background:rgba(62,207,142,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
      </div>
      <div style="display:flex;flex-direction:column;gap:1px;">
        <span style="font-size:13px;font-weight:800;">تم حفظ المركبة</span>
        <span style="font-size:11px;color:#A8A8A4;font-weight:600;">أُرسلت السيارة إلى الكراج B</span>
      </div>
    </div>
  </div>

  <!-- ===== Interaction prompt (center-bottom) ===== -->
  <div dir="rtl" style="position:absolute;bottom:220px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 14px;backdrop-filter:blur(14px);box-shadow:0 12px 32px rgba(0,0,0,.45);">
    <span dir="ltr" style="min-width:28px;height:28px;padding:0 7px;border-radius:6px;background:#FF7A1F;color:#14100B;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;box-sizing:border-box;">E</span>
    <span style="font-size:13px;font-weight:700;">فتح باب المركبة</span>
  </div>

  <!-- ===== Bottom left (RTL start): status + minimap ===== -->
  <div dir="rtl" style="position:absolute;bottom:24px;inset-inline-start:24px;display:flex;flex-direction:column;gap:10px;">
    <!-- status rings -->
    <div style="display:flex;gap:8px;align-items:flex-end;">
      <!-- health -->
      <div style="position:relative;width:46px;height:46px;">
        <svg width="46" height="46" viewBox="0 0 46 46" style="transform:rotate(-90deg);">
          <circle cx="23" cy="23" r="19" fill="rgba(19,19,21,.86)" stroke="rgba(255,255,255,.12)" stroke-width="3.5"/>
          <circle cx="23" cy="23" r="19" fill="none" stroke="#FF7A1F" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="101 119.4"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F5F3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.51 4.04 3 5.5l7 7z"/></svg>
        </div>
      </div>
      <!-- armor -->
      <div style="position:relative;width:46px;height:46px;">
        <svg width="46" height="46" viewBox="0 0 46 46" style="transform:rotate(-90deg);">
          <circle cx="23" cy="23" r="19" fill="rgba(19,19,21,.86)" stroke="rgba(255,255,255,.12)" stroke-width="3.5"/>
          <circle cx="23" cy="23" r="19" fill="none" stroke="#5CA8FF" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="60 119.4"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F5F5F3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
        </div>
      </div>
      <!-- hunger -->
      <div style="position:relative;width:46px;height:46px;">
        <svg width="46" height="46" viewBox="0 0 46 46" style="transform:rotate(-90deg);">
          <circle cx="23" cy="23" r="19" fill="rgba(19,19,21,.86)" stroke="rgba(255,255,255,.12)" stroke-width="3.5"/>
          <circle cx="23" cy="23" r="19" fill="none" stroke="#FFC53D" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="78 119.4"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5F5F3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>
        </div>
      </div>
      <!-- thirst -->
      <div style="position:relative;width:46px;height:46px;">
        <svg width="46" height="46" viewBox="0 0 46 46" style="transform:rotate(-90deg);">
          <circle cx="23" cy="23" r="19" fill="rgba(19,19,21,.86)" stroke="rgba(255,255,255,.12)" stroke-width="3.5"/>
          <circle cx="23" cy="23" r="19" fill="none" stroke="#5CE0FF" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="30 119.4"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:pulseWarn 1.6s ease-in-out infinite;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5CE0FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
        </div>
      </div>
      <!-- stamina -->
      <div style="position:relative;width:46px;height:46px;">
        <svg width="46" height="46" viewBox="0 0 46 46" style="transform:rotate(-90deg);">
          <circle cx="23" cy="23" r="19" fill="rgba(19,19,21,.86)" stroke="rgba(255,255,255,.12)" stroke-width="3.5"/>
          <circle cx="23" cy="23" r="19" fill="none" stroke="#3ECF8E" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="107 119.4"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F5F5F3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        </div>
      </div>
      <!-- voice -->
      <div style="position:relative;width:46px;height:46px;">
        <svg width="46" height="46" viewBox="0 0 46 46" style="transform:rotate(-90deg);">
          <circle cx="23" cy="23" r="19" fill="rgba(19,19,21,.86)" stroke="rgba(255,255,255,.12)" stroke-width="3.5"/>
          <circle cx="23" cy="23" r="19" fill="none" stroke="#FF7A1F" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="80 119.4"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
        </div>
      </div>
    </div>
    <!-- street label -->
    <div style="display:flex;align-items:center;gap:8px;background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:7px 12px;backdrop-filter:blur(14px);align-self:flex-start;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF7A1F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <span style="font-size:12px;font-weight:700;">شارع فينوود</span>
      <span style="font-size:11px;color:#78786F;font-weight:600;">· لوس سانتوس</span>
    </div>
    <!-- minimap -->
    <div style="width:280px;height:158px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:#101114;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.45);">
      <div style="position:absolute;inset:0;background:
        linear-gradient(90deg,transparent 48%,rgba(255,255,255,.05) 49%,rgba(255,255,255,.05) 51%,transparent 52%),
        linear-gradient(0deg,transparent 30%,rgba(255,255,255,.05) 31%,rgba(255,255,255,.05) 33%,transparent 34%),
        linear-gradient(35deg,transparent 60%,rgba(255,255,255,.04) 61%,rgba(255,255,255,.04) 63%,transparent 64%),
        radial-gradient(200px 120px at 20% 80%, rgba(92,168,255,.08), transparent 60%);"></div>
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:12px;height:12px;">
        <div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #FF7A1F;filter:drop-shadow(0 0 6px rgba(255,122,31,.8));"></div>
      </div>
      <div style="position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;color:rgba(245,245,243,.6);background:rgba(11,11,12,.6);border-radius:4px;padding:2px 6px;">N</div>
    </div>
  </div>

  <!-- ===== Bottom right: vehicle cluster ===== -->
  <div dir="rtl" style="position:absolute;bottom:24px;inset-inline-end:24px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;">
    <div style="background:rgba(19,19,21,.86);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:14px 18px;backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 32px rgba(0,0,0,.45);min-width:220px;box-sizing:border-box;">
      <!-- speed row -->
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
          <span style="font-size:10px;color:#78786F;font-weight:700;">الغيار</span>
          <span class="num" dir="ltr" style="font-size:20px;font-weight:900;color:#FFA45C;">3</span>
        </div>
        <div style="display:flex;align-items:baseline;gap:8px;" dir="ltr">
          <span class="num" style="font-size:44px;font-weight:900;line-height:1;">87</span>
          <span style="font-size:12px;font-weight:700;color:#78786F;">KM/H</span>
        </div>
      </div>
      <!-- rpm segments -->
      <div dir="ltr" style="display:flex;gap:3px;">
        <div style="flex:1;height:5px;border-radius:2px;background:#FF7A1F;"></div>
        <div style="flex:1;height:5px;border-radius:2px;background:#FF7A1F;"></div>
        <div style="flex:1;height:5px;border-radius:2px;background:#FF7A1F;"></div>
        <div style="flex:1;height:5px;border-radius:2px;background:#FF7A1F;"></div>
        <div style="flex:1;height:5px;border-radius:2px;background:#FFA45C;"></div>
        <div style="flex:1;height:5px;border-radius:2px;background:#242428;"></div>
        <div style="flex:1;height:5px;border-radius:2px;background:#242428;"></div>
        <div style="flex:1;height:5px;border-radius:2px;background:#242428;"></div>
      </div>
      <!-- fuel + indicators -->
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
        <div style="display:flex;align-items:center;gap:8px;flex:1;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A8A8A4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M2 22h12"/><path d="M13 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg>
          <div style="flex:1;height:5px;border-radius:999px;background:#242428;overflow:hidden;" dir="ltr"><div style="height:100%;width:68%;background:#A8A8A4;border-radius:999px;"></div></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <svg style="animation:pulseWarn 1.2s ease-in-out infinite;" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FF5D5D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a4 4 0 0 1 4 4v12"/><path d="M4 4v9a3 3 0 0 0 3 3h8"/><circle cx="8" cy="9" r="1.6"/></svg>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
