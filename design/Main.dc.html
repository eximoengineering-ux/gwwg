<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
  <style>
    body{margin:0;background:#0B0A09;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;color:#F7F4EF;}
    a{color:#FF7A1F;} a:hover{color:#FFA45C;}
    @keyframes pulseWarn{0%,100%{opacity:1;}50%{opacity:.3;}}
    @keyframes slideIn{from{transform:translateY(-10px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    .num{font-variant-numeric:tabular-nums;}
    .kicker{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7A756C;}
    .glass{background:rgba(19,16,13,.9);border:1px solid rgba(255,164,92,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);}
    .shadow{filter:drop-shadow(0 16px 36px rgba(0,0,0,.5));}
    .seg{width:11px;height:5px;border-radius:3px;}
    .glowline{height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#FF8A35 30%,#FF8A35 70%,transparent);box-shadow:0 0 14px rgba(255,138,53,.55);}
    .kbd{min-width:26px;height:26px;padding:0 7px;border-radius:7px;background:linear-gradient(180deg,#FF9A3D,#F26B0A);color:#1A120B;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;box-sizing:border-box;box-shadow:0 3px 12px rgba(255,122,31,.45), inset 0 1px 0 rgba(255,255,255,.35);transform:skewX(-6deg);}
  </style>
</helmet>
<div dir="rtl" style="width:1440px;height:810px;position:relative;overflow:hidden;background:
  radial-gradient(1100px 560px at 15% 110%, rgba(255,122,31,.16), transparent 60%),
  radial-gradient(1400px 800px at 55% -30%, #1A1E2A 0%, transparent 62%),
  linear-gradient(180deg,#131722 0%,#0F0D0C 58%,#0B0A09 100%);">

  <!-- warm dusk scene -->
  <div style="position:absolute;bottom:0;left:0;right:0;height:340px;background:linear-gradient(180deg,transparent, rgba(8,6,5,.75));"></div>
  <div style="position:absolute;bottom:150px;left:200px;width:210px;height:190px;background:rgba(255,220,180,.025);"></div>
  <div style="position:absolute;bottom:130px;left:450px;width:140px;height:250px;background:rgba(255,220,180,.03);"></div>
  <div style="position:absolute;bottom:160px;right:300px;width:250px;height:160px;background:rgba(255,220,180,.025);"></div>
  <div style="position:absolute;bottom:210px;right:180px;width:90px;height:280px;background:rgba(255,220,180,.02);"></div>

  <!-- ═══ Top inline-start: brand + wallet ═══ -->
  <div style="position:absolute;top:28px;inset-inline-start:28px;display:flex;flex-direction:column;gap:10px;">
    <div class="shadow"><div class="glass" style="border-radius:14px;display:flex;align-items:center;gap:10px;padding:9px 16px;">
      <div style="width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#FF9A3D,#F26B0A);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;color:#1A120B;transform:skewX(-6deg);box-shadow:0 3px 12px rgba(255,122,31,.45), inset 0 1px 0 rgba(255,255,255,.35);"><span style="display:inline-block;transform:skewX(6deg);">MT</span></div>
      <div style="display:flex;flex-direction:column;">
        <span style="font-size:12px;font-weight:800;line-height:1.3;">MT ROLEPLAY</span>
        <span class="num kicker" dir="ltr" style="line-height:1.4;">ID 245 &nbsp;·&nbsp; 21:47</span>
      </div>
    </div></div>
    <div class="shadow"><div class="glass" style="border-radius:14px;min-width:176px;box-sizing:border-box;overflow:hidden;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 16px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>
        <span class="num" dir="ltr" style="font-size:15px;font-weight:800;letter-spacing:.02em;">$12,450</span>
      </div>
      <div class="glowline" style="margin:0 14px;opacity:.55;"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 16px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M4 18V10M9 18V10M15 18V10M20 18V10"/><path d="m2 10 10-6 10 6"/></svg>
        <span class="num" dir="ltr" style="font-size:13px;font-weight:700;color:#B3ADA3;letter-spacing:.02em;">$86,300</span>
      </div>
    </div></div>
  </div>

  <!-- ═══ Toast (top inline-end): ring-timer chip ═══ -->
  <div dir="rtl" style="position:absolute;top:28px;inset-inline-end:28px;animation:slideIn .2s ease-out;">
    <div class="shadow"><div class="glass" style="border-radius:14px;display:flex;align-items:center;gap:12px;padding:11px 16px;min-width:290px;box-sizing:border-box;">
      <div style="position:relative;width:42px;height:42px;flex-shrink:0;">
        <svg width="42" height="42" viewBox="0 0 42 42" style="position:absolute;inset:0;transform:rotate(-90deg);">
          <circle cx="21" cy="21" r="19" fill="rgba(62,207,142,.1)" stroke="rgba(255,255,255,.09)" stroke-width="2.5"/>
          <circle cx="21" cy="21" r="19" fill="none" stroke="#3ECF8E" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="84 119.4"/>
        </svg>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:1px;">
        <span style="font-size:13px;font-weight:800;">تم حفظ المركبة</span>
        <span style="font-size:11px;color:#B3ADA3;font-weight:600;">أُرسلت السيارة إلى الكراج B</span>
      </div>
    </div></div>
  </div>

  <!-- ═══ Interaction callout ═══ -->
  <div dir="rtl" style="position:absolute;bottom:222px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;">
    <div style="width:6px;height:6px;border-radius:999px;background:#FF8A35;box-shadow:0 0 14px 4px rgba(255,138,53,.6);"></div>
    <div style="width:1px;height:20px;background:linear-gradient(180deg,#FF8A35,rgba(255,138,53,.05));"></div>
    <div class="shadow"><div class="glass" style="border-radius:12px;display:flex;align-items:center;gap:12px;padding:9px 16px 9px 12px;">
      <span class="kbd" dir="ltr">E</span>
      <span style="font-size:13px;font-weight:700;">فتح باب المركبة</span>
    </div></div>
  </div>

  <!-- ═══ Bottom inline-start: minimap + status ═══ -->
  <div dir="rtl" style="position:absolute;bottom:28px;inset-inline-start:28px;display:flex;flex-direction:column;gap:10px;">
    <div style="display:flex;align-items:center;gap:8px;">
      <div style="width:8px;height:9px;border-radius:3px;background:linear-gradient(180deg,#FF9A3D,#F26B0A);transform:skewX(-14deg);"></div>
      <span style="font-size:12px;font-weight:800;">شارع فينوود</span>
      <span style="font-size:11px;color:#7A756C;font-weight:600;">لوس سانتوس</span>
      <div style="flex:1;height:1px;background:linear-gradient(-90deg,rgba(255,138,53,.4),transparent);min-width:40px;"></div>
    </div>
    <div class="shadow"><div style="width:290px;height:160px;border-radius:16px;border:1px solid rgba(255,164,92,.16);background:#121013;position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);">
      <div style="position:absolute;inset:0;background:
        linear-gradient(90deg,transparent 48%,rgba(255,235,210,.06) 49%,rgba(255,235,210,.06) 51%,transparent 52%),
        linear-gradient(0deg,transparent 34%,rgba(255,235,210,.06) 35%,rgba(255,235,210,.06) 37%,transparent 38%),
        linear-gradient(32deg,transparent 60%,rgba(255,235,210,.05) 61%,rgba(255,235,210,.05) 63%,transparent 64%),
        radial-gradient(220px 130px at 18% 82%, rgba(92,168,255,.08), transparent 60%);"></div>
      <div style="position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);">
        <div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid #FF8A35;filter:drop-shadow(0 0 8px rgba(255,138,53,.9));"></div>
      </div>
      <div style="position:absolute;top:8px;inset-inline-end:8px;width:22px;height:22px;border-radius:8px;background:rgba(10,9,8,.7);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:rgba(247,244,239,.65);">N</div>
      <div class="glowline" style="position:absolute;top:0;left:24px;right:24px;opacity:.5;"></div>
      <div style="position:absolute;bottom:0;left:0;right:0;padding:18px 14px 9px;background:linear-gradient(0deg,rgba(8,7,6,.9),transparent);display:flex;align-items:center;gap:7px;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FF8A35" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <span class="num kicker" dir="ltr">GPS · Vinewood Blvd</span>
      </div>
    </div></div>
    <div class="shadow"><div class="glass" style="border-radius:999px;display:flex;align-items:center;gap:17px;padding:11px 20px;align-self:flex-start;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F7F4EF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.51 4.04 3 5.5l7 7z"/></svg>
        <div style="display:flex;gap:2px;" dir="ltr"><div class="seg" style="background:#FF8A35;"></div><div class="seg" style="background:#FF8A35;"></div><div class="seg" style="background:#FF8A35;"></div><div class="seg" style="background:#FF8A35;"></div><div class="seg" style="background:rgba(255,255,255,.14);"></div></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F7F4EF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
        <div style="display:flex;gap:2px;" dir="ltr"><div class="seg" style="background:#5CA8FF;"></div><div class="seg" style="background:#5CA8FF;"></div><div class="seg" style="background:#5CA8FF;"></div><div class="seg" style="background:rgba(255,255,255,.14);"></div><div class="seg" style="background:rgba(255,255,255,.14);"></div></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F7F4EF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg>
        <div style="display:flex;gap:2px;" dir="ltr"><div class="seg" style="background:#F5B840;"></div><div class="seg" style="background:#F5B840;"></div><div class="seg" style="background:#F5B840;"></div><div class="seg" style="background:rgba(255,255,255,.14);"></div><div class="seg" style="background:rgba(255,255,255,.14);"></div></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;animation:pulseWarn 1.6s ease-in-out infinite;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5CA8FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
        <div style="display:flex;gap:2px;" dir="ltr"><div class="seg" style="background:#5CA8FF;"></div><div class="seg" style="background:rgba(255,255,255,.14);"></div><div class="seg" style="background:rgba(255,255,255,.14);"></div><div class="seg" style="background:rgba(255,255,255,.14);"></div><div class="seg" style="background:rgba(255,255,255,.14);"></div></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F7F4EF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        <div style="display:flex;gap:2px;" dir="ltr"><div class="seg" style="background:#3ECF8E;"></div><div class="seg" style="background:#3ECF8E;"></div><div class="seg" style="background:#3ECF8E;"></div><div class="seg" style="background:#3ECF8E;"></div><div class="seg" style="background:#3ECF8E;"></div></div>
      </div>
      <div style="width:1px;height:28px;background:rgba(255,164,92,.15);"></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFA45C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
        <div style="display:flex;gap:2px;" dir="ltr"><div class="seg" style="width:9px;background:#FF8A35;"></div><div class="seg" style="width:9px;background:#FF8A35;"></div><div class="seg" style="width:9px;background:rgba(255,255,255,.14);"></div></div>
      </div>
    </div></div>
  </div>

  <!-- ═══ Bottom inline-end: speed cluster ═══ -->
  <div dir="rtl" style="position:absolute;bottom:28px;inset-inline-end:28px;">
    <div class="shadow"><div class="glass" style="border-radius:18px;padding:16px 22px 14px;display:flex;flex-direction:column;gap:10px;box-sizing:border-box;position:relative;overflow:hidden;min-width:252px;">
      <div class="glowline" style="position:absolute;top:0;left:28px;right:28px;"></div>
      <div style="position:absolute;inset:0;background:radial-gradient(220px 120px at 50% 30%, rgba(255,122,31,.09), transparent 70%);pointer-events:none;"></div>
      <div style="position:relative;width:206px;height:120px;align-self:center;" dir="ltr">
        <svg width="206" height="120" viewBox="0 0 206 120">
          <path d="M23 112 A80 80 0 0 1 183 112" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="8" stroke-linecap="round"/>
          <path d="M23 112 A80 80 0 0 1 183 112" fill="none" stroke="url(#rpmGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="163 252" style="filter:drop-shadow(0 0 10px rgba(255,138,53,.55));"/>
          <defs><linearGradient id="rpmGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F26B0A"/><stop offset="1" stop-color="#FF9A3D"/></linearGradient></defs>
        </svg>
        <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:2px;">
          <span class="num" style="font-size:52px;font-weight:900;line-height:1;letter-spacing:-.01em;text-shadow:0 0 28px rgba(255,138,53,.35);">87</span>
          <span class="kicker" style="margin-top:3px;">km/h</span>
        </div>
        <span class="kicker" style="position:absolute;left:12px;bottom:0;">RPM</span>
        <div style="position:absolute;right:2px;bottom:0;display:flex;align-items:baseline;gap:3px;"><span class="num" style="font-size:15px;font-weight:900;color:#FFA45C;">3</span><span class="kicker" style="font-size:8px;">gear</span></div>
      </div>
      <div style="height:1px;background:rgba(255,164,92,.12);"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;">
        <div style="display:flex;align-items:center;gap:8px;flex:1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B3ADA3" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 22V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M2 22h12"/><path d="M13 10h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg>
          <div style="display:flex;gap:2px;flex:1;" dir="ltr"><div class="seg" style="flex:1;background:#B3ADA3;"></div><div class="seg" style="flex:1;background:#B3ADA3;"></div><div class="seg" style="flex:1;background:#B3ADA3;"></div><div class="seg" style="flex:1;background:rgba(255,255,255,.14);"></div><div class="seg" style="flex:1;background:rgba(255,255,255,.14);"></div></div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;">
          <svg style="animation:pulseWarn 1.2s ease-in-out infinite;" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FF5D5D" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h11a4 4 0 0 1 4 4v12"/><path d="M4 4v9a3 3 0 0 0 3 3h8"/><circle cx="8" cy="9" r="1.6"/></svg>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3ECF8E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        </div>
      </div>
    </div></div>
  </div>

</div>
</x-dc>
</body>
</html>
